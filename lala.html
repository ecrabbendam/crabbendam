<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Sav ❤️</title>
    <style>
        body {
            background-color: #ffdae0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            position: relative;
        }

        .card {
            background-color: white;
            width: 85%;
            max-width: 600px; 
            min-height: 400px;
            padding: 40px;
            border-radius: 40px;
            box-shadow: 0 20px 50px rgba(255, 20, 147, 0.2);
            text-align: center;
            border: 5px solid #ff80ab;
            z-index: 100;
            transition: all 0.5s ease;
        }

        h1 { color: #d81b60; font-size: 2.8rem; margin-bottom: 40px; }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 60px;
            position: relative;
            height: 80px;
        }

        button {
            padding: 15px 40px;
            font-size: 24px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        #yesBtn { background-color: #ff4081; color: white; }

        #noBtn { 
            background-color: #ffc1e3; 
            color: #d81b60; 
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        /* Fixed Photo Container to prevent overflow */
        .floating-photo {
            position: absolute;
            width: 250px; /* Slightly smaller to ensure fit on more screens */
            height: 250px;
            object-fit: cover;
            border-radius: 20px;
            border: 8px solid white;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
            opacity: 0; 
            transition: opacity 1.2s ease-in-out;
            z-index: 10;
            animation: floatSlightly 5s infinite ease-in-out;
        }

        @keyframes floatSlightly {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(3deg); }
        }

        .heart-fall {
            position: absolute;
            color: #ff80ab;
            opacity: 0.6;
            top: -50px;
            z-index: 1;
            animation: fall linear infinite;
        }

        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); }
        }
    </style>
</head>
<body>

    <img src="images/IMG_0881.jpeg" class="floating-photo" style="top: 2%; left: 2%; animation-delay: 0s;">
    <img src="images/IMG_4880.jpeg" class="floating-photo" style="top: 2%; left: calc(100% - 270px); animation-delay: 0.5s;">
    
    <img src="images/IMG_4132.jpeg" class="floating-photo" style="top: calc(100% - 270px); left: 2%; animation-delay: 1s;">
    <img src="images/IMG_0105.jpg" class="floating-photo" style="top: calc(100% - 270px); left: calc(100% - 270px); animation-delay: 1.5s;">
    
    <img src="images/IMG_7081.jpeg" class="floating-photo" style="top: calc(50% - 125px); left: 2%; animation-delay: 2s;">
    <img src="images/IMG_3125.jpeg" class="floating-photo" style="top: calc(50% - 125px); left: calc(100% - 270px); animation-delay: 2.5s;">

    <div class="card" id="mainCard">
        <h1 id="titleText">Sav, will you be my Valentine? ❤️</h1>
        <div class="btn-container" id="btnHolder">
            <button id="yesBtn" onclick="celebrate()">Yes</button>
            <button id="noBtn" onmouseover="moveNo()">No</button>
        </div>
    </div>

    <script>
        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart-fall';
            heart.innerText = ['❤️', '💖', '💗', '💓'][Math.floor(Math.random() * 4)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = (Math.random() * 20 + 20) + 'px';
            heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 5000);
        }
        setInterval(createHeart, 250);

        function moveNo() {
            const noBtn = document.getElementById('noBtn');
            // Keeps the "No" button movement safely within the screen
            const x = Math.random() * (window.innerWidth - 150);
            const y = Math.random() * (window.innerHeight - 80);
            noBtn.style.position = 'fixed';
            noBtn.style.left = `${x}px`;
            noBtn.style.top = `${y}px`;
        }

        function celebrate() {
            document.getElementById('mainCard').innerHTML = `
                <h1 style="font-size: 4rem; color: #ff4081; margin: 0;">SCORE!!!</h1>
                <p style="font-size: 1.6rem; color: #d81b60; font-weight: bold;">
                    I love you baby, Happy Valentine's Day!
                </p>
                <div style="font-size: 50px;">❤️❤️💐🌸🌹💓</div>
            `;

            const photos = document.querySelectorAll('.floating-photo');
            photos.forEach(photo => {
                photo.style.opacity = '1';
            });

            document.body.style.backgroundColor = "#ff80ab";
        }
    </script>
</body>
</html>
