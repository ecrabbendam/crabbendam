<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Sav ❤️</title>
    <style>
        body {
            background-color: #ffdae0; /* Solid pink background */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .card {
            background-color: white;
            width: 85%;
            max-width: 700px; 
            min-height: 450px;
            padding: 50px;
            border-radius: 40px;
            box-shadow: 0 20px 50px rgba(255, 20, 147, 0.15);
            text-align: center;
            border: 5px solid #ff80ab;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            z-index: 10;
        }

        h1 {
            color: #d81b60;
            font-size: 3.5rem;
            margin-bottom: 50px;
        }

        /* Button Container to prevent overlapping */
        .btn-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 50px; /* Large gap so they are clearly separated */
            width: 100%;
            position: relative;
        }

        button {
            padding: 18px 45px;
            font-size: 24px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            min-width: 140px;
        }

        #yesBtn {
            background-color: #ff4081;
            color: white;
            transition: transform 0.2s;
        }

        #yesBtn:hover {
            transform: scale(1.1);
        }

        #noBtn {
            background-color: #eeeeee;
            color: #777;
            /* Smooth sliding transition */
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative; 
            z-index: 20;
        }

        /* Decorative Background Hearts */
        .heart-decor {
            position: absolute;
            font-size: 50px;
            color: #ff80ab;
            opacity: 0.4;
            user-select: none;
        }
    </style>
</head>
<body>

    <div class="heart-decor" style="top: 10%; left: 10%;">❤️</div>
    <div class="heart-decor" style="top: 15%; right: 12%;">💖</div>
    <div class="heart-decor" style="bottom: 12%; left: 15%;">💗</div>
    <div class="heart-decor" style="bottom: 8%; right: 8%;">❤️</div>

    <div class="card" id="mainCard">
        <h1>Sav, will you be my Valentine? ❤️</h1>
        <div class="btn-container">
            <button id="yesBtn" onclick="celebrate()">Yes</button>
            <button id="noBtn" onmouseover="moveNo()">No</button>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');

        function moveNo() {
            // Calculate random coordinates
            // Subtracting 150-200px ensures it doesn't slide off the very edge
            const x = Math.random() * (window.innerWidth - 200);
            const y = Math.random() * (window.innerHeight - 100);

            // Once it moves the first time, we set it to fixed so it can go anywhere
            noBtn.style.position = 'fixed';
            noBtn.style.left = `${x}px`;
            noBtn.style.top = `${y}px`;
        }

        function celebrate() {
            const card = document.getElementById('mainCard');
            noBtn.style.display = 'none'; // Get rid of the no button
            
            card.innerHTML = `
                <h1 style="font-size: 5rem; color: #ff4081; margin-bottom: 20px;">SCORE!!!</h1>
                <p style="font-size: 1.8rem; color: #d81b60; font-weight: bold;">
                    I love you baby, Happy Valentine's Day!
                </p>
                <div style="font-size: 80px; margin-top: 20px;">🌹💑✨</div>
            `;
            
            document.body.style.backgroundColor = "#ff80ab";
        }
    </script>

</body>
</html>
