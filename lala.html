<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Sav ❤️</title>
    <style>
        body {
            background-color: #ffdae0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* The Card */
        .card {
            background-color: white;
            width: 85%;
            max-width: 700px; 
            min-height: 450px;
            padding: 50px;
            border-radius: 40px;
            box-shadow: 0 20px 50px rgba(255, 20, 147, 0.2);
            text-align: center;
            border: 5px solid #ff80ab;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            z-index: 10; /* Ensures card stays above the background hearts */
        }

        h1 {
            color: #d81b60;
            font-size: 3.5rem;
            margin-bottom: 50px;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 60px; 
            width: 100%;
            position: relative;
        }

        button {
            padding: 18px 45px;
            font-size: 24px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            min-width: 140px;
        }

        #yesBtn {
            background-color: #ff4081;
            color: white;
            transition: transform 0.2s;
        }

        #yesBtn:hover {
            transform: scale(1.1);
        }

        #noBtn {
            background-color: #eeeeee;
            color: #777;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative; 
            z-index: 20;
        }

        /* Background Heart Styling */
        .heart-decor {
            position: absolute;
            color: #ff80ab;
            opacity: 0.5;
            user-select: none;
            z-index: 1;
            animation: float 6s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
    </style>
</head>
<body>

    <div class="card" id="mainCard">
        <h1>Sav, will you be my Valentine? ❤️</h1>
        <div class="btn-container">
            <button id="yesBtn" onclick="celebrate()">Yes</button>
            <button id="noBtn" onmouseover="moveNo()">No</button>
        </div>
    </div>

    <script>
        // Create "a lot" of background hearts automatically
        const heartCount = 40;
        const heartEmojis = ['❤️', '💖', '💗', '💓', '💕'];
        
        for (let i = 0; i < heartCount; i++) {
            const heart = document.createElement('div');
            heart.className = 'heart-decor';
            heart.innerText = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.top = Math.random() * 100 + 'vh';
            heart.style.fontSize = (Math.random() * 30 + 20) + 'px';
            heart.style.animationDelay = (Math.random() * 5) + 's';
            document.body.appendChild(heart);
        }

        const noBtn = document.getElementById('noBtn');

        function moveNo() {
            const x = Math.random() * (window.innerWidth - 200);
            const y = Math.random() * (window.innerHeight - 100);

            noBtn.style.position = 'fixed';
            noBtn.style.left = `${x}px`;
            noBtn.style.top = `${y}px`;
        }

        function celebrate() {
            const card = document.getElementById('mainCard');
            noBtn.style.display = 'none';
            
            card.innerHTML = `
                <h1 style="font-size: 5rem; color: #ff4081; margin-bottom: 20px;">SCORE!!!</h1>
                <p style="font-size: 1.8rem; color: #d81b60; font-weight: bold;">
                    I love you baby, Happy Valentine's Day!
                </p>
                <div style="font-size: 80px; margin-top: 20px;">❤️❤️💐🌸🌹💓</div>
            `;
            
            document.body.style.backgroundColor = "#ff80ab";
        }
    </script>

</body>
</html>
