<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Sav ❤️</title>
    <style>
        body {
            background-color: #ffdae0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* The Card */
        .card {
            background-color: white;
            width: 90%;
            max-width: 800px; 
            min-height: 500px;
            padding: 40px;
            border-radius: 40px;
            box-shadow: 0 20px 50px rgba(255, 20, 147, 0.2);
            text-align: center;
            border: 5px solid #ff80ab;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            z-index: 10;
        }

        h1 {
            color: #d81b60;
            font-size: 3.5rem;
            margin-bottom: 30px;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 60px; 
            width: 100%;
            position: relative;
            height: 100px;
        }

        button {
            padding: 18px 45px;
            font-size: 24px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            min-width: 140px;
        }

        #yesBtn {
            background-color: #ff4081;
            color: white;
            transition: transform 0.2s;
        }

        #noBtn {
            background-color: #eeeeee;
            color: #777;
            transition: all 0.3s ease-out;
            position: relative; 
            z-index: 20;
        }

        /* Photo Gallery Styling */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .photo-grid img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 15px;
            border: 3px solid #ff80ab;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        /* Falling Hearts Animation */
        .heart-decor {
            position: absolute;
            color: #ff80ab;
            opacity: 0.6;
            user-select: none;
            z-index: 1;
            top: -50px;
            animation: fall linear infinite;
        }

        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="card" id="mainCard">
        <h1 id="mainTitle">Sav, will you be my Valentine? ❤️</h1>
        <div class="btn-container" id="btnHolder">
            <button id="yesBtn" onclick="celebrate()">Yes</button>
            <button id="noBtn" onmouseover="moveNo()">No</button>
        </div>
    </div>

    <script>
        // Create falling hearts
        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart-decor';
            heart.innerText = ['❤️', '💖', '💗', '💓'][Math.floor(Math.random() * 4)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = (Math.random() * 20 + 20) + 'px';
            heart.style.duration = (Math.random() * 3 + 2) + 's';
            heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
            document.body.appendChild(heart);
            
            // Remove heart after it falls to keep page fast
            setTimeout(() => { heart.remove(); }, 6000);
        }
        setInterval(createHeart, 200);

        const noBtn = document.getElementById('noBtn');

        function moveNo() {
            const x = Math.random() * (window.innerWidth - 150);
            const y = Math.random() * (window.innerHeight - 80);
            noBtn.style.position = 'fixed';
            noBtn.style.left = `${x}px`;
            noBtn.style.top = `${y}px`;
        }

        function celebrate() {
            const card = document.getElementById('mainCard');
            
            card.innerHTML = `
                <h1 style="font-size: 4rem; color: #ff4081; margin: 0;">SCORE!!!</h1>
                <p style="font-size: 1.5rem; color: #d81b60; font-weight: bold; margin: 10px 0;">
                    I love you baby, Happy Valentine's Day!
                </p>
                
                <div class="photo-grid">
                    <img src="photo1.jpg" alt="Us 1">
                    <img src="photo2.jpg" alt="Us 2">
                    <img src="photo3.jpg" alt="Us 3">
                </div>
                
                <div style="font-size: 50px; margin-top: 15px;">❤️❤️💐🌸🌹💓</div>
            `;
            
            document.body.style.backgroundColor = "#ff80ab";
        }
    </script>

</body>
</html>
