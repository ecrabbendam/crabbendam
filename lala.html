<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine?</title>
    <style>
        /* General Page Styling */
        body {
            background-color: #ffebee; /* Soft Pink Background */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
            overflow: hidden; /* Prevents scrollbars if the button moves too far */
        }

        /* The Card Container */
        .card {
            background-color: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.3);
            text-align: center;
            border: 2px solid #ff80ab;
            max-width: 400px;
        }

        h1 {
            color: #d81b60;
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 50px;
        }

        /* Button Styling */
        button {
            padding: 12px 25px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        #yesBtn {
            background-color: #ff4081;
            color: white;
        }

        #yesBtn:hover {
            transform: scale(1.1);
        }

        #noBtn {
            background-color: #f48fb1;
            color: white;
            position: absolute; /* Essential for moving it around */
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Will you be my Valentine? ❤️</h1>
        <div class="buttons">
            <button id="yesBtn" onclick="celebrate()">Yes!</button>
            <button id="noBtn">No</button>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');

        // Function to move the "No" button randomly
        noBtn.addEventListener('mouseover', () => {
            // Calculate random positions within the window
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
            
            noBtn.style.left = `${x}px`;
            noBtn.style.top = `${y}px`;
        });

        // Function for when she finally hits "Yes"
        function celebrate() {
            alert("Yay! I knew you'd say yes! ❤️");
            // You can change the window location or trigger animations here
            document.body.style.backgroundColor = "#ffc1e3";
            document.querySelector('.card').innerHTML = "<h1>Can't wait! 🥰</h1><p>See you on the 14th!</p>";
        }
    </script>

</body>
</html>
