<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Trending Now: A YouTube Crossword</title>
<style>
  :root {
    --yt-red: #FF3B3B;
    --yt-red-dark: #E0272E;
    --thumb-pink: #FF5FA2;
    --live-purple: #7B5CFF;
    --gold: #FFC93C;
    --ink: #1A1A2E;
    --paper: #FFF8EC;
    --cell-empty: #16151f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: radial-gradient(circle at 20% 0%, #2b1b4d 0%, #16101f 45%, #0c0a14 100%);
    color: var(--paper);
    min-height: 100vh;
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }

  header {
    text-align: center;
    margin-bottom: 28px;
  }
  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--yt-red);
    color: white;
    font-weight: 800;
    font-size: 13px;
    letter-spacing: 0.08em;
    padding: 6px 14px;
    border-radius: 20px;
    text-transform: uppercase;
  }
  .play-icon {
    width: 0; height: 0;
    border-top: 6px solid transparent;
    border-bottom: 6px solid transparent;
    border-left: 9px solid white;
  }
  h1 {
    font-size: clamp(28px, 5vw, 48px);
    margin: 14px 0 6px;
    background: linear-gradient(100deg, var(--thumb-pink), var(--gold) 55%, var(--live-purple));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-weight: 900;
    letter-spacing: -0.01em;
  }
  .sub { color: #c9c3dd; font-size: 15px; max-width: 560px; margin: 0 auto; }

  .status-row {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin: 18px 0 6px;
    flex-wrap: wrap;
  }
  .pill {
    background: #241b38;
    border: 1px solid #3a2c5c;
    padding: 8px 16px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 600;
    color: #d9d3ef;
  }
  .pill b { color: var(--gold); }

  .main-layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 340px;
    gap: 26px;
    margin-top: 20px;
    align-items: start;
  }
  @media (max-width: 880px) {
    .main-layout { grid-template-columns: 1fr; }
  }

  .board-card {
    background: linear-gradient(155deg, #1f1730, #150f24);
    border: 1px solid #362851;
    border-radius: 20px;
    padding: 18px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.45);
  }

  #grid {
    display: grid;
    gap: 2px;
    background: var(--cell-empty);
    border: 3px solid #3a2c5c;
    border-radius: 10px;
    overflow: hidden;
    width: 100%;
    aspect-ratio: 1 / 1;
    max-width: 640px;
    margin: 0 auto;
  }
  .cell {
    position: relative;
    background: var(--cell-empty);
  }
  .cell.active {
    background: #2a2140;
  }
  .cell.active input {
    background: var(--paper);
    color: var(--ink);
  }
  .cell input {
    width: 100%;
    height: 100%;
    border: none;
    background: transparent;
    text-align: center;
    text-transform: uppercase;
    font-weight: 800;
    font-size: clamp(9px, 2.6vw, 17px);
    color: transparent;
    outline: none;
    caret-color: var(--yt-red-dark);
    border-radius: 2px;
  }
  .cell.highlight input { background: #ffe9b8; }
  .cell.focused input { background: var(--thumb-pink); color: white !important; }
  .cell input.correct { background: #8CE99A !important; color: var(--ink) !important; }
  .cell input.wrong { background: #FF8787 !important; color: white !important; }
  .num {
    position: absolute;
    top: 1px; left: 2px;
    font-size: clamp(6px, 1.4vw, 9px);
    font-weight: 700;
    color: var(--yt-red-dark);
    z-index: 2;
    pointer-events: none;
  }

  .controls {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-top: 16px;
    flex-wrap: wrap;
  }
  button {
    font-family: inherit;
    font-weight: 700;
    font-size: 13px;
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    cursor: pointer;
    transition: transform .12s ease;
  }
  button:hover { transform: translateY(-2px); }
  .btn-check { background: var(--gold); color: var(--ink); }
  .btn-reveal { background: var(--live-purple); color: white; }
  .btn-clear { background: #362851; color: #d9d3ef; }

  .clues-card {
    background: linear-gradient(155deg, #1f1730, #150f24);
    border: 1px solid #362851;
    border-radius: 20px;
    padding: 20px;
    max-height: 720px;
    overflow-y: auto;
  }
  .clues-card h2 {
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--gold);
    margin: 0 0 10px;
    border-bottom: 1px solid #362851;
    padding-bottom: 8px;
  }
  .clues-card h2.second { margin-top: 20px; }
  .clue-item {
    display: flex;
    gap: 10px;
    padding: 8px 8px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13.5px;
    line-height: 1.35;
    color: #d9d3ef;
  }
  .clue-item:hover { background: #2a2140; }
  .clue-item.active { background: var(--thumb-pink); color: white; }
  .clue-item .n { font-weight: 800; color: var(--gold); min-width: 22px; }
  .clue-item.active .n { color: white; }

  footer.done-banner {
    display: none;
    text-align: center;
    margin-top: 20px;
    font-size: 18px;
    font-weight: 800;
    color: var(--gold);
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="eyebrow"><span class="play-icon"></span>Now Trending</span>
    <h1>Trending Now: A YouTube Crossword</h1>
    <p class="sub">18 answers pulled straight from what's actually shaping YouTube in 2026 &mdash; creators, formats, and the algorithm that runs it all.</p>
  </header>

  <div class="status-row">
    <div class="pill">Progress: <b id="progressText">0 / 18</b></div>
    <div class="pill" id="feedback">Tap a cell to start</div>
  </div>

  <div class="main-layout">
    <div class="board-card">
      <div id="grid"></div>
      <div class="controls">
        <button class="btn-check" onclick="checkPuzzle()">Check</button>
        <button class="btn-reveal" onclick="revealPuzzle()">Reveal</button>
        <button class="btn-clear" onclick="clearPuzzle()">Clear</button>
      </div>
    </div>

    <div class="clues-card">
      <h2>Across</h2>
      <div id="acrossClues"></div>
      <h2 class="second">Down</h2>
      <div id="downClues"></div>
    </div>
  </div>

  <footer class="done-banner" id="doneBanner">🎉 Solved it! You're basically the algorithm now.</footer>
</div>

<script>
const SIZE = 15;
const PLACEMENTS = [
    {"word":"NICHE","clue":"A specific topic focus that helps a channel stand out","row":7,"col":5,"dir":"H"},
    {"word":"TUTORIAL","clue":"Step-by-step how-to video format","row":2,"col":6,"dir":"V"},
    {"word":"PODCAST","clue":"Long-form talk show format now often watched, not just heard","row":2,"col":0,"dir":"H"},
    {"word":"BRAINROT","clue":"Slang for absurd, hyper-viral meme content like Skibidi Toilet","row":5,"col":0,"dir":"H"},
    {"word":"ALGORITHM","clue":"The recommendation system that decides what you watch next","row":5,"col":2,"dir":"V"},
    {"word":"LABUBU","clue":"Viral collectible toy that trended across YouTube in 2025","row":9,"col":6,"dir":"H"},
    {"word":"VIRAL","clue":"Word for content that spreads rapidly across the internet","row":9,"col":0,"dir":"H"},
    {"word":"RETENTION","clue":"Metric tracking how long viewers keep watching a video","row":11,"col":0,"dir":"H"},
    {"word":"GAMING","clue":"One of YouTube's largest content categories","row":1,"col":4,"dir":"V"},
    {"word":"MRBEAST","clue":"Top-subscribed creator known for giant stunts and Feastables","row":13,"col":2,"dir":"H"},
    {"word":"VLOG","clue":"Casual video diary format documenting daily life","row":0,"col":1,"dir":"V"},
    {"word":"MEME","clue":"A shared joke or image format that spreads online","row":4,"col":9,"dir":"V"},
    {"word":"UPLOAD","clue":"The act of publishing a new video to a channel","row":9,"col":11,"dir":"V"},
    {"word":"MERCH","clue":"Branded products creators sell tied to their channel","row":4,"col":9,"dir":"H"},
    {"word":"PRIME","clue":"Logan Paul's popular sports drink brand","row":0,"col":10,"dir":"V"},
    {"word":"HASHTAG","clue":"Tagged keyword used to group related videos","row":1,"col":13,"dir":"V"},
    {"word":"SHORTS","clue":"Vertical, under-60-second videos that drive new-viewer discovery","row":12,"col":9,"dir":"H"},
    {"word":"SPONSOR","clue":"Brand that pays a creator to feature its product","row":8,"col":14,"dir":"V"}
];

// Build solution grid + active cell map
let solution = Array.from({length:SIZE}, () => Array(SIZE).fill(null));
PLACEMENTS.forEach(p => {
  for (let i=0;i<p.word.length;i++){
    const r = p.dir==='H'?p.row:p.row+i;
    const c = p.dir==='H'?p.col+i:p.col;
    solution[r][c] = p.word[i];
  }
});

// Numbering: a cell gets a number if it's the start of an across or down word
let numberGrid = Array.from({length:SIZE}, () => Array(SIZE).fill(null));
let counter = 1;
let cellNumber = {}; // "r-c" -> number
PLACEMENTS.slice().sort((a,b)=> a.row-b.row || a.col-b.col).forEach(()=>{});

// determine start cells in reading order
let startCells = [];
PLACEMENTS.forEach(p => startCells.push([p.row,p.col]));
let uniqueStarts = Array.from(new Set(startCells.map(x=>x.join(',')))).map(s=>s.split(',').map(Number));
uniqueStarts.sort((a,b)=> a[0]-b[0] || a[1]-b[1]);
uniqueStarts.forEach(([r,c]) => {
  cellNumber[`${r}-${c}`] = counter++;
});

PLACEMENTS.forEach(p => { p.number = cellNumber[`${p.row}-${p.col}`]; });

// Build grid DOM
const gridEl = document.getElementById('grid');
gridEl.style.gridTemplateColumns = `repeat(${SIZE}, 1fr)`;
gridEl.style.gridTemplateRows = `repeat(${SIZE}, 1fr)`;

let inputs = Array.from({length:SIZE}, () => Array(SIZE).fill(null));

for (let r=0;r<SIZE;r++){
  for (let c=0;c<SIZE;c++){
    const cellDiv = document.createElement('div');
    if (solution[r][c]) {
      cellDiv.className = 'cell active';
      cellDiv.dataset.r = r;
      cellDiv.dataset.c = c;
      const num = cellNumber[`${r}-${c}`];
      if (num) {
        const numSpan = document.createElement('div');
        numSpan.className = 'num';
        numSpan.textContent = num;
        cellDiv.appendChild(numSpan);
      }
      const input = document.createElement('input');
      input.maxLength = 1;
      input.dataset.r = r;
      input.dataset.c = c;
      cellDiv.appendChild(input);
      inputs[r][c] = input;
    } else {
      cellDiv.className = 'cell';
    }
    gridEl.appendChild(cellDiv);
  }
}

// current direction/word tracking
let currentDir = 'H';
let activeWordCells = [];

function wordsAt(r,c){
  return PLACEMENTS.filter(p => {
    for (let i=0;i<p.word.length;i++){
      const rr = p.dir==='H'?p.row:p.row+i;
      const cc = p.dir==='H'?p.col+i:p.col;
      if (rr===r && cc===c) return true;
    }
    return false;
  });
}

function clearHighlights(){
  document.querySelectorAll('.cell.highlight').forEach(el=>el.classList.remove('highlight'));
  document.querySelectorAll('.cell.focused').forEach(el=>el.classList.remove('focused'));
  document.querySelectorAll('.clue-item.active').forEach(el=>el.classList.remove('active'));
}

function highlightWord(p){
  clearHighlights();
  for (let i=0;i<p.word.length;i++){
    const rr = p.dir==='H'?p.row:p.row+i;
    const cc = p.dir==='H'?p.col+i:p.col;
    const cellDiv = inputs[rr][cc].parentElement;
    cellDiv.classList.add('highlight');
  }
  const clueEl = document.getElementById(`clue-${p.dir}-${p.number}`);
  if (clueEl) { clueEl.classList.add('active'); clueEl.scrollIntoView({block:'nearest'}); }
}

function focusCell(r,c, preferDir){
  const options = wordsAt(r,c);
  if (options.length === 0) return;
  let chosen = options.find(p => p.dir === preferDir) || options[0];
  currentDir = chosen.dir;
  highlightWord(chosen);
  document.querySelectorAll('.cell.focused').forEach(el=>el.classList.remove('focused'));
  inputs[r][c].parentElement.classList.add('focused');
  inputs[r][c].focus();
}

for (let r=0;r<SIZE;r++){
  for (let c=0;c<SIZE;c++){
    if (!inputs[r][c]) continue;
    const input = inputs[r][c];
    input.addEventListener('focus', () => focusCell(r,c,currentDir));
    input.addEventListener('click', () => {
      const options = wordsAt(r,c);
      if (options.length > 1 && inputs[r][c].parentElement.classList.contains('focused')) {
        currentDir = currentDir === 'H' ? 'V' : 'H';
      }
      focusCell(r,c,currentDir);
    });
    input.addEventListener('input', (e) => {
      let val = e.target.value.toUpperCase().replace(/[^A-Z]/g,'');
      e.target.value = val.slice(-1);
      e.target.classList.remove('correct','wrong');
      updateProgress();
      if (val) moveNext(r,c);
    });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' && !input.value) {
        movePrev(r,c);
      } else if (e.key === 'ArrowRight') moveDir(r,c,0,1);
      else if (e.key === 'ArrowLeft') moveDir(r,c,0,-1);
      else if (e.key === 'ArrowDown') moveDir(r,c,1,0);
      else if (e.key === 'ArrowUp') moveDir(r,c,-1,0);
    });
  }
}

function moveNext(r,c){
  if (currentDir === 'H') {
    let nc = c+1;
    while(nc < SIZE && !inputs[r][nc]) nc++;
    if (nc < SIZE && inputs[r][nc]) inputs[r][nc].focus();
  } else {
    let nr = r+1;
    while(nr < SIZE && !inputs[nr][c]) nr++;
    if (nr < SIZE && inputs[nr][c]) inputs[nr][c].focus();
  }
}
function movePrev(r,c){
  if (currentDir === 'H') {
    let nc = c-1;
    while(nc >= 0 && !inputs[r][nc]) nc--;
    if (nc >= 0 && inputs[r][nc]) inputs[r][nc].focus();
  } else {
    let nr = r-1;
    while(nr >= 0 && !inputs[nr][c]) nr--;
    if (nr >= 0 && inputs[nr][c]) inputs[nr][c].focus();
  }
}
function moveDir(r,c,dr,dc){
  let nr=r+dr, nc=c+dc;
  if (nr>=0 && nr<SIZE && nc>=0 && nc<SIZE && inputs[nr][nc]) {
    if (dr!==0) currentDir='V'; else currentDir='H';
    inputs[nr][nc].focus();
  }
}

// Build clue lists
const acrossList = PLACEMENTS.filter(p=>p.dir==='H').sort((a,b)=>a.number-b.number);
const downList = PLACEMENTS.filter(p=>p.dir==='V').sort((a,b)=>a.number-b.number);

const acrossDiv = document.getElementById('acrossClues');
acrossList.forEach(p => {
  const item = document.createElement('div');
  item.className = 'clue-item';
  item.id = `clue-H-${p.number}`;
  item.innerHTML = `<span class="n">${p.number}.</span><span>${p.clue}</span>`;
  item.addEventListener('click', () => { currentDir='H'; focusCell(p.row,p.col,'H'); });
  acrossDiv.appendChild(item);
});
const downDiv = document.getElementById('downClues');
downList.forEach(p => {
  const item = document.createElement('div');
  item.className = 'clue-item';
  item.id = `clue-V-${p.number}`;
  item.innerHTML = `<span class="n">${p.number}.</span><span>${p.clue}</span>`;
  item.addEventListener('click', () => { currentDir='V'; focusCell(p.row,p.col,'V'); });
  downDiv.appendChild(item);
});

function updateProgress(){
  let solvedWords = 0;
  PLACEMENTS.forEach(p => {
    let complete = true;
    for (let i=0;i<p.word.length;i++){
      const rr = p.dir==='H'?p.row:p.row+i;
      const cc = p.dir==='H'?p.col+i:p.col;
      if (inputs[rr][cc].value.toUpperCase() !== p.word[i]) { complete = false; break; }
    }
    if (complete) solvedWords++;
  });
  document.getElementById('progressText').textContent = `${solvedWords} / ${PLACEMENTS.length}`;
  if (solvedWords === PLACEMENTS.length) {
    document.getElementById('doneBanner').style.display = 'block';
    document.getElementById('feedback').textContent = "All 18 solved! 🎉";
  }
}

function checkPuzzle(){
  let anyFilled = false;
  let allCorrectSoFar = true;
  for (let r=0;r<SIZE;r++){
    for (let c=0;c<SIZE;c++){
      if (!inputs[r][c]) continue;
      const val = inputs[r][c].value.toUpperCase();
      inputs[r][c].classList.remove('correct','wrong');
      if (val) {
        anyFilled = true;
        if (val === solution[r][c]) {
          inputs[r][c].classList.add('correct');
        } else {
          inputs[r][c].classList.add('wrong');
          allCorrectSoFar = false;
        }
      }
    }
  }
  const fb = document.getElementById('feedback');
  if (!anyFilled) fb.textContent = 'Fill in some letters first!';
  else if (allCorrectSoFar) fb.textContent = 'Looking good so far ✅';
  else fb.textContent = 'Some letters need another look ❌';
}

function revealPuzzle(){
  for (let r=0;r<SIZE;r++){
    for (let c=0;c<SIZE;c++){
      if (!inputs[r][c]) continue;
      inputs[r][c].value = solution[r][c];
      inputs[r][c].classList.remove('wrong');
      inputs[r][c].classList.add('correct');
    }
  }
  updateProgress();
  document.getElementById('feedback').textContent = 'Revealed the full answer key.';
}

function clearPuzzle(){
  for (let r=0;r<SIZE;r++){
    for (let c=0;c<SIZE;c++){
      if (!inputs[r][c]) continue;
      inputs[r][c].value = '';
      inputs[r][c].classList.remove('correct','wrong');
    }
  }
  document.getElementById('doneBanner').style.display = 'none';
  document.getElementById('feedback').textContent = 'Cleared. Fresh start!';
  updateProgress();
}
</script>
</body>
</html>
