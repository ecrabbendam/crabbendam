<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Once Upon a Crossword: Disney Animated Movies</title>
<style>
  :root {
    --violet: #6A3FE0;
    --violet-deep: #3A1F80;
    --gold: #FFC93C;
    --rose: #FF6FA5;
    --sky: #4FC3F7;
    --paper: #FFFBF0;
    --cell-empty: #1a1233;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: radial-gradient(circle at 25% 0%, #3a2170 0%, #1c1140 45%, #0e0a24 100%);
    color: var(--paper);
    min-height: 100vh;
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 28px; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--rose); color: white; font-weight: 800;
    font-size: 13px; letter-spacing: 0.08em; padding: 6px 14px;
    border-radius: 20px; text-transform: uppercase;
  }
  .star { font-size: 12px; }
  h1 {
    font-size: clamp(26px, 4.6vw, 44px);
    margin: 14px 0 6px;
    background: linear-gradient(100deg, var(--gold), var(--rose) 45%, var(--sky));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    font-weight: 900; letter-spacing: -0.01em;
  }
  .sub { color: #cfc3ef; font-size: 15px; max-width: 580px; margin: 0 auto; }

  .status-row {
    display: flex; justify-content: center; gap: 14px;
    margin: 18px 0 6px; flex-wrap: wrap;
  }
  .pill {
    background: #241a4a; border: 1px solid #4a3690;
    padding: 8px 16px; border-radius: 12px;
    font-size: 13px; font-weight: 600; color: #e3daff;
  }
  .pill b { color: var(--gold); }

  .main-layout {
    display: grid; grid-template-columns: minmax(0, 1fr) 340px;
    gap: 26px; margin-top: 20px; align-items: start;
  }
  @media (max-width: 880px) { .main-layout { grid-template-columns: 1fr; } }

  .board-card {
    background: linear-gradient(155deg, #2a1c58, #180f38);
    border: 1px solid #4a3690; border-radius: 20px; padding: 18px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  }

  #grid {
    display: grid; gap: 2px; background: var(--cell-empty);
    border: 3px solid #4a3690; border-radius: 10px; overflow: hidden;
    width: 100%; aspect-ratio: 1 / 1; max-width: 640px; margin: 0 auto;
  }
  .cell { position: relative; background: var(--cell-empty); }
  .cell.active { background: #33245e; }
  .cell.active input { background: var(--paper); color: var(--violet-deep); }
  .cell input {
    width: 100%; height: 100%; border: none; background: transparent;
    text-align: center; text-transform: uppercase; font-weight: 800;
    font-size: clamp(9px, 2.6vw, 17px); color: transparent; outline: none;
    caret-color: var(--rose); border-radius: 2px;
  }
  .cell.highlight input { background: #FFE9B8; }
  .cell.focused input { background: var(--gold); color: var(--violet-deep) !important; }
  .cell input.correct { background: #8CE99A !important; color: var(--violet-deep) !important; }
  .cell input.wrong { background: #FF8787 !important; color: white !important; }
  .num {
    position: absolute; top: 1px; left: 2px;
    font-size: clamp(6px, 1.4vw, 9px); font-weight: 700;
    color: var(--rose); z-index: 2; pointer-events: none;
  }

  .controls { display: flex; gap: 10px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }
  button {
    font-family: inherit; font-weight: 700; font-size: 13px;
    border: none; border-radius: 10px; padding: 10px 16px;
    cursor: pointer; transition: transform .12s ease;
  }
  button:hover { transform: translateY(-2px); }
  .btn-check { background: var(--gold); color: var(--violet-deep); }
  .btn-reveal { background: var(--rose); color: white; }
  .btn-clear { background: #4a3690; color: #e3daff; }

  .clues-card {
    background: linear-gradient(155deg, #2a1c58, #180f38);
    border: 1px solid #4a3690; border-radius: 20px; padding: 20px;
    max-height: 720px; overflow-y: auto;
  }
  .clues-card h2 {
    font-size: 14px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--gold); margin: 0 0 10px;
    border-bottom: 1px solid #4a3690; padding-bottom: 8px;
  }
  .clues-card h2.second { margin-top: 20px; }
  .clue-item {
    display: flex; gap: 10px; padding: 8px 8px; border-radius: 8px;
    cursor: pointer; font-size: 13.5px; line-height: 1.35; color: #e3daff;
  }
  .clue-item:hover { background: #33245e; }
  .clue-item.active { background: var(--rose); color: white; }
  .clue-item .n { font-weight: 800; color: var(--gold); min-width: 22px; }
  .clue-item.active .n { color: white; }

  footer.done-banner {
    display: none; text-align: center; margin-top: 20px;
    font-size: 18px; font-weight: 800; color: var(--gold);
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="eyebrow"><span class="star">✨</span>Movie Magic</span>
    <h1>Once Upon a Crossword: Disney Animated Movies</h1>
    <p class="sub">22 answers pulled from Disney's animated universe &mdash; from classic fairy tales to Pixar favorites.</p>
  </header>

  <div class="status-row">
    <div class="pill">Progress: <b id="progressText">0 / 22</b></div>
    <div class="pill" id="feedback">Tap a cell to start</div>
  </div>

  <div class="main-layout">
    <div class="board-card">
      <div id="grid"></div>
      <div class="controls">
        <button class="btn-check" onclick="checkPuzzle()">Check</button>
        <button class="btn-reveal" onclick="revealPuzzle()">Reveal</button>
        <button class="btn-clear" onclick="clearPuzzle()">Clear</button>
      </div>
    </div>

    <div class="clues-card">
      <h2>Across</h2>
      <div id="acrossClues"></div>
      <h2 class="second">Down</h2>
      <div id="downClues"></div>
    </div>
  </div>

  <footer class="done-banner" id="doneBanner">🎉 Happily ever solved!</footer>
</div>

<script>
const SIZE = 15;
const PLACEMENTS = [
    {"word":"TARZAN","clue":"Man raised by gorillas in the jungle","row":7,"col":4,"dir":"H"},
    {"word":"LUCA","clue":"Sea monster who spends a summer as a human boy in Italy","row":4,"col":5,"dir":"V"},
    {"word":"CINDERELLA","clue":"Classic tale of a girl, a pumpkin carriage, and a glass slipper","row":5,"col":9,"dir":"V"},
    {"word":"JUNGLEBOOK","clue":"Boy named Mowgli raised by wolves, with friends Baloo and Bagheera","row":9,"col":4,"dir":"H"},
    {"word":"FROZEN","clue":"Animated hit featuring sisters Elsa and Anna and the song 'Let It Go'","row":7,"col":11,"dir":"V"},
    {"word":"RAPUNZEL","clue":"Princess with magical, ever-growing hair locked in a tower","row":12,"col":2,"dir":"H"},
    {"word":"COCO","clue":"Boy named Miguel travels to the Land of the Dead on Dia de los Muertos","row":5,"col":7,"dir":"H"},
    {"word":"ELSA","clue":"Queen with ice powers who accidentally freezes her kingdom","row":11,"col":11,"dir":"H"},
    {"word":"ATLANTIS","clue":"Lost underwater city sought by an explorer named Milo","row":14,"col":6,"dir":"H"},
    {"word":"ARIEL","clue":"Mermaid who trades her voice for legs to be with a human prince","row":4,"col":1,"dir":"H"},
    {"word":"DUMBO","clue":"Baby elephant with oversized ears who learns to fly","row":1,"col":8,"dir":"V"},
    {"word":"WALLE","clue":"Lonely trash-compacting robot left behind on Earth","row":0,"col":4,"dir":"V"},
    {"word":"TANGLED","clue":"Retelling of Rapunzel, with a thief named Flynn Rider","row":2,"col":0,"dir":"H"},
    {"word":"RATATOUILLE","clue":"Rat who dreams of becoming a chef in Paris","row":1,"col":1,"dir":"V"},
    {"word":"BRAVE","clue":"Scottish princess Merida defies tradition and battles a curse","row":10,"col":3,"dir":"V"},
    {"word":"RAYA","clue":"Warrior who searches for the last dragon to save her fractured land","row":10,"col":14,"dir":"V"},
    {"word":"MULAN","clue":"Warrior who disguises herself as a man to take her father's place in the army","row":3,"col":8,"dir":"H"},
    {"word":"MOANA","clue":"Wayfinder who sails the ocean with a demigod to save her island","row":0,"col":12,"dir":"V"},
    {"word":"ONWARD","clue":"Two elf brothers use magic to spend one more day with their late father","row":0,"col":2,"dir":"H"},
    {"word":"SOUL","clue":"Jazz musician's soul ends up in the Great Before before his big break","row":0,"col":10,"dir":"V"},
    {"word":"SIMBA","clue":"Lion cub who becomes king after his father Mufasa's death","row":0,"col":10,"dir":"H"},
    {"word":"ALADDIN","clue":"Street urchin who finds a genie in a magic lamp","row":0,"col":14,"dir":"V"}
];

let solution = Array.from({length:SIZE}, () => Array(SIZE).fill(null));
PLACEMENTS.forEach(p => {
  for (let i=0;i<p.word.length;i++){
    const r = p.dir==='H'?p.row:p.row+i;
    const c = p.dir==='H'?p.col+i:p.col;
    solution[r][c] = p.word[i];
  }
});

let counter = 1;
let cellNumber = {};
let startCells = [];
PLACEMENTS.forEach(p => startCells.push([p.row,p.col]));
let uniqueStarts = Array.from(new Set(startCells.map(x=>x.join(',')))).map(s=>s.split(',').map(Number));
uniqueStarts.sort((a,b)=> a[0]-b[0] || a[1]-b[1]);
uniqueStarts.forEach(([r,c]) => { cellNumber[`${r}-${c}`] = counter++; });
PLACEMENTS.forEach(p => { p.number = cellNumber[`${p.row}-${p.col}`]; });

const gridEl = document.getElementById('grid');
gridEl.style.gridTemplateColumns = `repeat(${SIZE}, 1fr)`;
gridEl.style.gridTemplateRows = `repeat(${SIZE}, 1fr)`;

let inputs = Array.from({length:SIZE}, () => Array(SIZE).fill(null));

for (let r=0;r<SIZE;r++){
  for (let c=0;c<SIZE;c++){
    const cellDiv = document.createElement('div');
    if (solution[r][c]) {
      cellDiv.className = 'cell active';
      cellDiv.dataset.r = r;
      cellDiv.dataset.c = c;
      const num = cellNumber[`${r}-${c}`];
      if (num) {
        const numSpan = document.createElement('div');
        numSpan.className = 'num';
        numSpan.textContent = num;
        cellDiv.appendChild(numSpan);
      }
      const input = document.createElement('input');
      input.maxLength = 1;
      input.dataset.r = r;
      input.dataset.c = c;
      cellDiv.appendChild(input);
      inputs[r][c] = input;
    } else {
      cellDiv.className = 'cell';
    }
    gridEl.appendChild(cellDiv);
  }
}

let currentDir = 'H';

function wordsAt(r,c){
  return PLACEMENTS.filter(p => {
    for (let i=0;i<p.word.length;i++){
      const rr = p.dir==='H'?p.row:p.row+i;
      const cc = p.dir==='H'?p.col+i:p.col;
      if (rr===r && cc===c) return true;
    }
    return false;
  });
}

function clearHighlights(){
  document.querySelectorAll('.cell.highlight').forEach(el=>el.classList.remove('highlight'));
  document.querySelectorAll('.cell.focused').forEach(el=>el.classList.remove('focused'));
  document.querySelectorAll('.clue-item.active').forEach(el=>el.classList.remove('active'));
}

function highlightWord(p){
  clearHighlights();
  for (let i=0;i<p.word.length;i++){
    const rr = p.dir==='H'?p.row:p.row+i;
    const cc = p.dir==='H'?p.col+i:p.col;
    const cellDiv = inputs[rr][cc].parentElement;
    cellDiv.classList.add('highlight');
  }
  const clueEl = document.getElementById(`clue-${p.dir}-${p.number}`);
  if (clueEl) { clueEl.classList.add('active'); clueEl.scrollIntoView({block:'nearest'}); }
}

function focusCell(r,c, preferDir){
  const options = wordsAt(r,c);
  if (options.length === 0) return;
  let chosen = options.find(p => p.dir === preferDir) || options[0];
  currentDir = chosen.dir;
  highlightWord(chosen);
  document.querySelectorAll('.cell.focused').forEach(el=>el.classList.remove('focused'));
  inputs[r][c].parentElement.classList.add('focused');
  inputs[r][c].focus();
}

for (let r=0;r<SIZE;r++){
  for (let c=0;c<SIZE;c++){
    if (!inputs[r][c]) continue;
    const input = inputs[r][c];
    input.addEventListener('focus', () => focusCell(r,c,currentDir));
    input.addEventListener('click', () => {
      const options = wordsAt(r,c);
      if (options.length > 1 && inputs[r][c].parentElement.classList.contains('focused')) {
        currentDir = currentDir === 'H' ? 'V' : 'H';
      }
      focusCell(r,c,currentDir);
    });
    input.addEventListener('input', (e) => {
      let val = e.target.value.toUpperCase().replace(/[^A-Z]/g,'');
      e.target.value = val.slice(-1);
      e.target.classList.remove('correct','wrong');
      updateProgress();
      if (val) moveNext(r,c);
    });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' && !input.value) {
        movePrev(r,c);
      } else if (e.key === 'ArrowRight') moveDir(r,c,0,1);
      else if (e.key === 'ArrowLeft') moveDir(r,c,0,-1);
      else if (e.key === 'ArrowDown') moveDir(r,c,1,0);
      else if (e.key === 'ArrowUp') moveDir(r,c,-1,0);
    });
  }
}

function moveNext(r,c){
  if (currentDir === 'H') {
    let nc = c+1;
    while(nc < SIZE && !inputs[r][nc]) nc++;
    if (nc < SIZE && inputs[r][nc]) inputs[r][nc].focus();
  } else {
    let nr = r+1;
    while(nr < SIZE && !inputs[nr][c]) nr++;
    if (nr < SIZE && inputs[nr][c]) inputs[nr][c].focus();
  }
}
function movePrev(r,c){
  if (currentDir === 'H') {
    let nc = c-1;
    while(nc >= 0 && !inputs[r][nc]) nc--;
    if (nc >= 0 && inputs[r][nc]) inputs[r][nc].focus();
  } else {
    let nr = r-1;
    while(nr >= 0 && !inputs[nr][c]) nr--;
    if (nr >= 0 && inputs[nr][c]) inputs[nr][c].focus();
  }
}
function moveDir(r,c,dr,dc){
  let nr=r+dr, nc=c+dc;
  if (nr>=0 && nr<SIZE && nc>=0 && nc<SIZE && inputs[nr][nc]) {
    if (dr!==0) currentDir='V'; else currentDir='H';
    inputs[nr][nc].focus();
  }
}

const acrossList = PLACEMENTS.filter(p=>p.dir==='H').sort((a,b)=>a.number-b.number);
const downList = PLACEMENTS.filter(p=>p.dir==='V').sort((a,b)=>a.number-b.number);

const acrossDiv = document.getElementById('acrossClues');
acrossList.forEach(p => {
  const item = document.createElement('div');
  item.className = 'clue-item';
  item.id = `clue-H-${p.number}`;
  item.innerHTML = `<span class="n">${p.number}.</span><span>${p.clue}</span>`;
  item.addEventListener('click', () => { currentDir='H'; focusCell(p.row,p.col,'H'); });
  acrossDiv.appendChild(item);
});
const downDiv = document.getElementById('downClues');
downList.forEach(p => {
  const item = document.createElement('div');
  item.className = 'clue-item';
  item.id = `clue-V-${p.number}`;
  item.innerHTML = `<span class="n">${p.number}.</span><span>${p.clue}</span>`;
  item.addEventListener('click', () => { currentDir='V'; focusCell(p.row,p.col,'V'); });
  downDiv.appendChild(item);
});

function updateProgress(){
  let solvedWords = 0;
  PLACEMENTS.forEach(p => {
    let complete = true;
    for (let i=0;i<p.word.length;i++){
      const rr = p.dir==='H'?p.row:p.row+i;
      const cc = p.dir==='H'?p.col+i:p.col;
      if (inputs[rr][cc].value.toUpperCase() !== p.word[i]) { complete = false; break; }
    }
    if (complete) solvedWords++;
  });
  document.getElementById('progressText').textContent = `${solvedWords} / ${PLACEMENTS.length}`;
  if (solvedWords === PLACEMENTS.length) {
    document.getElementById('doneBanner').style.display = 'block';
    document.getElementById('feedback').textContent = "All 22 solved! 🎉";
  }
}

function checkPuzzle(){
  let anyFilled = false;
  let allCorrectSoFar = true;
  for (let r=0;r<SIZE;r++){
    for (let c=0;c<SIZE;c++){
      if (!inputs[r][c]) continue;
      const val = inputs[r][c].value.toUpperCase();
      inputs[r][c].classList.remove('correct','wrong');
      if (val) {
        anyFilled = true;
        if (val === solution[r][c]) {
          inputs[r][c].classList.add('correct');
        } else {
          inputs[r][c].classList.add('wrong');
          allCorrectSoFar = false;
        }
      }
    }
  }
  const fb = document.getElementById('feedback');
  if (!anyFilled) fb.textContent = 'Fill in some letters first!';
  else if (allCorrectSoFar) fb.textContent = 'Looking good so far ✅';
  else fb.textContent = 'Some letters need another look ❌';
}

function revealPuzzle(){
  for (let r=0;r<SIZE;r++){
    for (let c=0;c<SIZE;c++){
      if (!inputs[r][c]) continue;
      inputs[r][c].value = solution[r][c];
      inputs[r][c].classList.remove('wrong');
      inputs[r][c].classList.add('correct');
    }
  }
  updateProgress();
  document.getElementById('feedback').textContent = 'Revealed the full answer key.';
}

function clearPuzzle(){
  for (let r=0;r<SIZE;r++){
    for (let c=0;c<SIZE;c++){
      if (!inputs[r][c]) continue;
      inputs[r][c].value = '';
      inputs[r][c].classList.remove('correct','wrong');
    }
  }
  document.getElementById('doneBanner').style.display = 'none';
  document.getElementById('feedback').textContent = 'Cleared. Fresh start!';
  updateProgress();
}
</script>
</body>
</html>
