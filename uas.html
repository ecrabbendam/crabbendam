<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UAS Flight Simulator</title>
<!-- Standalone-page reset only. If you embed #acsim in an existing page, drop this block. -->
<style>html,body{margin:0;background:#0a0e14}</style>
<style>
#acsim{--bg:#0a0e14;--panel:#101722;--panel2:#0c121b;--line:#1f2b3b;--tx:#d9e2ec;--mut:#8493a8;--acc:#f5a524;--cy:#56c7f2;--ok:#3ddc97;--warn:#f5a524;--bad:#ff6b6b;--info:#7aa2f7;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;position:relative}
#acsim *{box-sizing:border-box}
#acsim .wrap{max-width:1280px;margin:0 auto;padding:0 16px 60px}
#acsim header.top{padding:22px 0 10px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
#acsim h1{font:650 22px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;margin:0;letter-spacing:.02em;color:var(--tx)}
#acsim h1 span{color:var(--acc)}
#acsim .tag{font:11px var(--mono);color:var(--mut);letter-spacing:.14em;text-transform:uppercase}
#acsim h2{font:600 12px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--cy);margin:0 0 12px;display:flex;align-items:center;gap:10px}
#acsim h2:after{content:"";flex:1;height:1px;background:var(--line)}
#acsim h3{margin:0 0 8px;font:600 15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--tx)}
#acsim p{color:inherit;font:inherit}
#acsim label{color:inherit;font-weight:400}
#acsim section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:16px}
#acsim nav.bar{position:sticky;top:0;z-index:20;background:rgba(10,14,20,.94);border-bottom:1px solid var(--line);padding:8px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#acsim nav.bar .sp{flex:1}
#acsim .btn,#acsim select,#acsim input{font:inherit;color:var(--tx);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 9px}
#acsim .btn{cursor:pointer;white-space:nowrap}
#acsim .btn:hover{border-color:var(--cy)}
#acsim .btn:disabled{opacity:.4;cursor:default;border-color:var(--line)}
#acsim .btn.pri{background:var(--acc);color:#151004;border-color:var(--acc);font-weight:600}
#acsim .btn.on{border-color:var(--acc);color:var(--acc)}
#acsim .btn.sm{padding:2px 7px;font-size:12px}
#acsim input:focus,#acsim select:focus,#acsim .btn:focus-visible{outline:2px solid var(--cy);outline-offset:1px}
#acsim input.badv{border-color:var(--bad);background:#2a1418}
#acsim .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
#acsim .card{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;border-left:3px solid var(--line)}
#acsim .card.ok{border-left-color:var(--ok)}#acsim .card.warn{border-left-color:var(--warn)}#acsim .card.bad{border-left-color:var(--bad)}
#acsim .card .l{font:11px var(--mono);color:var(--mut);letter-spacing:.1em;text-transform:uppercase}
#acsim .card .v{font:600 22px var(--mono);margin-top:2px}
#acsim .card .v small{font-size:12px;color:var(--mut);font-weight:400;margin-left:4px}
#acsim .card .s{font-size:12px;color:var(--mut)}
#acsim .gauge{margin-top:14px}
#acsim .gauge .track{position:relative;height:14px;border-radius:7px;background:linear-gradient(90deg,var(--bad) 0 25%,var(--warn) 25% 37.5%,var(--ok) 37.5% 75%,var(--info) 75% 100%);opacity:.85}
#acsim .gauge .pin{position:absolute;top:-5px;width:3px;height:24px;background:#fff;border-radius:2px;transform:translateX(-1px);box-shadow:0 0 0 2px var(--bg)}
#acsim .gauge .scale{display:flex;justify-content:space-between;font:11px var(--mono);color:var(--mut);margin-top:4px}
#acsim .grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:16px}
#acsim .svgbox{background:var(--panel2);border:1px solid var(--line);border-radius:8px;overflow-x:auto}
#acsim svg{display:block;width:100%;min-width:680px;height:auto;touch-action:none}
#acsim svg.topv{min-width:0;max-height:560px}
#acsim svg text{font:13px var(--mono);fill:var(--mut)}
#acsim svg .fus{fill:#18222f;stroke:#4a5b70;stroke-width:1.5}
#acsim svg .wing{fill:#223247;stroke:var(--cy);stroke-width:1.5}
#acsim svg .tailp{fill:#223247;stroke:var(--cy);stroke-width:1.5;fill-opacity:.85}
#acsim svg .surf{fill:var(--cy);fill-opacity:.28;stroke:none}
#acsim svg .prop{stroke:#c9d4e0;stroke-width:3;stroke-linecap:round}
#acsim svg .gnd{stroke:#6b5a3a;stroke-width:2;stroke-dasharray:10 6}
#acsim svg .comp{fill:#f5a524;fill-opacity:.16;stroke:#f5a524;stroke-width:1;cursor:ew-resize}
#acsim svg .comp.meas{fill:#3ddc97;fill-opacity:.16;stroke:#3ddc97}
#acsim svg .comp.mov{stroke-width:2.2}
#acsim svg .cg{cursor:ew-resize}
#acsim .hint{font-size:12px;color:var(--mut);margin-top:8px}
#acsim .chk{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
#acsim .chk:last-child{border-bottom:0}
#acsim .dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:5px;background:var(--mut)}
#acsim .dot.ok{background:var(--ok)}#acsim .dot.warn{background:var(--warn)}#acsim .dot.bad{background:var(--bad)}#acsim .dot.info{background:var(--info)}
#acsim .chk b{display:block}
#acsim .chk .d{color:var(--mut);font-size:13px}
#acsim .chk .f{font-size:13px;margin-top:2px}
#acsim .tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
#acsim .fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:6px 22px}
#acsim .fld{display:grid;grid-template-columns:1fr 104px 44px 88px;gap:6px;align-items:center;padding:3px 0}
#acsim .fld label{font-size:13px}
#acsim .fld input.num,#acsim .fld select.val,#acsim .fld input.txt{width:100%;font-family:var(--mono);text-align:right}
#acsim .fld select.val{text-align:left;grid-column:2 / span 2}
#acsim .fld .u{font:12px var(--mono);color:var(--mut)}
#acsim .src{font:11px var(--mono);padding:3px 4px;width:100%;border-radius:10px}
#acsim .src.measured{color:var(--ok);border-color:var(--ok)}#acsim .src.cad{color:var(--cy);border-color:var(--cy)}#acsim .src.spec{color:var(--info);border-color:var(--info)}#acsim .src.estimate{color:var(--warn);border-color:var(--warn)}#acsim .src.guess{color:var(--bad);border-color:var(--bad)}
#acsim .tol{display:none}
#acsim.showtol .tol{display:flex}
#acsim.showtol .fld{grid-template-columns:1fr 104px 44px 88px 84px}
#acsim .tol{align-items:center;gap:3px;font:12px var(--mono);color:var(--mut)}
#acsim .tol input{width:52px;padding:3px 5px;font:12px var(--mono);text-align:right}
#acsim .tscroll{overflow-x:auto}
#acsim table{border-collapse:collapse;width:100%;font-size:13px;border:0;background:none;margin:0}
#acsim th{font:11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);text-align:left;padding:5px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
#acsim td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
#acsim td.n{font-family:var(--mono);text-align:right;white-space:nowrap}
#acsim td.note{color:var(--mut);font-size:12px}
#acsim table.comp input{width:68px;font:12px var(--mono);text-align:right;padding:3px 5px}
#acsim table.comp input.nm{width:170px;text-align:left;font-family:inherit;font-size:13px}
#acsim table.comp select{font-size:12px;padding:3px 4px}
#acsim table.comp td{padding:3px 4px}
#acsim table.comp .acts{white-space:nowrap}
#acsim .diff{color:var(--acc)}
#acsim .pass{color:var(--ok)}#acsim .fail{color:var(--bad);font-weight:700}
#acsim .ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
#acsim .modal{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;max-width:520px;width:100%}
#acsim .modal p{color:var(--mut);margin:0 0 10px}
#acsim .modal .minp{width:100%;font-family:var(--mono)}
#acsim .mrow{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
#acsim ul.plain{margin:0;padding-left:18px;color:var(--mut)}
#acsim ul.plain li{margin:3px 0}
#acsim ul.plain b{color:var(--tx);font-weight:600}
#acsim .hide{display:none!important}
@media (max-width:900px){#acsim .grid2{grid-template-columns:1fr}}
@media (max-width:700px){#acsim nav.bar{position:static}}
@media (max-width:520px){#acsim .fgrid{grid-template-columns:1fr}#acsim .fld{grid-template-columns:1fr 92px 34px 80px}#acsim .wrap{padding:0 10px 40px}}
@media (prefers-reduced-motion:no-preference){#acsim .gauge .pin{transition:left .25s}}
</style>
</head>
<body>
<div id="acsim"></div>
<script>
(function(){
'use strict';
/*CORE-START*/
/* =====================================================================
   CORE: configuration schema, physics and tests. No DOM access in here.
   Every physics function is a pure function of the configuration object.
   Frame: origin at nose tip, x aft, y right, z up. Config lengths in mm,
   masses in g, angles in degrees. Physics converts to SI internally.
   ===================================================================== */
var G0=9.80665, R_AIR=287.05287, PI=Math.PI;
function rad(d){return d*PI/180;}
function deg(r){return r*180/PI;}
function clone(o){return JSON.parse(JSON.stringify(o));}
function badKey(k){return k==='__proto__'||k==='constructor'||k==='prototype';}
function getPath(o,p){var a=p.split('.');for(var i=0;i<a.length;i++){if(o==null||badKey(a[i]))return undefined;o=o[a[i]];}return o;}
function setPath(o,p,v){var a=p.split('.');for(var i=0;i<a.length-1;i++){if(badKey(a[i]))return;if(o[a[i]]==null||typeof o[a[i]]!=='object')o[a[i]]={};o=o[a[i]];}if(!badKey(a[a.length-1]))o[a[a.length-1]]=v;}

var SRC=['measured','cad','spec','estimate','guess'];
var SHAPES=['box','cyl','point'];

/* Static test data from the EMAX ECO II 2807 1300KV manual, 25.2 V: [A, g, rpm] */
var PROPS={
 'HQ 7x4x3':{diam:177.8,pitch:101.6,blades:3,pts:[[2.2,300,6550],[4.2,500,9600],[6.5,700,11100],[9.4,900,12500],[13.4,1100,13900]],max:[51.2,2640]},
 'Gemfan 7042 (2-blade)':{diam:177.8,pitch:106.7,blades:2,pts:[[2.2,300,8440],[4,500,10550],[5.4,700,12370],[9.3,900,13960],[12.4,1100,15360]],max:[47.9,2190]},
 'HQ 7x3.5x3':{diam:177.8,pitch:88.9,blades:3,pts:[[2.1,300,7990],[4,500,10100],[6.4,700,11700],[9.2,900,13200],[12.4,1100,14600]],max:[47.1,2580]},
 'Gemfan 7040 (3-blade)':{diam:177.8,pitch:101.6,blades:3,pts:[[2.3,300,8920],[4.1,500,11000],[6.4,700,12800],[9.3,900,14400],[12.5,1100,15700]],max:[45.2,2490]}
};

var GROUPS=[['wing','Wing'],['tail','Tail'],['fus','Fuselage'],['prop','Propulsion'],['flight','Flight and environment']];
var FIELDS=[], FIELD_BY_PATH={};
function F(group,path,label,unit,def,src,tol,min,max,tip,opt){
  var f={group:group,path:path,label:label,unit:unit,def:def,src:src,tol:tol,min:min,max:max,tip:tip||''};
  if(opt){for(var k in opt)f[k]=opt[k];}
  FIELDS.push(f);FIELD_BY_PATH[path]=f;
}
/* Wing */
F('wing','wing.span','Span','mm',1520,'cad',1,100,8000,'Tip to tip.');
F('wing','wing.rootChord','Root chord','mm',267.4,'cad',1,20,3000);
F('wing','wing.tipChord','Tip chord','mm',267.4,'cad',1,10,3000,'Equal to the root chord for a rectangular wing.');
F('wing','wing.areaOverride','Area override','m2',null,'guess',0,0.005,20,'Leave blank to use span x mean chord.',{nullable:true});
F('wing','wing.xLE','Root leading edge x','mm',218,'cad',20,-500,6000,'Distance aft of the nose tip.',{abs:true});
F('wing','wing.z','Root chord height z','mm',50,'estimate',10,-600,600,'Above the fuselage centreline.',{abs:true});
F('wing','wing.incidence','Incidence','deg',2,'estimate',1,-10,15,'',{abs:true});
F('wing','wing.dihedral','Dihedral per side','deg',3,'estimate',1,-15,25,'',{abs:true});
F('wing','wing.sweepLE','Leading-edge sweep','deg',0,'cad',0.5,-30,55,'',{abs:true});
F('wing','wing.naca','NACA 4-digit airfoil','',"2412",'cad',0,0,0,'Four digits, for example 2412 or 0012.',{type:'text'});
F('wing','wing.a0','Section lift-curve slope','1/rad',5.73,'estimate',8,3,7,'6.28 in theory; about 5.7 at model Reynolds numbers.');
F('wing','wing.clMax','Maximum lift coefficient','',1.2,'estimate',10,0.3,3,'Whole aircraft. Rough foamboard skin: about 1.1 to 1.3.');
F('wing','wing.ailSpanFrac','Aileron span fraction','',0.5,'estimate',10,0,1,'Fraction of each half span, measured in from the tip.');
F('wing','wing.ailChordFrac','Aileron chord fraction','',0.26,'estimate',10,0,0.6);
/* Tail */
F('tail','tail.type','Tail type','','vtail','cad',0,0,0,'',{type:'select',options:[['vtail','V-tail'],['conventional','Conventional']]});
F('tail','tail.rootChord','Panel root chord','mm',160,'cad',2,10,2000);
F('tail','tail.tipChord','Panel tip chord','mm',160,'cad',2,5,2000);
F('tail','tail.slant','Panel length','mm',365,'cad',2,20,3000,'V-tail: length of one panel along the slant. Conventional: horizontal tail half span.');
F('tail','tail.dihedral','Panel angle from horizontal','deg',35,'cad',3,-80,80,'Negative values give an inverted V.',{abs:true,only:'vtail'});
F('tail','tail.incidence','Incidence','deg',0,'estimate',1,-10,10,'',{abs:true});
F('tail','tail.sweepLE','Leading-edge sweep','deg',0,'cad',0.5,-30,55,'',{abs:true});
F('tail','tail.xLE','Root leading edge x','mm',845,'cad',20,0,8000,'',{abs:true});
F('tail','tail.yRoot','Root offset from centreline','mm',20,'cad',5,0,600,'',{abs:true});
F('tail','tail.z','Root height z','mm',35,'cad',10,-600,600,'',{abs:true});
F('tail','tail.a0','Section lift-curve slope','1/rad',5.73,'estimate',10,3,7,'Flat plate: 6.28 in theory, lower in practice.');
F('tail','tail.eta','Tail efficiency','',0.9,'estimate',10,0.5,1.2,'Dynamic pressure at the tail divided by free stream.');
F('tail','tail.surfChordFrac','Control surface chord fraction','',0.35,'cad',10,0,0.8);
F('tail','tail.finHeight','Fin height','mm',180,'guess',10,10,2000,'',{only:'conventional'});
F('tail','tail.finRootChord','Fin root chord','mm',160,'guess',10,10,2000,'',{only:'conventional'});
F('tail','tail.finTipChord','Fin tip chord','mm',110,'guess',10,5,2000,'',{only:'conventional'});
/* Fuselage */
F('fus','fus.noseLen','Nose section length','mm',88,'cad',5,0,2000);
F('fus','fus.boomLen','Main body length','mm',755,'cad',1,50,6000);
F('fus','fus.tailLen','Rear section length','mm',168,'cad',5,0,2000);
F('fus','fus.width','Body width','mm',70,'estimate',10,5,1000);
F('fus','fus.height','Body height','mm',70,'estimate',10,5,1000);
F('fus','fus.skid','Skid or gear height','mm',0,'cad',5,0,600,'How far the skid or wheels hold the belly off the ground.',{abs:true});
/* Propulsion */
F('prop','prop.id','Propeller','','HQ 7x4x3','spec',0,0,0,'Picking a listed prop fills in its data. Choose Custom to type your own.',{type:'select',options:Object.keys(PROPS).map(function(k){return [k,k];}).concat([['custom','Custom']])});
F('prop','prop.diam','Prop diameter','mm',177.8,'spec',1,20,1000);
F('prop','prop.pitch','Prop pitch','mm',101.6,'spec',2,10,800);
F('prop','prop.blades','Blade count','',3,'spec',0,1,8,'',{int:true});
F('prop','prop.staticThrust','Static thrust at full throttle','g',2640,'spec',8,0,50000);
F('prop','prop.staticCurrent','Current at full throttle','A',51.2,'spec',8,0,500);
F('prop','prop.x','Prop plane x','mm',1041,'estimate',15,0,8000,'',{abs:true});
F('prop','prop.z','Thrust line height z','mm',20,'estimate',10,-600,600,'',{abs:true});
F('prop','motor.kv','Motor Kv','rpm/V',1300,'spec',3,50,10000);
F('prop','motor.iMax','Motor peak current','A',52,'spec',0,1,500);
F('prop','esc.limit','ESC current rating','A',60,'guess',0,1,500);
F('prop','batt.cells','Battery cells in series','',6,'spec',0,1,14,'',{int:true});
F('prop','batt.mAh','Battery capacity','mAh',2200,'guess',0,100,50000);
F('prop','batt.C','Battery C rating','',60,'guess',0,1,200);
F('prop','batt.vFull','Full voltage per cell','V',4.2,'spec',0,3,4.5);
/* Flight and environment */
F('flight','flt.V','Design airspeed','m/s',13,'guess',0,2,120);
F('flight','flt.massTarget','Target mass','g',1500,'guess',0,50,100000);
F('flight','flt.smMin','Static margin target, minimum','%',8,'guess',0,0,40,'Aft CG limit is set by this.');
F('flight','flt.smMax','Static margin target, maximum','%',18,'guess',0,1,60,'Forward CG guide. The true forward limit is elevator authority (Stage 2).');
F('flight','env.alt','Field altitude','m',30,'estimate',0,-400,6000);
F('flight','env.dT','Temperature offset from ISA','dC',12,'estimate',0,-50,50,'+12 is about 27 C at sea level.');
F('flight','aero.downwash','Downwash gradient override','',null,'guess',0,0,0.9,'Leave blank to compute it from the wing.',{nullable:true});

function C(name,mass,x,y,z,shape,lx,ly,lz,src,tol,mov,axis){
  return {name:name,mass:mass,x:x,y:y,z:z,shape:shape,lx:lx,ly:ly,lz:lz,axis:axis||'x',src:src,tol:tol,mov:!!mov};
}
/* Placeholder mass budget. Everything tagged "estimate" must be weighed. */
function defaultComponents(){return [
 C('Battery 6S 2200 mAh',360,150,0,0,'box',105,35,40,'estimate',30,true),
 C('Nose cone (printed)',30,55,0,0,'box',70,60,60,'estimate',30),
 C('GPS and compass',20,200,0,40,'box',40,40,12,'estimate',30),
 C('ESC',45,230,0,-10,'box',60,30,12,'estimate',30),
 C('Companion computer',35,260,0,10,'box',65,30,10,'estimate',30),
 C('Flight controller',35,300,0,0,'box',45,40,15,'estimate',30),
 C('Receiver',10,330,0,15,'box',25,15,8,'estimate',30),
 C('Spar clamp and wing mount',90,300,0,40,'box',120,90,30,'estimate',30),
 C('Wing half, left',200,330,-380,52,'box',267,760,32,'estimate',25),
 C('Wing half, right',200,330,380,52,'box',267,760,32,'estimate',25),
 C('Aileron servo, left',12,400,-400,50,'box',23,12,25,'spec',10),
 C('Aileron servo, right',12,400,400,50,'box',23,12,25,'spec',10),
 C('Wiring and connectors',40,400,0,0,'box',400,20,10,'estimate',40),
 C('Foam body',110,465,0,0,'box',755,70,70,'estimate',25),
 C('Fasteners and hardware',50,500,0,0,'point',0,0,0,'estimate',40),
 C('Tail servo, left',12,830,-15,20,'box',23,12,25,'spec',10),
 C('Tail servo, right',12,830,15,20,'box',23,12,25,'spec',10),
 C('Rear section and motor mount',110,910,0,5,'box',168,70,70,'estimate',30),
 C('Tail panel, left',22,925,-170,140,'box',160,299,209,'estimate',25),
 C('Tail panel, right',22,925,170,140,'box',160,299,209,'estimate',25),
 C('Motor and leads',55,1005,0,20,'cyl',34,34,0,'spec',10),
 C('Propeller and nut',12,1041,0,20,'cyl',8,178,0,'estimate',20),
 C('Nose ballast',0,45,0,0,'point',0,0,0,'guess',0,true)
];}

function defaultsConfig(){
  var cfg={schema:1,prov:{},components:defaultComponents()};
  FIELDS.forEach(function(f){setPath(cfg,f.path,f.def);});
  return cfg;
}
function getProv(cfg,path){
  var f=FIELD_BY_PATH[path], p=cfg.prov&&Object.prototype.hasOwnProperty.call(cfg.prov,path)?cfg.prov[path]:null;
  return {src:p&&p.src?p.src:f.src, tol:p&&typeof p.tol==='number'?p.tol:f.tol};
}
function coerceField(f,v){
  if(f.type==='select'){for(var i=0;i<f.options.length;i++){if(f.options[i][0]===v)return v;}return undefined;}
  if(f.type==='text'){v=String(v);return /^\d{4}$/.test(v)?v:undefined;}
  if(v===null||v===''){return f.nullable?null:undefined;}
  v=Number(v);if(!isFinite(v))return undefined;
  if(f.int)v=Math.round(v);
  return Math.min(f.max,Math.max(f.min,v));
}
function numOr(v,d,min){v=Number(v);if(!isFinite(v))return d;return (min!=null&&v<min)?min:v;}
function normComponent(c){
  if(!c||typeof c!=='object')return null;
  return {name:String(c.name==null?'Part':c.name).slice(0,60),mass:numOr(c.mass,0,0),x:numOr(c.x,0),y:numOr(c.y,0),z:numOr(c.z,0),
    shape:SHAPES.indexOf(c.shape)>=0?c.shape:'point',lx:numOr(c.lx,0,0),ly:numOr(c.ly,0,0),lz:numOr(c.lz,0,0),
    axis:(c.axis==='y'||c.axis==='z')?c.axis:'x',src:SRC.indexOf(c.src)>=0?c.src:'guess',tol:numOr(c.tol,0,0),mov:!!c.mov};
}
/* Accepts anything (old file, shared link, hand-edited JSON) and returns a valid config. */
function normalizeConfig(raw){
  var cfg=defaultsConfig();
  if(!raw||typeof raw!=='object')return cfg;
  FIELDS.forEach(function(f){var v=getPath(raw,f.path);if(v===undefined)return;var c=coerceField(f,v);if(c!==undefined)setPath(cfg,f.path,c);});
  if(Array.isArray(raw.components))cfg.components=raw.components.slice(0,300).map(normComponent).filter(Boolean);
  if(raw.prov&&typeof raw.prov==='object'){FIELDS.forEach(function(f){
    if(!Object.prototype.hasOwnProperty.call(raw.prov,f.path))return;var p=raw.prov[f.path];if(!p||typeof p!=='object')return;
    cfg.prov[f.path]={src:SRC.indexOf(p.src)>=0?p.src:f.src,tol:numOr(p.tol,f.tol,0)};});}
  return cfg;
}
/* Differences from the defaults, used for short share links. */
function diffConfig(cfg){
  var base=defaultsConfig(), d={f:{}};
  FIELDS.forEach(function(f){var v=getPath(cfg,f.path);if(v!==getPath(base,f.path))d.f[f.path]=v;});
  if(JSON.stringify(cfg.components)!==JSON.stringify(base.components))d.c=cfg.components;
  if(cfg.prov&&Object.keys(cfg.prov).length)d.p=cfg.prov;
  return d;
}
function applyDiff(d){
  var raw=defaultsConfig();
  if(d&&typeof d==='object'){
    if(d.f&&typeof d.f==='object'){Object.keys(d.f).forEach(function(k){if(FIELD_BY_PATH[k])setPath(raw,k,d.f[k]);});}
    if(Array.isArray(d.c))raw.components=d.c;
    if(d.p&&typeof d.p==='object')raw.prov=d.p;
  }
  return normalizeConfig(raw);
}
function b64encode(s){return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function b64decode(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return decodeURIComponent(escape(atob(s)));}
function encodeShare(name,cfg){return b64encode(JSON.stringify({n:name,d:diffConfig(cfg)}));}
function decodeShare(str){var o=JSON.parse(b64decode(str));return {name:String(o.n||'Shared').slice(0,60),cfg:applyDiff(o.d)};}

/* ---------- Atmosphere: ISA troposphere with a temperature offset ---------- */
function isa(alt,dT){
  var T0=288.15,L=0.0065,p0=101325;
  var Tstd=T0-L*alt, p=p0*Math.pow(Tstd/T0,G0/(L*R_AIR)), T=Tstd+(dT||0);
  return {T:T,p:p,rho:p/(R_AIR*T),mu:1.458e-6*Math.pow(T,1.5)/(T+110.4)};
}

/* ---------- Mass, CG and inertia (parallel-axis theorem) ---------- */
function ownInertia(c){
  var m=c.mass/1000,lx=c.lx/1000,ly=c.ly/1000,lz=c.lz/1000;
  if(c.shape==='point')return [0,0,0];
  if(c.shape==='cyl'){ /* lx = length along the axis, ly = diameter */
    var r=ly/2,Ia=0.5*m*r*r,It=m*(3*r*r+lx*lx)/12;
    if(c.axis==='y')return [It,Ia,It];
    if(c.axis==='z')return [It,It,Ia];
    return [Ia,It,It];
  }
  return [m*(ly*ly+lz*lz)/12,m*(lx*lx+lz*lz)/12,m*(lx*lx+ly*ly)/12];
}
function massProps(comps){
  var M=0,sx=0,sy=0,sz=0,i,c,m;
  for(i=0;i<comps.length;i++){c=comps[i];m=c.mass/1000;M+=m;sx+=m*c.x;sy+=m*c.y;sz+=m*c.z;}
  var cg=M>0?{x:sx/M,y:sy/M,z:sz/M}:{x:0,y:0,z:0};
  var I={xx:0,yy:0,zz:0,xz:0,xy:0,yz:0},est=0,mov=0;
  for(i=0;i<comps.length;i++){
    c=comps[i];m=c.mass/1000;var o=ownInertia(c);
    var dx=(c.x-cg.x)/1000,dy=(c.y-cg.y)/1000,dz=(c.z-cg.z)/1000;
    I.xx+=o[0]+m*(dy*dy+dz*dz);I.yy+=o[1]+m*(dx*dx+dz*dz);I.zz+=o[2]+m*(dx*dx+dy*dy);
    I.xz+=m*dx*dz;I.xy+=m*dx*dy;I.yz+=m*dy*dz;
    if(c.src==='estimate'||c.src==='guess')est+=m;
    if(c.mov)mov+=m;
  }
  return {M:M,cg:cg,I:I,estFrac:M>0?est/M:0,mMov:mov};
}

/* ---------- Geometry ---------- */
function trapezoid(span,cr,ct,sweepDeg){ /* one trapezoidal panel pair; span = full span (m) */
  var lam=ct/cr,S=span*(cr+ct)/2;
  var mac=(2/3)*cr*(1+lam+lam*lam)/(1+lam), ymac=(span/6)*(1+2*lam)/(1+lam);
  var tanLE=Math.tan(rad(sweepDeg));
  return {S:S,lam:lam,mac:mac,ymac:ymac,xmacOff:ymac*tanLE,tanHalf:tanLE-(cr-ct)/span};
}
function wingGeom(w){
  var b=w.span/1000,g=trapezoid(b,w.rootChord/1000,w.tipChord/1000,w.sweepLE);
  var S=(w.areaOverride!=null&&w.areaOverride>0)?w.areaOverride:g.S;
  return {b:b,S:S,Sgeo:g.S,AR:b*b/S,lam:g.lam,mac:g.mac,ymac:g.ymac,xLEmac:w.xLE/1000+g.xmacOff,tanHalf:g.tanHalf};
}
/* Finite-wing lift-curve slope, Helmbold form as used in USAF DATCOM and Raymer (M = 0). */
function helmbold(AR,a0,tanHalf){
  var k=a0/(2*PI);
  return 2*PI*AR/(2+Math.sqrt(4+(AR/k)*(AR/k)*(1+tanHalf*tanHalf)));
}
/* V-tail by the projected-area theory of NACA Report 823 (Purser and Campbell):
   pitch uses S*cos^2(angle), yaw uses S*sin^2(angle), with the lift slope taken normal to the panel. */
function tailGeom(t){
  var s=t.slant/1000,g=trapezoid(2*s,t.rootChord/1000,t.tipChord/1000,t.sweepLE);
  var x0=t.xLE/1000,out={S:g.S,AR:(2*s)*(2*s)/g.S,mac:g.mac};
  out.aN=helmbold(out.AR,t.a0,g.tanHalf);
  out.xac=x0+g.xmacOff+0.25*g.mac;
  if(t.type==='vtail'){
    var gam=rad(t.dihedral),c2=Math.cos(gam)*Math.cos(gam);
    out.Sh=g.S*c2;out.Sv=g.S*(1-c2);out.xacV=out.xac;
    out.tipZ=t.z+t.slant*Math.sin(gam);out.tipY=t.yRoot+t.slant*Math.cos(gam);
  }else{
    var fr=t.finRootChord/1000,ft=t.finTipChord/1000,fl=ft/fr;
    out.Sh=g.S;out.Sv=(t.finHeight/1000)*(fr+ft)/2;
    out.xacV=x0+0.25*(2/3)*fr*(1+fl+fl*fl)/(1+fl);
    out.tipZ=t.z+t.finHeight;out.tipY=t.yRoot+t.slant;
  }
  return out;
}
/* Apparent-mass factor (k2 - k1) for an ellipsoid of revolution, from Lamb's coefficients. */
var MUNK_K=[[1,0],[2,0.493],[3,0.681],[4,0.778],[5,0.836],[6,0.873],[8,0.916],[10,0.939],[20,0.98],[50,1]];
function interp(tab,x){
  if(x<=tab[0][0])return tab[0][1];
  for(var i=1;i<tab.length;i++){if(x<=tab[i][0]){var a=tab[i-1],b=tab[i];return a[1]+(b[1]-a[1])*(x-a[0])/(b[0]-a[0]);}}
  return tab[tab.length-1][1];
}
function fusGeom(fu){
  var w=fu.width/1000,h=fu.height/1000,L=(fu.noseLen+fu.boomLen+fu.tailLen)/1000;
  var vol=w*h*(fu.noseLen/3+fu.boomLen+fu.tailLen*0.5)/1000;
  var deq=Math.sqrt(4*w*h/PI),fr=L/deq;
  return {L:L,vol:vol,deq:deq,fineness:fr,k21:interp(MUNK_K,fr)};
}
/* Thin-airfoil theory for a NACA 4-digit camber line (Anderson, Fundamentals of Aerodynamics). */
function thinAirfoil(code){
  var s=String(code);if(!/^\d{4}$/.test(s))s='0012';
  var m=+s.charAt(0)/100,p=+s.charAt(1)/10,t=+s.slice(2)/100;
  if(m===0||p===0)return {m:0,p:0,t:t,alphaL0:0,cm:0};
  var N=4000,I0=0,I1=0,I2=0,dth=PI/N;
  for(var i=0;i<N;i++){
    var th=(i+0.5)*dth,x=(1-Math.cos(th))/2;
    var dz=x<p?2*m/(p*p)*(p-x):2*m/((1-p)*(1-p))*(p-x);
    I0+=dz*(Math.cos(th)-1)*dth;I1+=dz*Math.cos(th)*dth;I2+=dz*Math.cos(2*th)*dth;
  }
  return {m:m,p:p,t:t,alphaL0:-I0/PI,cm:(PI/4)*((2/PI)*I2-(2/PI)*I1)};
}
function nacaOutline(code,n){ /* unit-chord outline, upper surface then lower, for drawing */
  var a=thinAirfoil(code),up=[],lo=[];n=n||30;
  for(var i=0;i<=n;i++){
    var x=(1-Math.cos(PI*i/n))/2;
    var yt=5*a.t*(0.2969*Math.sqrt(x)-0.1260*x-0.3516*x*x+0.2843*x*x*x-0.1015*x*x*x*x);
    var yc=0;
    if(a.m>0&&a.p>0)yc=x<a.p?a.m/(a.p*a.p)*(2*a.p*x-x*x):a.m/((1-a.p)*(1-a.p))*((1-2*a.p)+2*a.p*x-x*x);
    up.push([x,yc+yt]);lo.push([x,yc-yt]);
  }
  return up.concat(lo.reverse());
}
function stallSpeed(W,rho,S,clMax){return (W>0&&S>0&&clMax>0)?Math.sqrt(2*W/(rho*S*clMax)):0;}
function staticMargin(xcg,xnp,mac){return (xnp-xcg)/mac;}

/* ---------- Everything derived from one configuration ---------- */
function compute(cfg){
  var w=cfg.wing,t=cfg.tail,fu=cfg.fus,pr=cfg.prop;
  var atm=isa(cfg.env.alt,cfg.env.dT);
  var mp=massProps(cfg.components),W=mp.M*G0;
  var wg=wingGeom(w),tg=tailGeom(t),fg=fusGeom(fu),af=thinAirfoil(w.naca);
  /* Lift slopes and downwash (Nelson: d(eps)/d(alpha) = 2 a_w / (pi AR)) */
  var aw=helmbold(wg.AR,w.a0,wg.tanHalf);
  var epsAuto=Math.min(0.9,2*aw/(PI*wg.AR));
  var epsA=(cfg.aero.downwash==null)?epsAuto:cfg.aero.downwash;
  /* Fuselage pitching moment, Munk slender body: Cm_alpha = 2 (k2-k1) Vol / (S c) */
  var cmaF=2*fg.k21*fg.vol/(wg.S*wg.mac);
  var hacwb=0.25-cmaF/aw;
  /* Neutral point, Etkin and Reid: h_n = h_nwb + (a_t/a) Vbar_H (1 - eps_alpha) */
  var at=t.eta*tg.aN;
  var a=aw+at*(tg.Sh/wg.S)*(1-epsA);
  var xacwb=wg.xLEmac+hacwb*wg.mac;
  var lbar=tg.xac-xacwb;
  var VHbar=lbar*tg.Sh/(wg.S*wg.mac);
  var hn=hacwb+(at/a)*VHbar*(1-epsA);
  var xnp=(wg.xLEmac+hn*wg.mac)*1000;
  var xcg=mp.cg.x;
  var hcg=(xcg/1000-wg.xLEmac)/wg.mac;
  var sm=mp.M>0?staticMargin(xcg,xnp,wg.mac*1000):NaN;
  /* Tail volume coefficients about the CG */
  var lt=tg.xac-xcg/1000,lv=tg.xacV-xcg/1000;
  var Vh=tg.Sh*lt/(wg.S*wg.mac),Vv=tg.Sv*lv/(wg.S*wg.b);
  /* Speeds and coefficients */
  var V=cfg.flt.V,q=0.5*atm.rho*V*V;
  var Vs=stallSpeed(W,atm.rho,wg.S,w.clMax);
  var CLcr=W/(q*wg.S);
  /* CG range for the target static margin, and what it takes to get there */
  var xAft=(wg.xLEmac+(hn-cfg.flt.smMin/100)*wg.mac)*1000;
  var xFwd=(wg.xLEmac+(hn-cfg.flt.smMax/100)*wg.mac)*1000;
  var xT=(xAft+xFwd)/2,Mg=mp.M*1000,mMov=mp.mMov*1000,Lmm=fg.L*1000;
  var bal={xT:xT,mMov:mMov,dx:null,feasible:false,minX:0,maxX:0,ballast:0,xBallast:Math.max(10,fu.noseLen/2)};
  if(mMov>0&&Mg>0){
    bal.dx=(xT-xcg)*Mg/mMov;bal.minX=Infinity;bal.maxX=-Infinity;
    cfg.components.forEach(function(c){if(!c.mov||c.mass<=0)return;var half=c.shape==='point'?0:c.lx/2;
      bal.minX=Math.min(bal.minX,c.x+bal.dx-half);bal.maxX=Math.max(bal.maxX,c.x+bal.dx+half);});
    bal.feasible=bal.minX>=0&&bal.maxX<=Lmm;
  }
  if(xcg>xT&&xT>bal.xBallast)bal.ballast=Mg*(xcg-xT)/(xT-bal.xBallast);
  var packV=cfg.batt.cells*cfg.batt.vFull;
  return {
    atm:atm,mass:mp,W:W,wing:wg,tail:tg,fus:fg,airfoil:af,
    aw:aw,at:at,a:a,epsA:epsA,epsAuto:epsAuto,cmaF:cmaF,hacwb:hacwb,xacwb:xacwb*1000,
    hn:hn,xnp:xnp,xcg:xcg,hcg:hcg,sm:sm,lt:lt,lv:lv,lbar:lbar,Vh:Vh,Vv:Vv,VHbar:VHbar,
    V:V,q:q,Vs:Vs,CLcr:CLcr,Vratio:Vs>0?V/Vs:0,Re:atm.rho*V*wg.mac/atm.mu,
    wingLoading:mp.M/wg.S,TW:Mg>0?pr.staticThrust/Mg:0,
    xAft:xAft,xFwd:xFwd,balance:bal,
    packV:packV,battI:cfg.batt.C*cfg.batt.mAh/1000,
    pitchSpeed:cfg.motor.kv*packV*(pr.pitch/1000)/60,
    ground:-fu.height/2-fu.skid
  };
}

/* ---------- Validity panel ---------- */
function balanceText(r){
  var b=r.balance;
  if(!(b.mMov>0))return 'Tick "movable" on the battery or ballast in the component table to get a balance suggestion.';
  var dir=b.dx<0?'forward':'aft';
  if(b.feasible)return 'Slide the movable parts '+Math.abs(Math.round(b.dx))+' mm '+dir+' to put the CG at '+Math.round(b.xT)+' mm, or drag the CG marker on the schematic.';
  if(b.dx<0){
    var s='Sliding the movable parts alone cannot fix this: they would have to sit '+Math.round(-b.minX)+' mm ahead of the nose tip. Move the wing aft, lighten the tail end';
    if(b.ballast>0)s+=', or add about '+Math.round(b.ballast)+' g of ballast at x = '+Math.round(b.xBallast)+' mm';
    return s+'.';
  }
  return 'Sliding the movable parts alone cannot fix this: they would extend past the tail. Move the wing forward or add weight aft.';
}
function validity(cfg,r){
  var out=[],t=cfg.tail,pr=cfg.prop;
  function add(level,title,detail,fix){out.push({level:level,title:title,detail:detail,fix:fix||''});}
  function mm(v){return Math.round(v)+' mm';}
  if(!(r.mass.M>0)){add('bad','No mass entered','The component table has no mass, so CG and speeds cannot be computed.','Add components and their weights.');return out;}
  var sm=r.sm*100;
  if(sm<0)add('bad','Statically unstable','The CG is '+mm(r.xcg-r.xnp)+' behind the neutral point (static margin '+sm.toFixed(1)+'%).',balanceText(r));
  else if(sm<cfg.flt.smMin)add('warn','Static margin below target','Static margin is '+sm.toFixed(1)+'%, target minimum is '+cfg.flt.smMin+'%. The aircraft will be pitch-sensitive.',balanceText(r));
  else if(sm>cfg.flt.smMax)add('warn','Static margin above target','Static margin is '+sm.toFixed(1)+'%, target maximum is '+cfg.flt.smMax+'%. Nose-heavy: more up-elevator and trim drag.',balanceText(r));
  else add('ok','Static margin in range','Static margin is '+sm.toFixed(1)+'% (target '+cfg.flt.smMin+' to '+cfg.flt.smMax+'%).');
  if(Math.abs(r.mass.cg.y)>2)add('warn','Lateral CG offset','The CG sits '+Math.abs(r.mass.cg.y).toFixed(1)+' mm '+(r.mass.cg.y>0?'right':'left')+' of the centreline.','Mirror the side-mounted parts or shift the battery sideways.');
  if(r.mass.estFrac>0.2)add('info','Mass is mostly unweighed',Math.round(r.mass.estFrac*100)+'% of the mass is tagged estimate or guess. Balance and speeds are provisional.','Weigh each part and change its source to measured.');
  var dm=(r.mass.M*1000-cfg.flt.massTarget)/cfg.flt.massTarget*100;
  if(Math.abs(dm)>10)add('info','Mass differs from target','Total is '+Math.round(r.mass.M*1000)+' g, '+(dm>0?'+':'')+dm.toFixed(0)+'% against the '+cfg.flt.massTarget+' g target.');
  /* Speeds */
  if(r.Vratio<1.1)add('bad','Design airspeed is at the stall','Design speed is '+r.Vratio.toFixed(2)+' x stall speed ('+r.Vs.toFixed(1)+' m/s).','Raise the design airspeed, cut weight, or add wing area.');
  else if(r.Vratio<1.3)add('warn','Thin stall margin','Design speed is only '+r.Vratio.toFixed(2)+' x stall speed ('+r.Vs.toFixed(1)+' m/s). 1.3 or more is usual.','Raise the design airspeed or reduce wing loading.');
  else add('ok','Stall margin','Design speed is '+r.Vratio.toFixed(2)+' x stall speed ('+r.Vs.toFixed(1)+' m/s).');
  /* Tail volume */
  if(r.Vh<0.25)add('bad','Horizontal tail volume very low','Coefficient is '+r.Vh.toFixed(2)+'. Typical range is 0.35 to 0.6.','Enlarge the tail, flatten the V angle, or lengthen the tail arm.');
  else if(r.Vh<0.35)add('warn','Horizontal tail volume low','Coefficient is '+r.Vh.toFixed(2)+'. Typical range is 0.35 to 0.6.','Enlarge the tail, flatten the V angle, or lengthen the tail arm.');
  if(r.Vv<0.02)add('bad','Vertical tail volume very low','Coefficient is '+r.Vv.toFixed(3)+'. Typical range is 0.025 to 0.05.','Enlarge the tail or steepen the V angle.');
  else if(r.Vv<0.025)add('warn','Vertical tail volume low','Coefficient is '+r.Vv.toFixed(3)+'. Typical range is 0.025 to 0.05.','Enlarge the tail or steepen the V angle.');
  if(r.Vh>=0.35&&r.Vv>=0.025)add('ok','Tail volume','Horizontal '+r.Vh.toFixed(2)+', vertical '+r.Vv.toFixed(3)+'.');
  /* Prop against tail */
  var R=pr.diam/2;
  var teMax=Math.max(t.xLE+t.rootChord,t.xLE+t.slant*Math.tan(rad(t.sweepLE))+t.tipChord);
  var gap=pr.x-teMax,rootR=Math.sqrt(t.yRoot*t.yRoot+(t.z-pr.z)*(t.z-pr.z));
  if(gap<0&&rootR<R)add('bad','Tail passes through the prop disc','The tail trailing edge is '+mm(-gap)+' behind the prop plane and inside the disc radius.','Move the prop plane aft or the tail forward until there is at least 20 mm of gap.');
  else if(gap>=0&&gap<20)add('warn','Tight prop to tail clearance','Only '+mm(gap)+' between the tail trailing edge and the prop plane. 20 to 30 mm is the target.','Move the prop plane aft or trim the control surface.');
  else if(gap>=20)add('ok','Prop to tail clearance',mm(gap)+' between the tail trailing edge and the prop plane.');
  /* Prop against ground */
  var clr=(pr.z-R)-r.ground;
  if(clr<0)add('bad','Prop strikes the ground','The prop tips hang '+mm(-clr)+' below the belly line.','Use a folding prop, raise the thrust line by '+mm(-clr)+' or more, or fit a skid at least '+mm(-clr+15)+' tall.');
  else if(clr<15)add('warn','Low prop ground clearance','Only '+mm(clr)+' between the prop tips and the ground.','Raise the thrust line or add a taller skid.');
  else add('ok','Prop ground clearance',mm(clr)+' between the prop tips and the ground.');
  var lowTail=Math.min(t.z,r.tail.tipZ);
  if(lowTail<r.ground)add('bad','Tail below the ground line','The lowest tail point is '+mm(r.ground-lowTail)+' below the belly line.','Raise the tail root or reduce the downward angle.');
  /* Electrical */
  if(pr.staticCurrent>cfg.esc.limit)add('bad','Full throttle exceeds the ESC rating','This prop draws '+pr.staticCurrent+' A at full throttle; the ESC is rated '+cfg.esc.limit+' A.','Use a higher-rated ESC or a smaller prop.');
  else if(cfg.esc.limit<cfg.motor.iMax)add('warn','ESC rated below the motor peak','ESC '+cfg.esc.limit+' A, motor peak '+cfg.motor.iMax+' A.','Choose an ESC with headroom above the motor peak.');
  if(pr.staticCurrent>cfg.motor.iMax)add('warn','Full throttle exceeds the motor peak current','This prop draws '+pr.staticCurrent+' A; the motor peak is '+cfg.motor.iMax+' A.','Limit throttle or use a smaller prop.');
  if(r.battI<pr.staticCurrent)add('warn','Battery cannot supply full-throttle current','Battery limit is '+Math.round(r.battI)+' A (C rating x capacity); full throttle draws '+pr.staticCurrent+' A.','Use a higher C rating or more capacity.');
  if(r.TW<0.5)add('warn','Low static thrust','Static thrust to weight is '+r.TW.toFixed(2)+'. Hand launches need about 0.5 or more.');
  if(cfg.wing.areaOverride!=null){var da=(cfg.wing.areaOverride-r.wing.Sgeo)/r.wing.Sgeo*100;
    if(Math.abs(da)>3)add('info','Wing area override differs from geometry','Override is '+(da>0?'+':'')+da.toFixed(1)+'% against span x mean chord ('+r.wing.Sgeo.toFixed(3)+' m2).','Clear the override or correct span and chord.');}
  var rank={bad:0,warn:1,info:2,ok:3};
  out.sort(function(p,q2){return rank[p.level]-rank[q2.level];});
  return out;
}

/* ---------- Self-tests ---------- */
function selfTests(cur){
  var T=[];
  function near(name,got,exp,tol,note){T.push({name:name,got:got,exp:exp,tol:tol,pass:isFinite(got)&&Math.abs(got-exp)<=tol,note:note||''});}
  function range(name,got,lo,hi,note){T.push({name:name,got:got,exp:lo+' to '+hi,tol:null,pass:isFinite(got)&&got>=lo&&got<=hi,note:note||''});}
  function truth(name,ok,note){T.push({name:name,got:ok?'yes':'no',exp:'yes',tol:null,pass:!!ok,note:note||''});}
  near('ISA density at sea level (kg/m3)',isa(0,0).rho,1.2250,0.0005,'Standard value');
  near('ISA density at 1000 m (kg/m3)',isa(1000,0).rho,1.1117,0.0010,'Standard value');

/* ---------- storage, history ---------- */
function save(){
  try{localStorage.setItem(KEY,JSON.stringify({v:1,configs:state.configs,active:state.active,units:state.units,showTol:state.showTol}));}catch(e){}
}
function load(){
  var raw=null;
  try{raw=JSON.parse(localStorage.getItem(KEY));}catch(e){raw=null;}
  if(raw&&Array.isArray(raw.configs)&&raw.configs.length){
    state.configs=raw.configs.slice(0,30).map(function(c){return {id:uid(),name:String(c&&c.name||'Config').slice(0,60),cfg:normalizeConfig(c&&c.cfg)};});
    var idx=0;raw.configs.forEach(function(c,i){if(c&&c.id===raw.active)idx=i;});
    state.active=state.configs[Math.min(idx,state.configs.length-1)].id;
    state.units=raw.units==='imperial'?'imperial':'metric';state.showTol=!!raw.showTol;
  }else{
    state.configs=[{id:uid(),name:'Baseline',cfg:defaultsConfig()}];state.active=state.configs[0].id;
  }
  /* shared link */
  try{
    var m=/[#&]c=([A-Za-z0-9_-]+)/.exec(location.hash||'');
    if(m){
      var sh=decodeShare(m[1]),js=JSON.stringify(sh.cfg),found=null;
      state.configs.forEach(function(c){if(JSON.stringify(c.cfg)===js)found=c;});
      if(!found){found={id:uid(),name:sh.name,cfg:sh.cfg};state.configs.push(found);}
      state.active=found.id;
    }
  }catch(e){}
  state.compare=state.configs.slice(0,3).map(function(c){return c.id;});
  state.configs.forEach(function(c){hist[c.id]={stack:[JSON.stringify(c.cfg)],idx:0};});
}
function commit(){
  var c=act(),j=JSON.stringify(c.cfg),H=hist[c.id]||(hist[c.id]={stack:[],idx:-1});
  if(H.stack[H.idx]!==j){
    H.stack=H.stack.slice(0,H.idx+1);H.stack.push(j);
    if(H.stack.length>100)H.stack.shift();
    H.idx=H.stack.length-1;
  }
  save();updateBar();renderTests();
}
function undo(dir){
  var c=act(),H=hist[c.id];if(!H)return;
  var n=H.idx+dir;if(n<0||n>=H.stack.length)return;
  H.idx=n;c.cfg=normalizeConfig(JSON.parse(H.stack[n]));
  save();renderInputs();live();updateBar();renderTests();
}

  });
  /* CG guide strip */
  var ys=-(zBot+55);
  svg.appendChild(sv('line',{x1:0,y1:ys,x2:Lf,y2:ys,stroke:'#33445a','stroke-width':'2'}));
  svg.appendChild(sv('rect',{x:Math.min(r.xFwd,r.xAft),y:ys-7,width:Math.abs(r.xAft-r.xFwd),height:14,fill:'#3ddc97','fill-opacity':'.35',stroke:'#3ddc97'}));
  svg.appendChild(sv('text',{x:Math.min(r.xFwd,r.xAft),y:ys+30,text:'CG guide '+fx(toDisp(r.xFwd,'mm'),isImp()?1:0)+' to '+fx(toDisp(r.xAft,'mm'),isImp()?1:0)+' '+ulabel('mm')}));
  /* neutral point */
  svg.appendChild(sv('line',{x1:r.xnp,y1:-(hh+34),x2:r.xnp,y2:ys,stroke:'#56c7f2','stroke-dasharray':'5 5'}));
  svg.appendChild(sv('polygon',{points:pts([[r.xnp,hh+6],[r.xnp-10,hh+26],[r.xnp+10,hh+26]]),fill:'#56c7f2'}));
  svg.appendChild(sv('text',{x:r.xnp+14,y:-(hh+70),fill:'#56c7f2',style:'fill:#56c7f2',text:'NP '+fx(toDisp(r.xnp,'mm'),isImp()?1:0)}));
  /* CG */
  if(r.mass.M>0){
    var cz=r.mass.cg.z;
    svg.appendChild(sv('line',{x1:r.xcg,y1:-cz,x2:r.xcg,y2:ys,stroke:'#f5a524','stroke-dasharray':'5 5'}));
    var g2=sv('g',{class:'cg','data-drag':'cg'});
    g2.appendChild(sv('circle',{cx:r.xcg,cy:-cz,r:13,fill:'#0a0e14',stroke:'#f5a524','stroke-width':'2.5'}));
    g2.appendChild(sv('path',{d:'M'+r.xcg+','+(-cz)+' L'+r.xcg+','+(-cz-13)+' A13,13 0 0 1 '+(r.xcg+13)+','+(-cz)+' Z M'+r.xcg+','+(-cz)+' L'+r.xcg+','+(-cz+13)+' A13,13 0 0 1 '+(r.xcg-13)+','+(-cz)+' Z',fill:'#f5a524'}));
    g2.appendChild(sv('circle',{cx:r.xcg,cy:-cz,r:20,fill:'transparent'}));
    g2.appendChild(sv('title',{text:'Centre of gravity. Drag to slide the movable parts.'}));
    svg.appendChild(g2);
    svg.appendChild(sv('text',{x:r.xcg+(r.xcg>r.xnp?18:-18),y:-(cz-36),'text-anchor':r.xcg>r.xnp?'start':'end',style:'fill:#f5a524',text:'CG '+fx(toDisp(r.xcg,'mm'),isImp()?1:0)}));
  }
  /* body axes */
  svg.appendChild(sv('path',{d:'M-60,0 L-10,0 M-22,-6 L-10,0 L-22,6 M-60,0 L-60,-50 M-66,-38 L-60,-50 L-54,-38',stroke:'#8493a8','stroke-width':'1.5',fill:'none'}));
  svg.appendChild(sv('text',{x:-30,y:18,text:'x'}));svg.appendChild(sv('text',{x:-80,y:-40,text:'z'}));
}
function drawTop(r){
  var svg=els.topv,c=cur(),fu=c.fus,w=c.wing,t=c.tail,pr=c.prop;
  clear(svg);
  var Lf=r.fus.L*1000,hb=w.span/2*Math.cos(rad(w.dihedral)),R=pr.diam/2;
  var ymax=Math.max(hb,r.tail.tipY,R)+60,x0=-60,x1=Math.max(Lf,pr.x)+60;
  /* rotate so the nose points up: screen x = y, screen y = x */
  svg.setAttribute('viewBox',[-ymax,x0,2*ymax,x1-x0].join(' '));
  function P(a){return a.map(function(p){return p[1].toFixed(1)+','+p[0].toFixed(1);}).join(' ');}
  var hw=fu.width/2,xb=fu.noseLen+fu.boomLen;
  svg.appendChild(sv('polygon',{class:'fus',points:P([[0,0],[fu.noseLen,hw],[xb,hw],[Lf,Math.min(hw,17)],[Lf,-Math.min(hw,17)],[xb,-hw],[fu.noseLen,-hw]])}));
  var tw=Math.tan(rad(w.sweepLE))*w.span/2;
  [1,-1].forEach(function(s){
    svg.appendChild(sv('polygon',{class:'wing',points:P([[w.xLE,0],[w.xLE+tw,s*hb],[w.xLE+tw+w.tipChord,s*hb],[w.xLE+w.rootChord,0]])}));
    var yi=hb*(1-w.ailSpanFrac),f=yi/hb,cI=w.rootChord+(w.tipChord-w.rootChord)*f,xI=w.xLE+tw*f;
    if(w.ailSpanFrac>0&&w.ailChordFrac>0)svg.appendChild(sv('polygon',{class:'surf',points:P([[xI+cI*(1-w.ailChordFrac),s*yi],[w.xLE+tw+w.tipChord*(1-w.ailChordFrac),s*hb],[w.xLE+tw+w.tipChord,s*hb],[xI+cI,s*yi]])}));
    var ts=Math.tan(rad(t.sweepLE))*t.slant,ty=r.tail.tipY,cf=t.surfChordFrac;
    svg.appendChild(sv('polygon',{class:'tailp',points:P([[t.xLE,s*t.yRoot],[t.xLE+ts,s*ty],[t.xLE+ts+t.tipChord,s*ty],[t.xLE+t.rootChord,s*t.yRoot]])}));
    svg.appendChild(sv('polygon',{class:'surf',points:P([[t.xLE+t.rootChord*(1-cf),s*t.yRoot],[t.xLE+ts+t.tipChord*(1-cf),s*ty],[t.xLE+ts+t.tipChord,s*ty],[t.xLE+t.rootChord,s*t.yRoot]])}));
  });
  svg.appendChild(sv('line',{class:'prop',x1:-R,y1:pr.x,x2:R,y2:pr.x}));
  c.components.forEach(function(k){
    if(k.mass<=0)return;
    var d=sv('circle',{cx:k.y,cy:k.x,r:Math.max(5,Math.min(16,Math.sqrt(k.mass))),fill:k.src==='measured'?'#3ddc97':'#f5a524','fill-opacity':'.3',stroke:k.src==='measured'?'#3ddc97':'#f5a524'});
    d.appendChild(sv('title',{text:k.name+' \u2013 '+trimNum(toDisp(k.mass,'g'),1)+' '+ulabel('g')}));
    svg.appendChild(d);
  });
  svg.appendChild(sv('line',{x1:-ymax*0.5,y1:r.xnp,x2:ymax*0.5,y2:r.xnp,stroke:'#56c7f2','stroke-dasharray':'6 6','stroke-width':'2'}));
  if(r.mass.M>0){
    svg.appendChild(sv('circle',{cx:r.mass.cg.y,cy:r.xcg,r:12,fill:'#0a0e14',stroke:'#f5a524','stroke-width':'3'}));
    svg.appendChild(sv('circle',{cx:r.mass.cg.y,cy:r.xcg,r:4,fill:'#f5a524'}));
  }
}
/* dragging on the side view: the svg element persists, its children are redrawn */
function attachDrag(){
  var svg=els.side,drag=null;
  function pos(e){
    var m=svg.getScreenCTM&&svg.getScreenCTM();if(!m||!svg.createSVGPoint)return null;
    var p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(m.inverse());
  }
  svg.addEventListener('pointerdown',function(e){
    var el=e.target&&e.target.closest?e.target.closest('[data-drag]'):null;if(!el)return;
    var p=pos(e);if(!p)return;
    var k=el.getAttribute('data-drag'),c=cur();
    if(k==='cg'){
      if(!(last&&last.mass.mMov>0)){modal({title:'Nothing is movable',text:'Tick "movable" on the battery or ballast in the component table, then drag the CG.',noCancel:true});return;}
      drag={type:'cg',x0:p.x,cg0:last.xcg,start:c.components.map(function(q){return q.x;}),M:last.mass.M,m:last.mass.mMov};
    }else{
      var i=parseInt(k.split(':')[1],10);if(!c.components[i])return;
      drag={type:'comp',i:i,x0:p.x,start:c.components[i].x};
    }
    try{svg.setPointerCapture(e.pointerId);}catch(err){}
    e.preventDefault();
  });
  svg.addEventListener('pointermove',function(e){
    if(!drag)return;var p=pos(e);if(!p)return;var c=cur(),dx=p.x-drag.x0;
    if(drag.type==='cg'){
      var shift=dx*drag.M/drag.m;
      c.components.forEach(function(q,i){if(q.mov)q.x=Math.round(drag.start[i]+shift);});
    }else c.components[drag.i].x=Math.round(drag.start+dx);
    live();
  });
  function end(e){
    if(!drag)return;drag=null;
    try{svg.releasePointerCapture(e.pointerId);}catch(err){}
    renderComponents();commit();
  }
  svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end);
}

/* ---------- boot ---------- */
load();renderShell();updateBar();renderInputs();live();renderTests();
/* test hook: lets a headless run inspect the page */
root.__acsim={state:state,compute:compute,cur:cur};
})();
