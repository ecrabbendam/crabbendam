<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UAS Flight Analysis</title>
<!-- Standalone-page reset only. If you embed #acsim in an existing page, drop this block. -->
<style>html,body{margin:0;background:#fff}</style>
<style>
#acsim{--paper:#fff;--ink:#1c1917;--mut:#6b6159;--maroon:#6b1422;--maroon2:#8a2a39;--tan:#c9b08a;--sand:#f6f0e6;--sand2:#fbf8f2;--line:#ddd0bd;--fail:#a61b1b;--caut:#8a5a00;--pass:#2f6b45;
  --sans:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;--serif:Georgia,"Iowan Old Style","Palatino Linotype","Times New Roman",serif;
  background:var(--paper);color:var(--ink);font:14px/1.5 var(--sans);min-height:100vh;position:relative;text-align:left;font-variant-numeric:tabular-nums}
#acsim *{box-sizing:border-box}
#acsim h1,#acsim h2,#acsim h3,#acsim p,#acsim ol,#acsim ul{margin:0;padding:0;color:inherit}
#acsim .hdr{background:var(--maroon);color:#fff;padding:22px 24px 20px;border-bottom:4px solid var(--tan)}
#acsim .hdr .in,#acsim .bar .in,#acsim .layout{max-width:1320px;margin:0 auto}
#acsim h1{font:400 26px/1.2 var(--serif);letter-spacing:.005em;color:#fff}
#acsim .hdr p{color:#ecdcc4;margin-top:4px;font-size:14px}
#acsim .bar{position:sticky;top:0;z-index:20;background:var(--sand);border-bottom:1px solid var(--line);padding:8px 24px}
#acsim .bar .in{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#acsim .bar .sp{flex:1}
#acsim .bar label{font-size:13px;color:var(--mut);margin-right:2px}
#acsim .btn,#acsim select,#acsim input{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--tan);border-radius:3px;padding:4px 10px}
#acsim .btn{cursor:pointer;white-space:nowrap;font-size:13px}
#acsim .btn:hover{border-color:var(--maroon);color:var(--maroon)}
#acsim .btn:disabled{opacity:.45;cursor:default;border-color:var(--line);color:var(--mut)}
#acsim .btn.pri{background:var(--maroon);color:#fff;border-color:var(--maroon)}
#acsim .btn.pri:hover{background:var(--maroon2);color:#fff}
#acsim .btn.on{background:var(--maroon);color:#fff;border-color:var(--maroon)}
#acsim .btn.sm{padding:1px 7px;font-size:12px}
#acsim input:focus-visible,#acsim select:focus-visible,#acsim .btn:focus-visible,#acsim a:focus-visible{outline:2px solid var(--maroon);outline-offset:1px}
#acsim input.badv{border-color:var(--fail);background:#fdf1f0}
#acsim .layout{display:grid;grid-template-columns:200px minmax(0,1fr);gap:32px;padding:0 24px 64px}
#acsim nav.toc{position:sticky;top:58px;align-self:start;padding-top:28px}
#acsim nav.toc ol{list-style:none;border-left:2px solid var(--line)}
#acsim nav.toc a{display:block;padding:5px 12px;margin-left:-2px;border-left:2px solid transparent;color:var(--mut);text-decoration:none;font-size:13.5px}
#acsim nav.toc a:hover{color:var(--maroon);border-left-color:var(--maroon)}
#acsim nav.toc a span{display:inline-block;width:22px;color:var(--tan)}
#acsim .mod{padding-top:28px;scroll-margin-top:50px}
#acsim .mod>header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--maroon);padding-bottom:6px;margin-bottom:14px}
#acsim .mod>header .no{font:400 20px var(--serif);color:var(--tan);min-width:20px}
#acsim h2{font:400 20px/1.25 var(--serif);color:var(--maroon)}
#acsim .mod>header p{color:var(--mut);font-size:13px;flex:1;min-width:240px}
#acsim h3{font:600 13.5px/1.3 var(--sans);color:var(--ink);margin-bottom:2px}
#acsim .hint{font-size:12.5px;color:var(--mut);margin-top:8px}
#acsim .kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
#acsim .kv>div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:9px 12px 8px}
#acsim .kv .l{font-size:12.5px;color:var(--mut);display:flex;justify-content:space-between;gap:8px}
#acsim .kv .v{font-size:22px;line-height:1.25;font-weight:600}
#acsim .kv .v small{font-size:12.5px;color:var(--mut);font-weight:400;margin-left:4px}
#acsim .kv .s{font-size:12px;color:var(--mut)}
#acsim .st{font-size:12px;font-weight:600;white-space:nowrap}
#acsim .st.fail{color:var(--fail)}#acsim .st.caution{color:var(--caut)}#acsim .st.pass{color:var(--pass)}#acsim .st.note{color:var(--mut)}
#acsim .scale{margin-top:16px;max-width:760px}
#acsim .scale svg{display:block;width:100%;height:auto}
#acsim .cksum{font-size:13.5px;margin-bottom:8px}
#acsim .ck{display:grid;grid-template-columns:84px minmax(0,1fr);gap:4px 12px;padding:10px 0;border-top:1px solid var(--line)}
#acsim .ck:last-child{border-bottom:1px solid var(--line)}
#acsim .ck .d{color:var(--ink);font-size:13.5px}
#acsim .ck.k-pass .d{color:var(--mut)}
#acsim .ck ul{list-style:none;margin-top:6px}
#acsim .ck li{display:flex;gap:10px;align-items:baseline;padding:4px 0 4px 10px;border-left:3px solid var(--tan);margin-top:4px;font-size:13.5px}
#acsim .ck li .tx{flex:1}
#acsim .ck li .side{display:block;color:var(--caut);font-size:12.5px}
#acsim .tabs{display:flex;flex-wrap:wrap;gap:0 4px;border-bottom:1px solid var(--line);margin-bottom:14px}
#acsim .tabs button{font:inherit;font-size:13.5px;background:none;border:0;border-bottom:3px solid transparent;padding:6px 12px;margin-bottom:-1px;color:var(--mut);cursor:pointer}
#acsim .tabs button:hover{color:var(--maroon)}
#acsim .tabs button.on{color:var(--maroon);border-bottom-color:var(--maroon);font-weight:600}
#acsim .fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:2px 28px}
#acsim .fld{display:grid;grid-template-columns:minmax(0,1fr) 98px 46px 88px;gap:6px;align-items:center;padding:3px 0;border-bottom:1px solid var(--sand)}
#acsim .fld label{font-size:13.5px;color:var(--ink);font-weight:400}
#acsim .fld input.num,#acsim .fld input.txt{width:100%;text-align:right;padding:3px 7px}
#acsim .fld select.val{width:100%;grid-column:2 / span 2;padding:3px 6px}
#acsim .fld .u{font-size:12.5px;color:var(--mut)}
#acsim select.src{font-size:12px;padding:2px 4px;width:100%;border-color:var(--line);color:var(--mut)}
#acsim select.src.measured{color:var(--pass);border-color:var(--pass)}
#acsim select.src.guess{color:var(--caut)}
#acsim .tol{display:none;align-items:center;gap:3px;font-size:12.5px;color:var(--mut)}
#acsim.showtol .tol{display:flex}
#acsim.showtol .fld{grid-template-columns:minmax(0,1fr) 98px 46px 88px 88px}
#acsim .tol input{width:52px;padding:2px 5px;font-size:12.5px;text-align:right}
#acsim .tscroll{overflow-x:auto}
#acsim table{border-collapse:collapse;width:100%;font-size:13.5px;border:0;background:none;margin:0}
#acsim th{font-size:12.5px;font-weight:600;color:var(--mut);text-align:left;padding:5px 8px;border-bottom:1px solid var(--tan);white-space:nowrap;background:none}
#acsim td{padding:4px 8px;border-bottom:1px solid var(--sand);vertical-align:middle;background:none}
#acsim tr.sec th{background:var(--sand);color:var(--maroon);border-bottom:1px solid var(--line);font-size:13px}
#acsim td.n,#acsim th.n{text-align:right;white-space:nowrap}
#acsim td.note{color:var(--mut);font-size:12.5px}
#acsim table.comp input{width:66px;font-size:12.5px;text-align:right;padding:2px 5px}
#acsim table.comp input.nm{width:190px;text-align:left;font-size:13px}
#acsim table.comp select{font-size:12.5px;padding:2px 4px}
#acsim table.comp td{padding:3px 4px}
#acsim table.comp .acts{white-space:nowrap}
#acsim .diff{color:var(--maroon);font-weight:600}
#acsim .fig{border:1px solid var(--line);background:#fff;overflow-x:auto}
#acsim .fig svg{display:block;width:100%;height:auto;touch-action:none}
#acsim .fig svg.side{min-width:700px}
#acsim .fig svg.topv{max-height:520px}
#acsim svg text{font:12px var(--sans);fill:var(--mut)}
#acsim .g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 24px}
#acsim .chart{border:1px solid var(--line);padding:10px 12px 6px}
#acsim .chart .cap{color:var(--mut);font-size:12.5px}
#acsim .chart .lg{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12.5px;color:var(--ink);margin-top:4px}
#acsim .chart .lg span{display:inline-flex;align-items:center;gap:6px}
#acsim .chart svg{display:block;width:100%;height:auto;margin-top:4px}
#acsim .chart svg text{font-size:11px}
#acsim .sub{margin-top:20px}
#acsim .pass{color:var(--pass)}#acsim .fail{color:var(--fail);font-weight:600}
#acsim .ov{position:fixed;inset:0;background:rgba(28,25,23,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
#acsim .modal{background:#fff;border:1px solid var(--tan);border-top:4px solid var(--maroon);padding:18px;max-width:520px;width:100%}
#acsim .modal h3{font-size:15px;margin-bottom:6px}
#acsim .modal p{color:var(--mut);margin-bottom:10px}
#acsim .modal .minp{width:100%}
#acsim .mrow{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
#acsim ul.plain{padding-left:18px;color:var(--mut);max-width:900px}
#acsim ul.plain li{margin:4px 0}
#acsim ul.plain b{color:var(--ink);font-weight:600}
#acsim details summary{cursor:pointer;color:var(--maroon);font-size:13.5px;padding:4px 0}
#acsim .hide{display:none!important}
@media (max-width:1000px){
  #acsim .layout{grid-template-columns:minmax(0,1fr);gap:0;padding:0 14px 48px}
  #acsim nav.toc{position:static;padding-top:14px}
  #acsim nav.toc ol{display:flex;flex-wrap:wrap;border-left:0;gap:2px 4px}
  #acsim nav.toc a{border-left:0;margin:0;padding:3px 8px;background:var(--sand2);border:1px solid var(--line);border-radius:3px}
  #acsim nav.toc a span{width:auto;margin-right:5px}
  #acsim .g2{grid-template-columns:minmax(0,1fr)}
  #acsim .hdr,#acsim .bar{padding-left:14px;padding-right:14px}
}
@media (max-width:700px){#acsim .bar{position:static}#acsim .fgrid{grid-template-columns:minmax(0,1fr)}#acsim .fld{grid-template-columns:minmax(0,1fr) 88px 36px 84px}#acsim .ck{grid-template-columns:minmax(0,1fr)}#acsim h1{font-size:21px}}
@media print{#acsim .bar,#acsim nav.toc{display:none}#acsim .layout{display:block}}
</style>
</head>
<body>
<div id="acsim"></div>
<script>
(function(){
'use strict';
/*CORE-START*/
/* =====================================================================
   CORE: configuration schema, physics and tests. No DOM access in here.
   Every physics function is a pure function of the configuration object.
   Frame: origin at nose tip, x aft, y right, z up. Config lengths in mm,
   masses in g, angles in degrees. Physics converts to SI internally.
   ===================================================================== */
var G0=9.80665, R_AIR=287.05287, PI=Math.PI;
function rad(d){return d*PI/180;}
function deg(r){return r*180/PI;}
function clone(o){return JSON.parse(JSON.stringify(o));}
function badKey(k){return k==='__proto__'||k==='constructor'||k==='prototype';}
function getPath(o,p){var a=p.split('.');for(var i=0;i<a.length;i++){if(o==null||badKey(a[i]))return undefined;o=o[a[i]];}return o;}
function setPath(o,p,v){var a=p.split('.');for(var i=0;i<a.length-1;i++){if(badKey(a[i]))return;if(o[a[i]]==null||typeof o[a[i]]!=='object')o[a[i]]={};o=o[a[i]];}if(!badKey(a[a.length-1]))o[a[a.length-1]]=v;}

var SRC=['measured','cad','spec','estimate','guess'];
var SHAPES=['box','cyl','point'];

/* Static test data from the EMAX ECO II 2807 1300KV manual, 25.2 V: [A, g, rpm] */
var PROPS={
 'HQ 7x4x3':{diam:177.8,pitch:101.6,blades:3,pts:[[2.2,300,6550],[4.2,500,9600],[6.5,700,11100],[9.4,900,12500],[13.4,1100,13900]],max:[51.2,2640]},
 'Gemfan 7042 (2-blade)':{diam:177.8,pitch:106.7,blades:2,pts:[[2.2,300,8440],[4,500,10550],[5.4,700,12370],[9.3,900,13960],[12.4,1100,15360]],max:[47.9,2190]},
 'HQ 7x3.5x3':{diam:177.8,pitch:88.9,blades:3,pts:[[2.1,300,7990],[4,500,10100],[6.4,700,11700],[9.2,900,13200],[12.4,1100,14600]],max:[47.1,2580]},
 'Gemfan 7040 (3-blade)':{diam:177.8,pitch:101.6,blades:3,pts:[[2.3,300,8920],[4.1,500,11000],[6.4,700,12800],[9.3,900,14400],[12.5,1100,15700]],max:[45.2,2490]}
};

var GROUPS=[['wing','Wing'],['tail','Tail'],['fus','Fuselage'],['prop','Propulsion'],['aero','Aerodynamics'],['flight','Flight condition'],['crit','Design criteria']];
var FIELDS=[], FIELD_BY_PATH={};
function F(group,path,label,unit,def,src,tol,min,max,tip,opt){
  var f={group:group,path:path,label:label,unit:unit,def:def,src:src,tol:tol,min:min,max:max,tip:tip||''};
  if(opt){for(var k in opt)f[k]=opt[k];}
  FIELDS.push(f);FIELD_BY_PATH[path]=f;
}
/* Wing */
F('wing','wing.span','Span','mm',1520,'cad',1,100,8000,'Tip to tip.');
F('wing','wing.rootChord','Root chord','mm',267.4,'cad',1,20,3000);
F('wing','wing.tipChord','Tip chord','mm',267.4,'cad',1,10,3000,'Equal to the root chord for a rectangular wing.');
F('wing','wing.areaOverride','Area override','m2',null,'guess',0,0.005,20,'Leave blank to use span x mean chord.',{nullable:true});
F('wing','wing.xLE','Root leading edge x','mm',218,'cad',20,-500,6000,'Distance aft of the nose tip.',{abs:true});
F('wing','wing.z','Root chord height z','mm',50,'estimate',10,-600,600,'Above the fuselage centreline.',{abs:true});
F('wing','wing.incidence','Incidence','deg',2,'estimate',1,-10,15,'',{abs:true});
F('wing','wing.dihedral','Dihedral per side','deg',3,'estimate',1,-15,25,'',{abs:true});
F('wing','wing.sweepLE','Leading-edge sweep','deg',0,'cad',0.5,-30,55,'',{abs:true});
F('wing','wing.naca','NACA 4-digit airfoil','',"2412",'cad',0,0,0,'Four digits, for example 2412 or 0012.',{type:'text'});
F('wing','wing.a0','Section lift-curve slope','1/rad',5.73,'estimate',8,3,7,'6.28 in theory; about 5.7 at model Reynolds numbers.');
F('wing','wing.clMax','Section maximum lift coefficient','',1.2,'estimate',10,0.3,3,'Of the airfoil at flight Reynolds number. The wing and trimmed aircraft values are computed.');
F('wing','wing.ailSpanFrac','Aileron span fraction','',0.5,'estimate',10,0,1,'Fraction of each half span, measured in from the tip.');
F('wing','wing.ailChordFrac','Aileron chord fraction','',0.26,'estimate',10,0,0.6);
/* Tail */
F('tail','tail.type','Tail type','','vtail','cad',0,0,0,'',{type:'select',options:[['vtail','V-tail'],['conventional','Conventional']]});
F('tail','tail.rootChord','Panel root chord','mm',160,'cad',2,10,2000);
F('tail','tail.tipChord','Panel tip chord','mm',160,'cad',2,5,2000);
F('tail','tail.slant','Panel length','mm',365,'cad',2,20,3000,'V-tail: length of one panel along the slant. Conventional: horizontal tail half span.');
F('tail','tail.dihedral','Panel angle from horizontal','deg',35,'cad',3,-80,80,'Negative values give an inverted V.',{abs:true,only:'vtail'});
F('tail','tail.incidence','Incidence','deg',0,'estimate',1,-10,10,'',{abs:true});
F('tail','tail.sweepLE','Leading-edge sweep','deg',0,'cad',0.5,-30,55,'',{abs:true});
F('tail','tail.xLE','Root leading edge x','mm',845,'cad',20,0,8000,'',{abs:true});
F('tail','tail.yRoot','Root offset from centreline','mm',20,'cad',5,0,600,'',{abs:true});
F('tail','tail.z','Root height z','mm',35,'cad',10,-600,600,'',{abs:true});
F('tail','tail.a0','Section lift-curve slope','1/rad',5.73,'estimate',10,3,7,'Flat plate: 6.28 in theory, lower in practice.');
F('tail','tail.eta','Tail efficiency','',0.9,'estimate',10,0.5,1.2,'Dynamic pressure at the tail divided by free stream.');
F('tail','tail.surfChordFrac','Control surface chord fraction','',0.35,'cad',10,0,0.8);
F('tail','tail.finHeight','Fin height','mm',180,'guess',10,10,2000,'',{only:'conventional'});
F('tail','tail.finRootChord','Fin root chord','mm',160,'guess',10,10,2000,'',{only:'conventional'});
F('tail','tail.finTipChord','Fin tip chord','mm',110,'guess',10,5,2000,'',{only:'conventional'});
/* Fuselage */
F('fus','fus.noseLen','Nose section length','mm',88,'cad',5,0,2000);
F('fus','fus.boomLen','Main body length','mm',755,'cad',1,50,6000);
F('fus','fus.tailLen','Rear section length','mm',168,'cad',5,0,2000);
F('fus','fus.width','Body width','mm',70,'estimate',10,5,1000);
F('fus','fus.height','Body height','mm',70,'estimate',10,5,1000);
F('fus','fus.skid','Skid or gear height','mm',0,'cad',5,0,600,'How far the skid or wheels hold the belly off the ground.',{abs:true});
/* Propulsion */
F('prop','prop.id','Propeller','','HQ 7x4x3','spec',0,0,0,'Picking a listed prop fills in its data. Choose Custom to type your own.',{type:'select',options:Object.keys(PROPS).map(function(k){return [k,k];}).concat([['custom','Custom']])});
F('prop','prop.diam','Prop diameter','mm',177.8,'spec',1,20,1000);
F('prop','prop.pitch','Prop pitch','mm',101.6,'spec',2,10,800);
F('prop','prop.blades','Blade count','',3,'spec',0,1,8,'',{int:true});
F('prop','prop.staticThrust','Static thrust at full throttle','g',2640,'spec',8,0,50000);
F('prop','prop.staticCurrent','Current at full throttle','A',51.2,'spec',8,0,500);
F('prop','prop.x','Prop plane x','mm',1041,'estimate',15,0,8000,'',{abs:true});
F('prop','prop.z','Thrust line height z','mm',20,'estimate',10,-600,600,'',{abs:true});
F('prop','motor.kv','Motor Kv','rpm/V',1300,'spec',3,50,10000);
F('prop','motor.iMax','Motor peak current','A',52,'spec',0,1,500);
F('prop','esc.limit','ESC current rating','A',60,'guess',0,1,500);
F('prop','batt.cells','Battery cells in series','',6,'spec',0,1,14,'',{int:true});
F('prop','batt.mAh','Battery capacity','mAh',2200,'guess',0,100,50000);
F('prop','batt.C','Battery C rating','',60,'guess',0,1,200);
F('prop','batt.vFull','Full voltage per cell','V',4.2,'spec',0,3,4.5);
/* Flight and environment */
F('flight','flt.V','Design airspeed','m/s',13,'guess',0,2,120);
F('flight','flt.massTarget','Target mass','g',1500,'guess',0,50,100000);
F('flight','env.alt','Field altitude','m',30,'estimate',0,-400,6000);
F('flight','env.dT','Temperature offset from ISA','dC',12,'estimate',0,-50,50,'+12 is about 27 C at sea level.');

F('wing','wing.washout','Washout at the tip','deg',0,'cad',0.5,-5,10,'Tip twisted nose-down relative to the root, varying linearly along the span.',{abs:true});
F('wing','wing.ailMaxDefl','Aileron travel, each way','deg',20,'estimate',10,1,45);
F('tail','tail.thickness','Panel thickness','mm',5,'estimate',20,0.5,100);
F('tail','tail.stallDeg','Panel stall angle','deg',11,'estimate',15,4,20,'Flat plates stall early, around 10 to 12 degrees.');
F('tail','tail.maxDefl','Control surface travel, each way','deg',20,'estimate',10,1,45);
F('tail','tail.surfSpanFrac','Control surface span fraction','',1,'cad',5,0.1,1);
F('aero','aero.ctrlEff','Control effectiveness factor','',0.8,'estimate',15,0.3,1,'Multiplies thin-airfoil flap effectiveness to allow for hinge gaps and viscous losses.');
F('aero','aero.roughness','Skin friction multiplier','',1.2,'estimate',15,1,3,'Allowance for paper-faced foam, tape edges and gaps.');
F('aero','aero.bodyShape','Body form multiplier','',1.35,'estimate',15,1,3,'Allowance for a square cross-section over a streamlined body of revolution.');
F('aero','aero.interference','Interference allowance','%',10,'estimate',50,0,100,'Added to the summed component drag.',{abs:true});
F('aero','aero.cd0Override','Zero-lift drag override','',null,'guess',0,0.005,0.3,'Leave blank to use the component buildup.',{nullable:true});
F('aero','aero.eOverride','Oswald efficiency override','',null,'guess',0,0.3,1,'Leave blank to compute it.',{nullable:true});
F('aero','aero.downwash','Downwash gradient override','',null,'guess',0,0,0.9,'Leave blank to compute it from the wing.',{nullable:true});
F('crit','flt.smMin','Static margin, minimum','%',8,'guess',0,0,40,'Sets the aft CG limit.',{abs:true});
F('crit','flt.smMax','Static margin, preferred maximum','%',18,'guess',0,1,60,'Above this the aircraft still flies but carries more trim drag.',{abs:true});
F('crit','flt.stallRatio','Design speed over stall speed, minimum','',1.3,'guess',0,1,3);
F('crit','flt.cnbMin','Directional stability, minimum','1/rad',0.05,'guess',0,0,0.5,'Yawing moment slope with sideslip.');
F('crit','flt.propGap','Prop to tail clearance, minimum','mm',20,'guess',0,0,500);
F('crit','flt.groundClr','Prop ground clearance, minimum','mm',15,'guess',0,0,500);

var ATTS=['','wing','tail','prop'];
function inferAtt(name){
  name=String(name||'');

/* ---------- Atmosphere: ISA troposphere with a temperature offset ---------- */

  if(c.shape==='cyl'){ /* lx = length along the axis, ly = diameter */
    var r=ly/2,Ia=0.5*m*r*r,It=m*(3*r*r+lx*lx)/12;

function massProps(comps){

  for(i=0;i<comps.length;i++){c=comps[i];m=c.mass/1000;M+=m;sx+=m*c.x;sy+=m*c.y;sz+=m*c.z;}
  var cg=M>0?{x:sx/M,y:sy/M,z:sz/M}:{x:0,y:0,z:0};
  var I={xx:0,yy:0,zz:0,xz:0,xy:0,yz:0},est=0,mov=0;
  for(i=0;i<comps.length;i++){

    var dx=(c.x-cg.x)/1000,dy=(c.y-cg.y)/1000,dz=(c.z-cg.z)/1000;
    I.xx+=o[0]+m*(dy*dy+dz*dz);I.yy+=o[1]+m*(dx*dx+dz*dz);I.zz+=o[2]+m*(dx*dx+dy*dy);
    I.xz+=m*dx*dz;I.xy+=m*dx*dy;I.yz+=m*dy*dz;
    if(c.src==='estimate'||c.src==='guess')est+=m;

/* ---------- Geometry ---------- */

function tailGeom(t){

  var x0=t.xLE/1000,out={S:g.S,AR:(2*s)*(2*s)/g.S,mac:g.mac};

  var vol=w*h*(fu.noseLen/3+fu.boomLen+fu.tailLen*0.5)/1000;

function staticMargin(xcg,xnp,mac){return (xnp-xcg)/mac;}

/* ---------- Numerical tools ---------- */
function solveLin(A,b){ /* Gaussian elimination with partial pivoting */
  var n=b.length,i,j,k;A=A.map(function(r){return r.slice();});b=b.slice();
  for(i=0;i<n;i++){
    var p=i;for(j=i+1;j<n;j++){if(Math.abs(A[j][i])>Math.abs(A[p][i]))p=j;}
    var t=A[i];A[i]=A[p];A[p]=t;t=b[i];b[i]=b[p];b[p]=t;
    if(Math.abs(A[i][i])<1e-14)return null;
    for(j=i+1;j<n;j++){var f=A[j][i]/A[i][i];if(f===0)continue;for(k=i;k<n;k++)A[j][k]-=f*A[i][k];b[j]-=f*b[i];}

  cfg.components.forEach(function(c){if(c.att===att){c.x=round1(c.x+(dx||0));c.z=round1(c.z+(dz||0));}});

/* ---------- Lifting-line theory ----------

     sum A_n sin(n th) (mu n + sin th) = mu sin th (alpha - alpha_L0),  mu = a0 c / (4 b)
   Solved once for unit angle (A1) and once for the twist alone (A2). */

  var N=o.N||20,b=o.b,i,j,M=[],r1=[],r2=[],eta=[],ch=[],th=[];
  var cf=o.chordFn||function(e){return o.cr+(o.ct-o.cr)*e;};
  for(i=1;i<=N;i++){
    var t=i*PI/(2*N),e=Math.cos(t),c=Math.max(cf(e),1e-6),mu=c*o.a0/(4*b),row=[];
    for(j=0;j<N;j++){var n=2*j+1;row.push(Math.sin(n*t)*(mu*n+Math.sin(t)));}
    M.push(row);r1.push(mu*Math.sin(t));r2.push(-mu*Math.sin(t)*(o.washout||0)*e);
    th.push(t);eta.push(e);ch.push(c);

  var A1=solveLin(M,r1),A2=solveLin(M,r2);
  if(!A1||!A2)return null;

    for(j=0;j<N;j++){var sn=Math.sin((2*j+1)*th[i]);s1+=A1[j]*sn;s2+=A2[j]*sn;}
    p.push(4*b/ch[i]*s1);q.push(4*b/ch[i]*s2);

  return {N:N,AR:AR,a:PI*AR*A1[0],CLb:PI*AR*A2[0],eta:eta,c:ch,p:p,q:q,A1:A1,A2:A2};

function llStall(ll,clMax){ /* first station to reach the section limit */

  var s=0;for(var j=0;j<ll.N;j++){var A=alphaP*ll.A1[j]+ll.A2[j];s+=(2*j+1)*A*A;}

/* ---------- Longitudinal trim model ----------
   Etkin and Reid form, moments about the CG at fraction h of the mean chord:

     Tt = B [ (al + i_t) - eps_a (al + k) + tauE de ]     tail lift on the projected area

/* Power-off trim at the wing stall angle; if the elevator runs out first, the slowest trimmed point. */
function tmStall(m,alS,h,maxDe){
  var cm0=tmCm(m,alS,0,h,0),cmd=tmCm(m,alS,1,h,0)-cm0,req=-cm0/cmd;
  var de=Math.max(-maxDe,Math.min(maxDe,req)),al=alS,limited=false;
  if(de!==req){
    var c0=tmCm(m,alS,de,h,0),cma=(tmCm(m,alS+1e-3,de,h,0)-c0)/1e-3;
    if(cma<0){var a2=alS-c0/cma;if(a2<alS){al=a2;limited=true;}}
  }
  return {deReq:req,de:de,alpha:al,CL:tmCL(m,al,de),limited:limited,tailEq:tmTail(m,al,de)/m.B*m.cosG};
}

/* ---------- Everything derived from one configuration ---------- */
function compute(cfg,lite){
  var w=cfg.wing,t=cfg.tail,fu=cfg.fus,pr=cfg.prop,ae=cfg.aero;
  var atm=isa(cfg.env.alt,cfg.env.dT);
  var mp=massProps(cfg.components),W=mp.M*G0;
  var wg=wingGeom(w),tg=tailGeom(t),fg=fusGeom(fu),af=thinAirfoil(w.naca);
  var isV=t.type==='vtail',gam=isV?rad(t.dihedral):0,cosG=Math.cos(gam),sinG=Math.sin(gam);
  /* Wing lift by lifting-line; sweep handled by the ratio of Helmbold slopes */
  var ll=liftingLine({b:wg.b,cr:w.rootChord/1000,ct:w.tipChord/1000,a0:w.a0,washout:rad(w.washout),S:wg.Sgeo});
  var sweepF=helmbold(wg.AR,w.a0,wg.tanHalf)/helmbold(wg.AR,w.a0,0);
  var scale=sweepF*wg.Sgeo/wg.S,aw=scale*ll.a;
  var epsAuto=Math.min(0.9,2*aw/(PI*wg.AR)),epsA=(ae.downwash==null)?epsAuto:ae.downwash;
  /* Fuselage, Munk slender body: Cm_alpha = 2 (k2-k1) Vol / (S c) */
  var cmaF=2*fg.k21*fg.vol/(wg.S*wg.mac),hacwb=0.25-cmaF/aw;
  var at=t.eta*tg.aN,ShS=tg.Sh/wg.S;
  var a=aw+at*ShS*(1-epsA);
  var xacwb=wg.xLEmac+hacwb*wg.mac,lbar=tg.xac-xacwb,VH=lbar*tg.Sh/(wg.S*wg.mac);
  var hn=hacwb+(at/a)*VH*(1-epsA);
  var xnp=(wg.xLEmac+hn*wg.mac)*1000,xcg=mp.cg.x,hcg=(xcg/1000-wg.xLEmac)/wg.mac;
  var sm=mp.M>0?staticMargin(xcg,xnp,wg.mac*1000):NaN;
  var lt=tg.xac-xcg/1000,lv=tg.xacV-xcg/1000;
  var Vh=tg.Sh*lt/(wg.S*wg.mac),Vv=tg.Sv*lv/(wg.S*wg.b);
  var V=cfg.flt.V,q=0.5*atm.rho*V*V,CLcr=W/(q*wg.S);
  /* Trim model */
  var tau=flapTau(t.surfChordFrac)*ae.ctrlEff*t.surfSpanFrac;
  var m={A:aw,k:rad(w.incidence)-af.alphaL0+ll.CLb/ll.a,B:at,epsA:epsA,ShS:ShS,VH:VH,hac:hacwb,cmac:af.cm,it:rad(t.incidence),tauE:tau/cosG,cosG:cosG};
  var maxDe=rad(t.maxDefl),tailStall=rad(t.stallDeg);
  /* Stall: wing by lifting-line, aircraft trimmed power-off */

  var stT=tmStall(m,alS,hcg,maxDe);

  var Ts=tmTail(m,alS,-maxDe),CLs=tmCL(m,alS,-maxDe),hFwdE=hacwb+(VH*Ts-af.cm)/CLs;
  var Tl=-at*tailStall/cosG,CLl=aw*(alS+m.k)+ShS*Tl,hFwdT=hacwb+(VH*Tl-af.cm)/CLl;
  var hFwd=Math.max(hFwdE,hFwdT);
  function xOf(h){return (wg.xLEmac+h*wg.mac)*1000;}
  var xAft=xOf(hn-cfg.flt.smMin/100),xPref=xOf(hn-cfg.flt.smMax/100);

  var cd0=(ae.cd0Override!=null)?ae.cd0Override:db.cd0;
  var clw=Math.max(CLcr/scale,0.2),alP=(clw-ll.CLb)/ll.a,eInv=clw*clw/(PI*ll.AR*llInduced(ll,alP));

  var sFus=1-2*(fg.deq/wg.b)*(fg.deq/wg.b);

  }
  var cr=pointAt(V);
  var LDmax=1/(2*Math.sqrt(cd0*K)),Vbg=Math.sqrt(2*W/(atm.rho*wg.S))*Math.pow(K/cd0,0.25);

  var clbW=-aw*rad(w.dihedral)*(1+2*lamW)/(6*(1+lamW)),clbT,aV;
  if(isV){
    aV=tg.aN;

  var cnbT=t.eta*aV*Vv,cnbF=-2*fg.k21*fg.vol/(wg.S*wg.b),Cnb=cnbT+cnbF;

  });
  unc.sort(function(p1,p2){return p2.dx-p1.dx;});

  var r={
    atm:atm,mass:mp,W:W,wing:wg,tail:tg,fus:fg,airfoil:af,ll:ll,tm:m,
    aw:aw,at:at,a:a,epsA:epsA,cmaF:cmaF,hacwb:hacwb,xacwb:xacwb*1000,sweepF:sweepF,
    hn:hn,xnp:xnp,xcg:xcg,hcg:hcg,sm:sm,lt:lt,lv:lv,lbar:lbar,Vh:Vh,Vv:Vv,VHbar:VH,
    V:V,q:q,CLcr:CLcr,Re:atm.rho*V*wg.mac/atm.mu,
    stall:{alphaP:st.alphaP,eta:st.eta,CLw:scale*st.CL,alpha:alS,trim:stT},
    CLmax:CLmax,Vs:Vs,Vratio:Vs>0?V/Vs:0,
    VminElev:stT.limited?stallSpeed(W,atm.rho,wg.S,stT.CL):null,
    hFwdE:hFwdE,hFwdT:hFwdT,hFwd:hFwd,fwdBind:hFwdE>=hFwdT?'elev':'tail',
    xFwd:xOf(hFwd),xAft:xAft,xPref:xPref,
    drag:db,cd0:cd0,eInv:eInv,e:e,K:K,cruise:cr,LDmax:LDmax,Vbg:Vbg,
    cma:-a*(hn-hcg),cmde:m.B*m.tauE*(ShS*(hcg-hacwb)-VH),clde:ShS*m.B*m.tauE,
    Cnb:Cnb,cnbT:cnbT,cnbF:cnbF,Clb:clbW+clbT,clbW:clbW,clbT:clbT,Clda:Clda,ailTrim:ailTrim,
    cgUnc:Math.sqrt(rss),uncList:unc,
    wingLoading:mp.M/wg.S,TW:mp.M>0?pr.staticThrust/(mp.M*1000):0,
    packV:packV,battI:cfg.batt.C*cfg.batt.mAh/1000,pitchSpeed:cfg.motor.kv*packV*(pr.pitch/1000)/60,
    ground:-fu.height/2-fu.skid

  if(lite||!(mp.M>0))return r;
  /* Curves for the charts */
  var i,n,C={};
  var Vlo=Math.max(Vs,0.5),Vhi=Math.max(2.2*V,Vlo*2.5);
  C.speed=[];n=44;for(i=0;i<=n;i++)C.speed.push(pointAt(Vlo+(Vhi-Vlo)*i/n));
  C.polar=[];n=40;for(i=0;i<=n;i++){var cl=-0.2+(CLmax+0.2)*i/n;C.polar.push([cd0+K*cl*cl,cl]);}
  var a0=rad(-6),a1=alS;
  C.lift=[];C.cm0=[];C.cmTrim=[];n=30;
  for(i=0;i<=n;i++){
    var al=a0+(a1-a0)*i/n,c0=tmCm(m,al,0,hcg,0),cmd=tmCm(m,al,1,hcg,0)-c0;
    C.lift.push([deg(al),tmCL(m,al,-c0/cmd)]);
    C.cm0.push([deg(al),c0]);C.cmTrim.push([deg(al),tmCm(m,al,cr.de,hcg,0)]);
  }
  var alPc=(CLcr/scale-ll.CLb)/ll.a;
  C.span=[];for(i=ll.N-1;i>=0;i--)C.span.push({eta:ll.eta[i],cruise:alPc*ll.p[i]+ll.q[i],stall:st.alphaP*ll.p[i]+ll.q[i]});

  r.curves=C;
  return r;
}

/* ---------- Checks ----------
   Every recommendation is produced by solving this model for the configuration on screen.
   A recommendation is only shown if applying it to a copy of the configuration clears the
   check, and any other check it would break is named alongside it. */
var LEVEL_RANK={fail:0,caution:1,note:2,pass:3};
function propTail(cfg,r){ /* tail stations that lie inside the prop disc radius */
  var t=cfg.tail,pr=cfg.prop,R=pr.diam/2,st=[],i,s,tanS=Math.tan(rad(t.sweepLE));
  var isV=t.type==='vtail',g=isV?rad(t.dihedral):0;
  for(i=0;i<=20;i++){
    s=i/20;var c=t.rootChord+(t.tipChord-t.rootChord)*s,xl=t.xLE+t.slant*s*tanS;
    st.push({y:t.yRoot+t.slant*s*Math.cos(g),z:t.z+t.slant*s*Math.sin(g),xl:xl,xt:xl+c});
    if(!isV){var cf=t.finRootChord+(t.finTipChord-t.finRootChord)*s,xf=t.xLE+(t.finRootChord-cf);st.push({y:0,z:t.z+t.finHeight*s,xl:xf,xt:xf+cf});}
  }
  var ahead=Infinity,behind=Infinity,cross=false;
  st.forEach(function(p){
    if(Math.sqrt(p.y*p.y+(p.z-pr.z)*(p.z-pr.z))>R+5)return;
    if(p.xt<=pr.x)ahead=Math.min(ahead,pr.x-p.xt);
    else if(p.xl>=pr.x)behind=Math.min(behind,p.xl-pr.x);
    else cross=true;
  });
  if(cross)return {kind:'cross',gap:-1,need:Math.max.apply(null,st.map(function(p){return p.xt;}))-pr.x};
  if(ahead===Infinity&&behind===Infinity)return {kind:'none',gap:Infinity};
  return ahead<=behind?{kind:'ahead',gap:ahead}:{kind:'behind',gap:behind};
}
function validity(cfg,r,opt){
  var noFix=opt&&opt.noFix,items=[];
  var w=cfg.wing,t=cfg.tail,pr=cfg.prop,fl=cfg.flt;

  function mm(v){return Math.round(v)+' mm';}
  function d1(v){return (Math.round(v*10)/10).toFixed(1);}
  function nm(v){return String(parseFloat(Number(v).toFixed(2)));}
  function tryCfg(fn){var c=clone(cfg);fn(c);c=normalizeConfig(c);return {cfg:c,r:compute(c,true)};}
  if(!(r.mass.M>0)){items.push({id:'mass',level:'fail',title:'No mass entered',detail:'The component table has no mass, so balance and speeds cannot be computed.',fixes:[]});return items;}
  var M=r.mass.M*1000,mMov=r.mass.mMov*1000,Lmm=r.fus.L*1000,mac=r.wing.mac*1000,sm=r.sm*100;
  var movable=cfg.components.filter(function(c){return c.mov&&c.mass>0;});
  var movLabel=movable.length?(movable.length===1?movable[0].name:'the '+movable.length+' movable parts'):'';

    if(!(mMov>0))return null;
    var dx=(xT-r.xcg)*M/mMov,ok=true;
    movable.forEach(function(c){var half=c.shape==='point'?0:c.lx/2;if(c.x+dx-half<0||c.x+dx+half>Lmm)ok=false;});
    if(!ok||Math.abs(dx)<0.5)return null;

      apply:function(c){c.components.forEach(function(k){if(k.mov&&k.mass>0)k.x=round1(k.x+dx);});}};

    else if(sm<fl.smMin){level='caution';detail='Static margin is '+d1(sm)+'%, below the '+nm(fl.smMin)+'% minimum. The CG is '+mm(r.xcg-r.xAft)+' aft of the aft limit.';}

      var dW=hi<=lo?null:bisect(function(d){return tryCfg(function(c){c.wing.xLE+=d;shiftGroup(c,'wing',d);}).r.sm*100-target;},lo,hi,26);
      if(dW!=null&&Math.abs(dW)>=0.5){dW=round1(dW);cands.push({text:'Move the wing '+mm(Math.abs(dW))+' '+(dW<0?'forward':'aft')+(nAtt?', together with the '+nAtt+' parts set to move with it':'')+'. '+out,

          apply:function(c){var b=null;c.components.forEach(function(k){if(!b&&/ballast/i.test(k.name)&&k.mass===0)b=k;});

      }else{
        var fh=bisect(function(v){return tryCfg(function(c){c.tail.finHeight=v;}).r.Cnb-tgt;},t.finHeight,t.finHeight*3,24);
        if(fh!=null){fh=Math.ceil(fh);cands.push({text:'Increase the fin height to '+fh+' mm.',apply:function(c){c.tail.finHeight=fh;}});}
      }
      var sl=bisect(function(v){return tryCfg(function(c){c.tail.slant=v;}).r.Cnb-tgt;},t.slant,t.slant*2.5,24);
      if(sl!=null&&t.type==='vtail'){sl=Math.ceil(sl);var rs=tryCfg(function(c){c.tail.slant=sl;}).r;
        cands.push({text:'Lengthen each tail panel to '+sl+' mm. Static margin becomes '+d1(rs.sm*100)+'%.',apply:function(c){c.tail.slant=sl;}});}
    }
    add('cnb',level,'Directional stability',detail,ok,cands);
  })();
  /* 6. Lateral balance */
  (function(){
    var y=r.mass.cg.y;
    function frac(c,rr){return isFinite(rr.ailTrim)?Math.abs(deg(rr.ailTrim))/c.wing.ailMaxDefl:(Math.abs(rr.mass.cg.y)>0.5?1:0);}
    function ok(c,rr){return frac(c,rr)<0.05;}
    var f=frac(cfg,r),level=f>=0.25?'caution':(f>=0.05?'note':'pass'),detail,cands=[];
    if(Math.abs(y)<0.05)detail='The CG is on the centreline.';
    else if(isFinite(r.ailTrim))detail='The CG is '+d1(Math.abs(y))+' mm '+(y>0?'right':'left')+' of the centreline. Holding wings level at the design speed takes '+Math.abs(deg(r.ailTrim)).toFixed(2)+'° of aileron, '+Math.round(f*100)+'% of travel.';
    else detail='The CG is '+d1(Math.abs(y))+' mm '+(y>0?'right':'left')+' of the centreline and no ailerons are defined to hold it.';
    var dy=mMov>0?-M*y/mMov:NaN,fits=isFinite(dy);
    movable.forEach(function(k){if(Math.abs(k.y+dy)>cfg.fus.width/2)fits=false;});
    if(level!=='pass'&&fits){
      cands.push({text:'Move '+movLabel+' '+d1(Math.abs(dy))+' mm to the '+(dy<0?'left':'right')+'.',apply:function(c){c.components.forEach(function(k){if(k.mov&&k.mass>0)k.y=round1(k.y+dy);});}});}
    add('lat',level,'Lateral balance',detail,ok,cands);
    if(level!=='pass'&&!fits&&!noFix)items[items.length-1].fixes.push({text:'Shift '+Math.round(Math.abs(M*y))+' g·mm of mass to the '+(y>0?'left':'right')+'; the movable parts cannot do it inside the body width.'});
  })();
  /* 7. CG uncertainty from the mass tolerances */
  (function(){
    var d=r.cgUnc,dS=d/mac*100,lo=sm-dS,level='pass';
    if(sm>=0&&lo<0)level='caution';else if(lo<fl.smMin)level='note';
    var detail='Mass tolerances put the CG within ±'+d1(d)+' mm (root-sum-square), which is ±'+d1(dS)+'% of static margin: '+d1(lo)+' to '+d1(sm+dS)+'%.'+(level==='caution'?' The low end is unstable.':(level==='note'?' The low end is below the minimum.':''));
    var top=r.uncList.slice(0,3).map(function(u){return u.name+' (±'+d1(u.dx)+' mm)';});
    var it={id:'unc',level:level,title:'CG uncertainty',detail:detail,cands:[],fixes:[]};
    if(level!=='pass'&&top.length)it.fixes.push({text:'Weigh these first: '+top.join(', ')+'.'});
    items.push(it);
  })();
  /* 8. Prop against tail */
  (function(){
    function ok(c,rr){var p=propTail(c,rr);return p.kind==='none'||(p.kind!=='cross'&&p.gap>=c.flt.propGap-1e-6);}
    var p=propTail(cfg,r),level='pass',detail,cands=[],need;
    if(p.kind==='none')detail='No part of the tail lies within the prop disc radius.';
    else if(p.kind==='cross'){level='fail';need=Math.ceil(p.need+fl.propGap);detail='The prop plane cuts through the tail inside the disc radius.';}
    else{
      if(p.gap<fl.propGap)level='caution';need=Math.ceil(fl.propGap-p.gap);
      detail=(p.kind==='ahead'?'The tail trailing edge is '+mm(p.gap)+' ahead of the prop plane':'The tail leading edge is '+mm(p.gap)+' behind the prop plane')+' (criterion '+nm(fl.propGap)+' mm). Zero deflection is the closest case.';
    }
    if(level!=='pass'&&p.kind!=='behind'){
      cands.push({text:'Move the prop plane '+need+' mm aft, with the motor.',apply:function(c){c.prop.x=round1(c.prop.x+need);shiftGroup(c,'prop',need);}});
      cands.push({text:'Move the tail '+need+' mm forward.',apply:function(c){c.tail.xLE=round1(c.tail.xLE-need);shiftGroup(c,'tail',-need);}});
    }else if(level!=='pass'){
      cands.push({text:'Move the prop plane '+need+' mm forward, with the motor.',apply:function(c){c.prop.x=round1(c.prop.x-need);shiftGroup(c,'prop',-need);}});
    }
    add('proptail',level,'Prop to tail clearance',detail,ok,cands);
  })();
  /* 9. Prop against ground, body level */
  (function(){
    function clr(c,rr){return (c.prop.z-c.prop.diam/2)-rr.ground;}
    function ok(c,rr){return clr(c,rr)>=c.flt.groundClr-1e-6;}
    var cl=clr(cfg,r),level=cl<0?'fail':(cl<fl.groundClr?'caution':'pass'),need=Math.ceil(fl.groundClr-cl);
    var detail='With the body level, the prop tips are '+mm(Math.abs(cl))+(cl<0?' below':' above')+' the ground line (criterion '+nm(fl.groundClr)+' mm).';
    add('propgnd',level,'Prop ground clearance',detail,ok,[
      {text:'Raise the thrust line '+need+' mm, to z = '+round1(pr.z+need)+' mm.',apply:function(c){c.prop.z=round1(c.prop.z+need);shiftGroup(c,'prop',0,need);}},
      {text:'Increase the skid or gear height to '+round1(cfg.fus.skid+need)+' mm.',apply:function(c){c.fus.skid=round1(c.fus.skid+need);}}]);
  })();
  /* 10. Tail against ground */
  (function(){
    function low(c,rr){return Math.min(c.tail.z,rr.tail.tipZ)-rr.ground;}
    function ok(c,rr){return low(c,rr)>=0;}
    var l=low(cfg,r),need=Math.ceil(-l);
    if(l<0)add('tailgnd','fail','Tail below the ground line','The lowest tail point is '+mm(-l)+' below the ground line.',ok,[
      {text:'Increase the skid or gear height to '+round1(cfg.fus.skid+need)+' mm.',apply:function(c){c.fus.skid=round1(c.fus.skid+need);}}]);
  })();
  /* 11. Full-throttle current */
  (function(){
    var I=pr.staticCurrent;
    function okE(c){return c.prop.staticCurrent<=c.esc.limit;}
    function okB(c,rr){return c.prop.staticCurrent<=rr.battI;}
    var needE=Math.ceil(I/5)*5,needC=Math.ceil(I/(cfg.batt.mAh/1000)/5)*5;
    add('esc',okE(cfg)?'pass':'fail','ESC current','Full throttle draws '+nm(I)+' A; the ESC is rated '+nm(cfg.esc.limit)+' A.',okE,[{text:'Use an ESC rated '+needE+' A or more.',apply:function(c){c.esc.limit=needE;}}]);
    add('batt',okB(cfg,r)?'pass':'caution','Battery current','Full throttle draws '+nm(I)+' A; the battery can supply '+Math.round(r.battI)+' A (C rating × capacity).',okB,[{text:'Use a pack rated '+needC+'C or more at this capacity.',apply:function(c){c.batt.C=needC;}}]);
    if(I>cfg.motor.iMax)items.push({id:'motor',level:'caution',title:'Motor current',detail:'Full throttle draws '+nm(I)+' A; the motor peak rating is '+nm(cfg.motor.iMax)+' A.',cands:[],fixes:[]});
  })();
  /* 12. Area override */
  if(w.areaOverride!=null)(function(){
    function ok(c,rr){return c.wing.areaOverride==null||Math.abs(c.wing.areaOverride-rr.wing.Sgeo)/rr.wing.Sgeo<=0.03;}
    var da=(w.areaOverride-r.wing.Sgeo)/r.wing.Sgeo*100;
    if(!ok(cfg,r))add('area','note','Wing area override','The override is '+(da>0?'+':'')+d1(da)+'% against span × mean chord ('+r.wing.Sgeo.toFixed(4)+' m²).',ok,[{text:'Clear the override and use the geometric area.',apply:function(c){c.wing.areaOverride=null;}}]);
  })();
  /* Verify each recommendation, and record what else it would break */
  if(!noFix){
    var before={};items.forEach(function(it){before[it.id]=it.level;});
    items.forEach(function(it){
      (it.cands||[]).forEach(function(f){
        if(!f)return;
        var tr=tryCfg(f.apply);
        if(!(tr.r.mass.M>0)||!it.ok(tr.cfg,tr.r))return;
        var side=[];
        validity(tr.cfg,tr.r,{noFix:true}).forEach(function(a){
          if(a.id===it.id||LEVEL_RANK[a.level]>1)return;
          var b=before[a.id];
          if(b==null||LEVEL_RANK[a.level]<LEVEL_RANK[b])side.push(a.title);
        });
        f.side=side;it.fixes.push(f);
      });
    });
  }
  items.forEach(function(it){delete it.cands;});
  items.sort(function(p1,p2){return LEVEL_RANK[p1.level]-LEVEL_RANK[p2.level];});
  return items;
}

/* ---------- Self-tests ---------- */
function selfTests(cur){
  var T=[];
  function near(name,got,exp,tol,note){T.push({name:name,got:got,exp:exp,tol:tol,pass:isFinite(got)&&Math.abs(got-exp)<=tol,note:note||''});}
  function range(name,got,lo,hi,note){T.push({name:name,got:got,exp:lo+' to '+hi,tol:null,pass:isFinite(got)&&got>=lo&&got<=hi,note:note||''});}
  function truth(name,ok,note){T.push({name:name,got:ok?'yes':'no',exp:'yes',tol:null,pass:!!ok,note:note||''});}
  near('ISA density at sea level (kg/m3)',isa(0,0).rho,1.2250,0.0005,'Standard value');
  near('ISA density at 1000 m (kg/m3)',isa(1000,0).rho,1.1117,0.0010,'Standard value');
  var mp=massProps([C('a',100,0,0,0,'point',0,0,0,'measured',0),C('b',300,400,0,0,'point',0,0,0,'measured',0)]);
  near('CG of 100 g at 0 and 300 g at 400 mm (mm)',mp.cg.x,300,1e-9,'Hand calculation');
  var box=massProps([C('box',1000,0,0,0,'box',100,200,300,'measured',0)]);
  near('Box inertia Ixx, 1 kg 0.1 x 0.2 x 0.3 m (kg m2)',box.I.xx,0.0108333,1e-6,'m(b2+c2)/12');
  var two=massProps([C('a',500,0,0,0,'point',0,0,0,'measured',0),C('b',500,1000,0,0,'point',0,0,0,'measured',0)]);
  near('Parallel axis: two 0.5 kg points 1 m apart, Iyy (kg m2)',two.I.yy,0.25,1e-9,'2 x 0.5 x 0.5^2');
  var cyl=massProps([C('cyl',2000,0,0,0,'cyl',500,100,0,'measured',0)]);
  near('Cylinder transverse inertia, 2 kg (kg m2)',cyl.I.yy,0.0429167,1e-6,'m(3r2+L2)/12');
  near('Mean aerodynamic chord, 300 to 150 mm taper (mm)',trapezoid(1,0.3,0.15,0).mac*1000,233.333,0.01,'Hand calculation');
  near('Stall speed, 1.5 kg, 0.4 m2, CLmax 1.2, sea level (m/s)',stallSpeed(1.5*G0,1.225,0.4,1.2),7.0735,0.002,'Hand calculation');
  var ta=thinAirfoil('2412');
  near('NACA 2412 zero-lift angle (deg)',deg(ta.alphaL0),-2.077,0.02,'Thin-airfoil theory, published value');
  near('NACA 2412 quarter-chord moment coefficient',ta.cm,-0.0531,0.0010,'Thin-airfoil theory, published value');
  near('Helmbold lift slope, AR 6, section slope 2 pi (per rad)',helmbold(6,2*PI,0),4.5287,0.001,'Hand calculation');
  var vt=tailGeom({type:'vtail',slant:365,rootChord:160,tipChord:160,sweepLE:0,xLE:845,dihedral:35,z:35,yRoot:20,a0:5.73});
  near('V-tail horizontal share at 35 deg',vt.Sh/vt.S,0.6710,0.0002,'cos^2(35 deg)');
  /* Lifting-line against the exact elliptical-wing solution */
  var bE=2,c0=0.3,SE=PI*bE*c0/4,arE=bE*bE/SE;
  var le=liftingLine({b:bE,a0:2*PI,S:SE,chordFn:function(e){return c0*Math.sqrt(1-e*e);}});
  near('Lifting-line, elliptical wing: lift slope (per rad)',le.a,2*PI/(1+2/arE),1e-6,'Exact: a0 / (1 + a0 / (pi AR))');
  near('Lifting-line, elliptical wing: span efficiency',le.a*le.a/(PI*arE*llInduced(le,1)),1,1e-6,'Exact: e = 1');
  var lr=liftingLine({b:6,cr:1,ct:1,a0:2*PI,S:6});
  range('Lifting-line, rectangular AR 6: lift slope (per rad)',lr.a,4.40,4.60,'Textbook value about 4.5');
  range('Lifting-line, rectangular AR 6: span efficiency',lr.a*lr.a/(PI*6*llInduced(lr,1)),0.93,0.99,'Textbook value about 0.95');
  near('Lifting-line, rectangular wing: first stall at the root (semi-span fraction)',llStall(lr,1.2).eta,0,1e-9,'Known behaviour');
  near('Plain flap effectiveness, 35% chord',flapTau(0.35),0.7066,0.0005,'Thin-airfoil theory, hand calculation');
  near('Turbulent skin friction at Re = 1e6',cfTurb(1e6),0.004471,0.00001,'0.455 / 6^2.58');
  /* Config handling */
  var d=defaultsConfig();d.wing.span=1400;d.components[0].x=95;d.dragItems[0].cda=5;d.prov['wing.span']={src:'measured',tol:0.5};
  truth('Share link encodes and decodes a config exactly',JSON.stringify(decodeShare(encodeShare('t',d)).cfg)===JSON.stringify(d),'Round trip');
  truth('Bad input falls back to defaults',JSON.stringify(normalizeConfig({wing:{span:'abc'},components:'x'}))===JSON.stringify(defaultsConfig()),'Robustness');
  /* Sanity ranges for the default aircraft */
  var d0=defaultsConfig(),r0=compute(d0,true);
  range('Default aircraft: trimmed stall speed (m/s)',r0.Vs,6.5,8.5,'Sanity range');
  range('Default aircraft: cruise CL at 13 m/s',r0.CLcr,0.35,0.45,'Sanity range');
  range('Default aircraft: neutral point (% chord)',r0.hn*100,36,46,'Hand estimate about 41%');
  range('Default aircraft: zero-lift drag coefficient',r0.cd0,0.025,0.050,'Hand estimate about 0.034');
  range('Default aircraft: Oswald efficiency',r0.e,0.70,0.90,'Hand estimate about 0.78');
  range('Default aircraft: maximum lift to drag',r0.LDmax,8,13,'Hand estimate about 10');
  /* Consistency of the configuration on screen */
  var cc=cur||d0,r=compute(cc,true);
  if(r.mass.M>0){
    var tr=tmSolve(r.tm,r.CLcr,r.hcg,0);
    near('Current config: trim solution returns the required lift',tmCL(r.tm,tr.alpha,tr.de),r.CLcr,1e-9,'Consistency');
    near('Current config: trim solution has zero pitching moment',tmCm(r.tm,tr.alpha,tr.de,r.hcg,0),0,1e-9,'Consistency');
    var slope=(tmCm(r.tm,0.05,0,r.hcg,0)-tmCm(r.tm,0,0,r.hcg,0))/0.05;
    near('Current config: moment slope equals -(lift slope x static margin)',slope,-r.a*r.sm,1e-9,'Ties the trim model to the neutral point');
    near('Current config: lift equals weight at cruise CL (N)',r.q*r.wing.S*r.CLcr,r.W,1e-9*Math.max(1,r.W),'Consistency');
    var bad=0,n=0;
    validity(cc,r).forEach(function(it){it.fixes.forEach(function(f){
      if(!f.apply)return;n++;
      var c2=clone(cc);f.apply(c2);c2=normalizeConfig(c2);
      var after=validity(c2,compute(c2,true),{noFix:true}).filter(function(a){return a.id===it.id;})[0];
      if(after&&after.level!=='pass')bad++;
    });});
    truth('Current config: all '+n+' recommendations clear their check when applied',bad===0,'Each one is applied to a copy and re-checked');
  }
  return T;
}

function uid(){seq++;return 'c'+Date.now().toString(36)+seq;}
function isImp(){return state.units==='imperial';}
function toDisp(v,u){var d=UNIT[u];return (isImp()&&d&&d.k)?v*d.k:v;}
function fromDisp(v,u){var d=UNIT[u];return (isImp()&&d&&d.k)?v/d.k:v;}

function trimNum(v,dp){if(v==null||!isFinite(v))return '';return String(parseFloat(v.toFixed(dp==null?4:dp)));}

function act(){for(var i=0;i<state.configs.length;i++){if(state.configs[i].id===state.active)return state.configs[i];}return state.configs[0];}
function cur(){return act().cfg;}

function h(tag,attrs){
  var e=document.createElement(tag),k;
  if(attrs){for(k in attrs){var v=attrs[k];if(v==null||v===false)continue;
    if(k==='text')e.textContent=v;else if(k==='class')e.className=v;
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v===true?'':v);}}
  for(var i=2;i<arguments.length;i++)addKid(e,arguments[i]);
  return e;
}
function addKid(e,c){
  if(c==null||c===false)return;
  if(Array.isArray(c)){c.forEach(function(x){addKid(e,x);});return;}
  e.appendChild(typeof c==='object'?c:document.createTextNode(String(c)));
}
var SVGNS='http://www.w3.org/2000/svg';
function sv(tag,attrs){
  var e=document.createElementNS(SVGNS,tag),k;
  if(attrs){for(k in attrs){if(attrs[k]==null)continue;if(k==='text')e.textContent=attrs[k];else e.setAttribute(k,attrs[k]);}}
  for(var i=2;i<arguments.length;i++){if(arguments[i])e.appendChild(arguments[i]);}
  return e;
}
function clear(e){while(e.firstChild)e.removeChild(e.firstChild);}
var ST_LABEL={fail:'■ Fail',caution:'▲ Caution',note:'● Note',pass:'✓ Pass'};
function stTag(level){return h('span',{class:'st '+level,text:ST_LABEL[level]||''});}

/* ---------- storage, history ---------- */
function save(){
  try{localStorage.setItem(KEY,JSON.stringify({v:2,configs:state.configs,active:state.active,units:state.units,showTol:state.showTol}));}catch(e){}
}
function load(){
  var raw=null;
  try{raw=JSON.parse(localStorage.getItem(KEY));}catch(e){raw=null;}
  if(raw&&Array.isArray(raw.configs)&&raw.configs.length){
    state.configs=raw.configs.slice(0,30).map(function(c){return {id:uid(),name:String(c&&c.name||'Config').slice(0,60),cfg:normalizeConfig(c&&c.cfg)};});
    var idx=0;raw.configs.forEach(function(c,i){if(c&&c.id===raw.active)idx=i;});
    state.active=state.configs[Math.min(idx,state.configs.length-1)].id;
    state.units=raw.units==='imperial'?'imperial':'metric';state.showTol=!!raw.showTol;
  }else{
    state.configs=[{id:uid(),name:'Baseline',cfg:defaultsConfig()}];state.active=state.configs[0].id;
  }
  try{
    var m=/[#&]c=([A-Za-z0-9_-]+)/.exec(location.hash||'');
    if(m){
      var sh=decodeShare(m[1]),js=JSON.stringify(sh.cfg),found=null;
      state.configs.forEach(function(c){if(JSON.stringify(c.cfg)===js)found=c;});
      if(!found){found={id:uid(),name:sh.name,cfg:sh.cfg};state.configs.push(found);}
      state.active=found.id;
    }
  }catch(e){}
  state.compare=state.configs.slice(0,3).map(function(c){return c.id;});
  state.configs.forEach(function(c){hist[c.id]={stack:[JSON.stringify(c.cfg)],idx:0};});
}
function commit(){
  var c=act(),j=JSON.stringify(c.cfg),H=hist[c.id]||(hist[c.id]={stack:[],idx:-1});
  if(H.stack[H.idx]!==j){
    H.stack=H.stack.slice(0,H.idx+1);H.stack.push(j);
    if(H.stack.length>100)H.stack.shift();
    H.idx=H.stack.length-1;
  }
  save();updateBar();renderTests();
}
function undo(dir){
  var c=act(),H=hist[c.id];if(!H)return;
  var n=H.idx+dir;if(n<0||n>=H.stack.length)return;
  H.idx=n;c.cfg=normalizeConfig(JSON.parse(H.stack[n]));
  save();renderInputs();live(true);updateBar();renderTests();
}

/* ---------- modal ---------- */
function modal(o){
  var ov=h('div',{class:'ov'}),inp=null;
  var box=h('div',{class:'modal',role:'dialog','aria-modal':'true'},h('h3',{text:o.title}),o.text?h('p',{text:o.text}):null);
  if(o.input){inp=h('input',{type:'text',class:'minp','aria-label':o.title});inp.value=o.value||'';if(o.readonly)inp.readOnly=true;box.appendChild(inp);}
  function close(){if(ov.parentNode)ov.parentNode.removeChild(ov);}

function flatCfg(cfg){
  var o={},seen={};
  FIELDS.forEach(function(f){
    var v=getPath(cfg,f.path),g='';GROUPS.forEach(function(x){if(x[0]===f.group)g=x[1];});
    if(f.type==='select'){f.options.forEach(function(op){if(op[0]===v)v=op[1];});}
    else if(typeof v==='number')v=trimNum(toDisp(v,f.unit),3)+(f.unit?' '+ulabel(f.unit):'');
    else if(v==null)v='auto';
    o[g+': '+f.label]=String(v);
  });
  cfg.components.forEach(function(c){
    var n=c.name;seen[n]=(seen[n]||0)+1;if(seen[n]>1)n+=' #'+seen[n];
    o['Part: '+n+', mass']=trimNum(toDisp(c.mass,'g'),2)+' '+ulabel('g');
    o['Part: '+n+', x, y, z']=[c.x,c.y,c.z].map(function(v){return trimNum(toDisp(v,'mm'),2);}).join(', ')+' '+ulabel('mm');
  });
  cfg.dragItems.forEach(function(d,i){o['Drag item '+(i+1)]=d.name+', '+trimNum(toDisp(d.cda,'cm2'),3)+' '+ulabel('cm2');});
  return o;
}
function renderCompare(){

  if(sel.length<2){els.compare.appendChild(h('p',{class:'hint',text:'Duplicate this configuration, change something, then tick two or three to compare them.'}));return;}
  var rs=sel.map(function(c){return c.id===state.active&&last?last:compute(c.cfg,true);}),rows=[];

function drawTop(r){

function attachDrag(){
  var svg=els.side,drag=null;
  function pos(e){
    var m=svg.getScreenCTM&&svg.getScreenCTM();if(!m||!svg.createSVGPoint)return null;
    var p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(m.inverse());
  }
  svg.addEventListener('pointerdown',function(e){
    var el=e.target&&e.target.closest?e.target.closest('[data-drag]'):null;if(!el)return;
    var p=pos(e);if(!p)return;
    var k=el.getAttribute('data-drag'),c=cur();
    if(k==='cg'){
      if(!(last&&last.mass.mMov>0)){modal({title:'Nothing is movable',text:'Tick "Movable" on the battery or ballast in the component table, then drag the CG.',noCancel:true});return;}
      drag={type:'cg',x0:p.x,start:c.components.map(function(q){return q.x;}),M:last.mass.M,m:last.mass.mMov};
    }else{
      var i=parseInt(k.split(':')[1],10);if(!c.components[i])return;
      drag={type:'comp',i:i,x0:p.x,start:c.components[i].x};
    }
    try{svg.setPointerCapture(e.pointerId);}catch(err){}
    e.preventDefault();
  });
  svg.addEventListener('pointermove',function(e){
    if(!drag)return;var p=pos(e);if(!p)return;var c=cur(),dx=p.x-drag.x0;
    if(drag.type==='cg'){var shift=dx*drag.M/drag.m;c.components.forEach(function(q,i){if(q.mov)q.x=Math.round(drag.start[i]+shift);});}
    else c.components[drag.i].x=Math.round(drag.start+dx);
    live();
  });
  function end(e){
    if(!drag)return;drag=null;
    try{svg.releasePointerCapture(e.pointerId);}catch(err){}
    renderComponents();commit();
  }
  svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end);
}
