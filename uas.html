<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UAS Flight Analysis</title>
<!-- Standalone-page reset only. If you embed #acsim in an existing page, drop this block. -->
<style>html,body{margin:0;background:#fff}</style>
<style>
#acsim{--paper:#fff;--ink:#1c1917;--mut:#6b6159;--maroon:#6b1422;--maroon2:#8a2a39;--tan:#c9b08a;--sand:#f6f0e6;--sand2:#fbf8f2;--line:#ddd0bd;--fail:#a61b1b;--caut:#8a5a00;--pass:#2f6b45;
  --sans:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;--serif:Georgia,"Iowan Old Style","Palatino Linotype","Times New Roman",serif;
  background:var(--paper);color:var(--ink);font:14px/1.5 var(--sans);min-height:100vh;position:relative;text-align:left;font-variant-numeric:tabular-nums}
#acsim *{box-sizing:border-box}
#acsim h1,#acsim h2,#acsim h3,#acsim p,#acsim ol,#acsim ul{margin:0;padding:0;color:inherit}
#acsim .hdr{background:var(--maroon);color:#fff;padding:22px 24px 20px;border-bottom:4px solid var(--tan)}
#acsim .hdr .in,#acsim .bar .in,#acsim .layout{max-width:1320px;margin:0 auto}
#acsim h1{font:400 26px/1.2 var(--serif);letter-spacing:.005em;color:#fff}
#acsim .hdr p{color:#ecdcc4;margin-top:4px;font-size:14px}
#acsim .bar{position:sticky;top:0;z-index:20;background:var(--sand);border-bottom:1px solid var(--line);padding:8px 24px}
#acsim .bar .in{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#acsim .bar .sp{flex:1}
#acsim .bar label{font-size:13px;color:var(--mut);margin-right:2px}
#acsim .btn,#acsim select,#acsim input{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--tan);border-radius:3px;padding:4px 10px}
#acsim .btn{cursor:pointer;white-space:nowrap;font-size:13px}
#acsim .btn:hover{border-color:var(--maroon);color:var(--maroon)}
#acsim .btn:disabled{opacity:.45;cursor:default;border-color:var(--line);color:var(--mut)}
#acsim .btn.pri{background:var(--maroon);color:#fff;border-color:var(--maroon)}
#acsim .btn.pri:hover{background:var(--maroon2);color:#fff}
#acsim .btn.on{background:var(--maroon);color:#fff;border-color:var(--maroon)}
#acsim .btn.sm{padding:1px 7px;font-size:12px}
#acsim input:focus-visible,#acsim select:focus-visible,#acsim .btn:focus-visible,#acsim a:focus-visible{outline:2px solid var(--maroon);outline-offset:1px}
#acsim input.badv{border-color:var(--fail);background:#fdf1f0}
#acsim .layout{display:grid;grid-template-columns:200px minmax(0,1fr);gap:32px;padding:0 24px 64px}
#acsim nav.toc{position:sticky;top:58px;align-self:start;padding-top:28px}
#acsim nav.toc ol{list-style:none;border-left:2px solid var(--line)}
#acsim nav.toc a{display:block;padding:5px 12px;margin-left:-2px;border-left:2px solid transparent;color:var(--mut);text-decoration:none;font-size:13.5px}
#acsim nav.toc a:hover{color:var(--maroon);border-left-color:var(--maroon)}
#acsim nav.toc a span{display:inline-block;width:22px;color:var(--tan)}
#acsim .mod{padding-top:28px;scroll-margin-top:50px}
#acsim .mod>header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--maroon);padding-bottom:6px;margin-bottom:14px}
#acsim .mod>header .no{font:400 20px var(--serif);color:var(--tan);min-width:20px}
#acsim h2{font:400 20px/1.25 var(--serif);color:var(--maroon)}
#acsim .mod>header p{color:var(--mut);font-size:13px;flex:1;min-width:240px}
#acsim h3{font:600 13.5px/1.3 var(--sans);color:var(--ink);margin-bottom:2px}
#acsim .hint{font-size:12.5px;color:var(--mut);margin-top:8px}
#acsim .kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
#acsim .kv>div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:9px 12px 8px}
#acsim .kv .l{font-size:12.5px;color:var(--mut);display:flex;justify-content:space-between;gap:8px}
#acsim .kv .v{font-size:22px;line-height:1.25;font-weight:600}
#acsim .kv .v small{font-size:12.5px;color:var(--mut);font-weight:400;margin-left:4px}
#acsim .kv .s{font-size:12px;color:var(--mut)}
#acsim .st{font-size:12px;font-weight:600;white-space:nowrap}
#acsim .st.fail{color:var(--fail)}#acsim .st.caution{color:var(--caut)}#acsim .st.pass{color:var(--pass)}#acsim .st.note{color:var(--mut)}
#acsim .scale{margin-top:16px;max-width:760px}
#acsim .scale svg{display:block;width:100%;height:auto}
#acsim .cksum{font-size:13.5px;margin-bottom:8px}
#acsim .ck{display:grid;grid-template-columns:84px minmax(0,1fr);gap:4px 12px;padding:10px 0;border-top:1px solid var(--line)}
#acsim .ck:last-child{border-bottom:1px solid var(--line)}
#acsim .ck .d{color:var(--ink);font-size:13.5px}
#acsim .ck.k-pass .d{color:var(--mut)}
#acsim .ck ul{list-style:none;margin-top:6px}
#acsim .ck li{display:flex;gap:10px;align-items:baseline;padding:4px 0 4px 10px;border-left:3px solid var(--tan);margin-top:4px;font-size:13.5px}
#acsim .ck li .tx{flex:1}
#acsim .ck li .side{display:block;color:var(--caut);font-size:12.5px}
#acsim .tabs{display:flex;flex-wrap:wrap;gap:0 4px;border-bottom:1px solid var(--line);margin-bottom:14px}
#acsim .tabs button{font:inherit;font-size:13.5px;background:none;border:0;border-bottom:3px solid transparent;padding:6px 12px;margin-bottom:-1px;color:var(--mut);cursor:pointer}
#acsim .tabs button:hover{color:var(--maroon)}
#acsim .tabs button.on{color:var(--maroon);border-bottom-color:var(--maroon);font-weight:600}
#acsim .fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:2px 28px}
#acsim .fld{display:grid;grid-template-columns:minmax(0,1fr) 98px 46px 88px;gap:6px;align-items:center;padding:3px 0;border-bottom:1px solid var(--sand)}
#acsim .fld label{font-size:13.5px;color:var(--ink);font-weight:400}
#acsim .fld input.num,#acsim .fld input.txt{width:100%;text-align:right;padding:3px 7px}
#acsim .fld select.val{width:100%;grid-column:2 / span 2;padding:3px 6px}
#acsim .fld .u{font-size:12.5px;color:var(--mut)}
#acsim select.src{font-size:12px;padding:2px 4px;width:100%;border-color:var(--line);color:var(--mut)}
#acsim select.src.measured{color:var(--pass);border-color:var(--pass)}
#acsim select.src.guess{color:var(--caut)}
#acsim .tol{display:none;align-items:center;gap:3px;font-size:12.5px;color:var(--mut)}
#acsim.showtol .tol{display:flex}
#acsim.showtol .fld{grid-template-columns:minmax(0,1fr) 98px 46px 88px 88px}
#acsim .tol input{width:52px;padding:2px 5px;font-size:12.5px;text-align:right}
#acsim .tscroll{overflow-x:auto}
#acsim table{border-collapse:collapse;width:100%;font-size:13.5px;border:0;background:none;margin:0}
#acsim th{font-size:12.5px;font-weight:600;color:var(--mut);text-align:left;padding:5px 8px;border-bottom:1px solid var(--tan);white-space:nowrap;background:none}
#acsim td{padding:4px 8px;border-bottom:1px solid var(--sand);vertical-align:middle;background:none}
#acsim tr.sec th{background:var(--sand);color:var(--maroon);border-bottom:1px solid var(--line);font-size:13px}
#acsim td.n,#acsim th.n{text-align:right;white-space:nowrap}
#acsim td.note{color:var(--mut);font-size:12.5px}
#acsim table.comp input{width:66px;font-size:12.5px;text-align:right;padding:2px 5px}
#acsim table.comp input.nm{width:190px;text-align:left;font-size:13px}
#acsim table.comp select{font-size:12.5px;padding:2px 4px}
#acsim table.comp td{padding:3px 4px}
#acsim table.comp .acts{white-space:nowrap}
#acsim .diff{color:var(--maroon);font-weight:600}
#acsim .fig{border:1px solid var(--line);background:#fff;overflow-x:auto}
#acsim .fig svg{display:block;width:100%;height:auto;touch-action:none}
#acsim .fig svg.side{min-width:700px}
#acsim .fig svg.topv{max-height:520px}
#acsim svg text{font:12px var(--sans);fill:var(--mut)}
#acsim .g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 24px}
#acsim .chart{border:1px solid var(--line);padding:10px 12px 6px}
#acsim .chart .cap{color:var(--mut);font-size:12.5px}
#acsim .chart .lg{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12.5px;color:var(--ink);margin-top:4px}
#acsim .chart .lg span{display:inline-flex;align-items:center;gap:6px}
#acsim .chart svg{display:block;width:100%;height:auto;margin-top:4px}
#acsim .chart svg text{font-size:11px}
#acsim .sub{margin-top:20px}
#acsim .pass{color:var(--pass)}#acsim .fail{color:var(--fail);font-weight:600}
#acsim .ov{position:fixed;inset:0;background:rgba(28,25,23,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
#acsim .modal{background:#fff;border:1px solid var(--tan);border-top:4px solid var(--maroon);padding:18px;max-width:520px;width:100%}
#acsim .modal h3{font-size:15px;margin-bottom:6px}
#acsim .modal p{color:var(--mut);margin-bottom:10px}
#acsim .modal .minp{width:100%}
#acsim .mrow{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
#acsim ul.plain{padding-left:18px;color:var(--mut);max-width:900px}
#acsim ul.plain li{margin:4px 0}
#acsim ul.plain b{color:var(--ink);font-weight:600}
#acsim details summary{cursor:pointer;color:var(--maroon);font-size:13.5px;padding:4px 0}
#acsim .hide{display:none!important}
@media (max-width:1000px){
  #acsim .layout{grid-template-columns:minmax(0,1fr);gap:0;padding:0 14px 48px}
  #acsim nav.toc{position:static;padding-top:14px}
  #acsim nav.toc ol{display:flex;flex-wrap:wrap;border-left:0;gap:2px 4px}
  #acsim nav.toc a{border-left:0;margin:0;padding:3px 8px;background:var(--sand2);border:1px solid var(--line);border-radius:3px}
  #acsim nav.toc a span{width:auto;margin-right:5px}
  #acsim .g2{grid-template-columns:minmax(0,1fr)}
  #acsim .hdr,#acsim .bar{padding-left:14px;padding-right:14px}
}
@media (max-width:700px){#acsim .bar{position:static}#acsim .fgrid{grid-template-columns:minmax(0,1fr)}#acsim .fld{grid-template-columns:minmax(0,1fr) 88px 36px 84px}#acsim .ck{grid-template-columns:minmax(0,1fr)}#acsim h1{font-size:21px}}
@media print{#acsim .bar,#acsim nav.toc,#acsim .simbar,#acsim .simsticks,#acsim .tabs,#acsim .btn,#acsim details>summary{display:none!important}#acsim .layout{display:block;padding:0}#acsim .chart,#acsim .ck,#acsim tr,#acsim .kv>div{break-inside:avoid}#acsim .hdr{-webkit-print-color-adjust:exact;print-color-adjust:exact}#acsim .fig svg.side{min-width:0}}
#acsim .simbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:13px;color:var(--mut)}
#acsim .simbar select{padding:3px 6px;font-size:13px}
#acsim .simview{position:relative;width:100%;aspect-ratio:16/9;max-height:680px;min-height:300px;background:#16263c;border-top:4px solid var(--maroon);border-bottom:4px solid var(--tan);overflow:hidden;touch-action:none}
#acsim .simview:focus-visible{outline:2px solid var(--maroon);outline-offset:2px}
#acsim .simview canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#acsim .simend{margin-top:8px;font-size:13.5px;padding:6px 10px;border-left:3px solid var(--maroon);background:var(--sand2)}
#acsim .simsticks{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;margin-top:10px;font-size:13px}
#acsim .simsticks label{display:flex;flex-direction:column;gap:2px;color:var(--mut)}
#acsim .simsticks input[type=range]{width:190px;padding:0;border:0;background:none;accent-color:var(--maroon)}
</style>
</head>
<body>
<div id="acsim"></div>
<script>
(function(){
'use strict';
/*CORE-START*/
/* =====================================================================
   CORE: configuration schema, physics and tests. No DOM access in here.
   Every physics function is a pure function of the configuration object.
   Frame: origin at nose tip, x aft, y right, z up. Config lengths in mm,
   masses in g, angles in degrees. Physics converts to SI internally.
   ===================================================================== */
var G0=9.80665, R_AIR=287.05287, PI=Math.PI;
function rad(d){return d*PI/180;}
function deg(r){return r*180/PI;}
function clone(o){return JSON.parse(JSON.stringify(o));}
function badKey(k){return k==='__proto__'||k==='constructor'||k==='prototype';}
function getPath(o,p){var a=p.split('.');for(var i=0;i<a.length;i++){if(o==null||badKey(a[i]))return undefined;o=o[a[i]];}return o;}
function setPath(o,p,v){var a=p.split('.');for(var i=0;i<a.length-1;i++){if(badKey(a[i]))return;if(o[a[i]]==null||typeof o[a[i]]!=='object')o[a[i]]={};o=o[a[i]];}if(!badKey(a[a.length-1]))o[a[a.length-1]]=v;}

var SRC=['measured','cad','spec','estimate','guess'];
var SHAPES=['box','cyl','point'];

/* Static test data from the EMAX ECO II 2807 1300KV manual, 25.2 V: [A, g, rpm] */
var PROPS={
 'HQ 7x4x3':{diam:177.8,pitch:101.6,blades:3,pts:[[2.2,300,6550],[4.2,500,9600],[6.5,700,11100],[9.4,900,12500],[13.4,1100,13900]],max:[51.2,2640]},
 'Gemfan 7042 (2-blade)':{diam:177.8,pitch:106.7,blades:2,pts:[[2.2,300,8440],[4,500,10550],[5.4,700,12370],[9.3,900,13960],[12.4,1100,15360]],max:[47.9,2190]},
 'HQ 7x3.5x3':{diam:177.8,pitch:88.9,blades:3,pts:[[2.1,300,7990],[4,500,10100],[6.4,700,11700],[9.2,900,13200],[12.4,1100,14600]],max:[47.1,2580]},
 'Gemfan 7040 (3-blade)':{diam:177.8,pitch:101.6,blades:3,pts:[[2.3,300,8920],[4.1,500,11000],[6.4,700,12800],[9.3,900,14400],[12.5,1100,15700]],max:[45.2,2490]}
};

var GROUPS=[['wing','Wing'],['tail','Tail'],['fus','Fuselage'],['prop','Propulsion'],['aero','Aerodynamics'],['flight','Flight condition'],['crit','Design criteria']];
var FIELDS=[], FIELD_BY_PATH={};
function F(group,path,label,unit,def,src,tol,min,max,tip,opt){
  var f={group:group,path:path,label:label,unit:unit,def:def,src:src,tol:tol,min:min,max:max,tip:tip||''};
  if(opt){for(var k in opt)f[k]=opt[k];}
  FIELDS.push(f);FIELD_BY_PATH[path]=f;
}
/* Wing */
F('wing','wing.span','Span','mm',1520,'cad',1,100,8000,'Tip to tip.');
F('wing','wing.rootChord','Root chord','mm',267.4,'cad',1,20,3000);
F('wing','wing.tipChord','Tip chord','mm',267.4,'cad',1,10,3000,'Equal to the root chord for a rectangular wing.');
F('wing','wing.areaOverride','Area override','m2',null,'guess',0,0.005,20,'Leave blank to use span x mean chord.',{nullable:true});
F('wing','wing.xLE','Root leading edge x','mm',218,'cad',20,-500,6000,'Distance aft of the nose tip.',{abs:true});
F('wing','wing.z','Root chord height z','mm',50,'estimate',10,-600,600,'Above the fuselage centreline.',{abs:true});
F('wing','wing.incidence','Incidence','deg',2,'estimate',1,-10,15,'',{abs:true});
F('wing','wing.dihedral','Dihedral per side','deg',3,'estimate',1,-15,25,'',{abs:true});
F('wing','wing.sweepLE','Leading-edge sweep','deg',0,'cad',0.5,-30,55,'',{abs:true});
F('wing','wing.naca','NACA 4-digit airfoil','',"2412",'cad',0,0,0,'Four digits, for example 2412 or 0012.',{type:'text'});
F('wing','wing.a0','Section lift-curve slope','1/rad',5.73,'estimate',8,3,7,'6.28 in theory; about 5.7 at model Reynolds numbers.');
F('wing','wing.clMax','Section maximum lift coefficient','',1.2,'estimate',10,0.3,3,'Of the airfoil at flight Reynolds number. The wing and trimmed aircraft values are computed.');
F('wing','wing.ailSpanFrac','Aileron span fraction','',0.5,'estimate',10,0,1,'Fraction of each half span, measured in from the tip.');
F('wing','wing.ailChordFrac','Aileron chord fraction','',0.26,'estimate',10,0,0.6);
/* Tail */
F('tail','tail.type','Tail type','','vtail','cad',0,0,0,'',{type:'select',options:[['vtail','V-tail'],['conventional','Conventional']]});
F('tail','tail.rootChord','Panel root chord','mm',160,'cad',2,10,2000);
F('tail','tail.tipChord','Panel tip chord','mm',160,'cad',2,5,2000);
F('tail','tail.slant','Panel length','mm',365,'cad',2,20,3000,'V-tail: length of one panel along the slant. Conventional: horizontal tail half span.');
F('tail','tail.dihedral','Panel angle from horizontal','deg',35,'cad',3,-80,80,'Negative values give an inverted V.',{abs:true,only:'vtail'});
F('tail','tail.incidence','Incidence','deg',0,'estimate',1,-10,10,'',{abs:true});
F('tail','tail.sweepLE','Leading-edge sweep','deg',0,'cad',0.5,-30,55,'',{abs:true});
F('tail','tail.xLE','Root leading edge x','mm',845,'cad',20,0,8000,'',{abs:true});
F('tail','tail.yRoot','Root offset from centreline','mm',20,'cad',5,0,600,'',{abs:true});
F('tail','tail.z','Root height z','mm',35,'cad',10,-600,600,'',{abs:true});
F('tail','tail.a0','Section lift-curve slope','1/rad',5.73,'estimate',10,3,7,'Flat plate: 6.28 in theory, lower in practice.');
F('tail','tail.eta','Tail efficiency','',0.9,'estimate',10,0.5,1.2,'Dynamic pressure at the tail divided by free stream.');
F('tail','tail.surfChordFrac','Control surface chord fraction','',0.35,'cad',10,0,0.8);
F('tail','tail.finHeight','Fin height','mm',180,'guess',10,10,2000,'',{only:'conventional'});
F('tail','tail.finRootChord','Fin root chord','mm',160,'guess',10,10,2000,'',{only:'conventional'});
F('tail','tail.finTipChord','Fin tip chord','mm',110,'guess',10,5,2000,'',{only:'conventional'});
/* Fuselage */
F('fus','fus.noseLen','Nose section length','mm',88,'cad',5,0,2000);
F('fus','fus.boomLen','Main body length','mm',755,'cad',1,50,6000);
F('fus','fus.tailLen','Rear section length','mm',168,'cad',5,0,2000);
F('fus','fus.width','Body width','mm',70,'estimate',10,5,1000);
F('fus','fus.height','Body height','mm',70,'estimate',10,5,1000);
F('fus','fus.skid','Skid or gear height','mm',0,'cad',5,0,600,'How far the skid or wheels hold the belly off the ground.',{abs:true});
/* Propulsion */
F('prop','prop.id','Propeller','','HQ 7x4x3','spec',0,0,0,'Picking a listed prop fills in its data. Choose Custom to type your own.',{type:'select',options:Object.keys(PROPS).map(function(k){return [k,k];}).concat([['custom','Custom']])});
F('prop','prop.diam','Prop diameter','mm',177.8,'spec',1,20,1000);
F('prop','prop.pitch','Prop pitch','mm',101.6,'spec',2,10,800);
F('prop','prop.blades','Blade count','',3,'spec',0,1,8,'',{int:true});
F('prop','prop.staticThrust','Static thrust at full throttle','g',2640,'spec',8,0,50000);
F('prop','prop.staticCurrent','Current at full throttle','A',51.2,'spec',8,0,500);
F('prop','prop.x','Prop plane x','mm',1041,'estimate',15,0,8000,'',{abs:true});
F('prop','prop.z','Thrust line height z','mm',20,'estimate',10,-600,600,'',{abs:true});
F('prop','motor.kv','Motor Kv','rpm/V',1300,'spec',3,50,10000);
F('prop','motor.iMax','Motor peak current','A',52,'spec',0,1,500);
F('prop','esc.limit','ESC current rating','A',60,'guess',0,1,500);
F('prop','batt.cells','Battery cells in series','',6,'spec',0,1,14,'',{int:true});
F('prop','batt.mAh','Battery capacity','mAh',2200,'guess',0,100,50000);
F('prop','batt.C','Battery C rating','',60,'guess',0,1,200);
F('prop','batt.vFull','Full voltage per cell','V',4.2,'spec',0,3,4.5);
/* Flight and environment */
F('flight','flt.V','Design airspeed','m/s',13,'guess',0,2,120);
F('flight','flt.massTarget','Target mass','g',1500,'guess',0,50,100000);
F('flight','env.alt','Field altitude','m',30,'estimate',0,-400,6000);
F('flight','env.dT','Temperature offset from ISA','dC',12,'estimate',0,-50,50,'+12 is about 27 C at sea level.');

F('wing','wing.washout','Washout at the tip','deg',0,'cad',0.5,-5,10,'Tip twisted nose-down relative to the root, varying linearly along the span.',{abs:true});
F('wing','wing.ailMaxDefl','Aileron travel, each way','deg',20,'estimate',10,1,45);
F('tail','tail.thickness','Panel thickness','mm',5,'estimate',20,0.5,100);
F('tail','tail.stallDeg','Panel stall angle','deg',11,'estimate',15,4,20,'Flat plates stall early, around 10 to 12 degrees.');
F('tail','tail.maxDefl','Control surface travel, each way','deg',20,'estimate',10,1,45);
F('tail','tail.surfSpanFrac','Control surface span fraction','',1,'cad',5,0.1,1);
F('aero','aero.ctrlEff','Control effectiveness factor','',0.8,'estimate',15,0.3,1,'Multiplies thin-airfoil flap effectiveness to allow for hinge gaps and viscous losses.');

  name=String(name||'');

  if(/^motor|propeller/i.test(name))return 'prop';

function defaultsConfig(){
  var cfg={schema:1,prov:{},components:defaultComponents(),dragItems:defaultDragItems()};
  FIELDS.forEach(function(f){setPath(cfg,f.path,f.def);});
  return cfg;
}
function getProv(cfg,path){
  var f=FIELD_BY_PATH[path], p=cfg.prov&&Object.prototype.hasOwnProperty.call(cfg.prov,path)?cfg.prov[path]:null;
  return {src:p&&p.src?p.src:f.src, tol:p&&typeof p.tol==='number'?p.tol:f.tol};
}
function coerceField(f,v){
  if(f.type==='select'){for(var i=0;i<f.options.length;i++){if(f.options[i][0]===v)return v;}return undefined;}
  if(f.type==='text'){v=String(v);return /^\d{4}$/.test(v)?v:undefined;}
  if(v===null||v===''){return f.nullable?null:undefined;}
  v=Number(v);if(!isFinite(v))return undefined;
  if(f.int)v=Math.round(v);
  return Math.min(f.max,Math.max(f.min,v));
}
function numOr(v,d,min){v=Number(v);if(!isFinite(v))return d;return (min!=null&&v<min)?min:v;}
function normComponent(c){
  if(!c||typeof c!=='object')return null;
  return {name:String(c.name==null?'Part':c.name).slice(0,60),mass:numOr(c.mass,0,0),x:numOr(c.x,0),y:numOr(c.y,0),z:numOr(c.z,0),
    shape:SHAPES.indexOf(c.shape)>=0?c.shape:'point',lx:numOr(c.lx,0,0),ly:numOr(c.ly,0,0),lz:numOr(c.lz,0,0),
    axis:(c.axis==='y'||c.axis==='z')?c.axis:'x',src:SRC.indexOf(c.src)>=0?c.src:'guess',tol:numOr(c.tol,0,0),mov:!!c.mov,att:ATTS.indexOf(c.att)>=0?c.att:inferAtt(c.name)};
}
/* Accepts anything (old file, shared link, hand-edited JSON) and returns a valid config. */
function normalizeConfig(raw){
  var cfg=defaultsConfig();
  if(!raw||typeof raw!=='object')return cfg;
  FIELDS.forEach(function(f){var v=getPath(raw,f.path);if(v===undefined)return;var c=coerceField(f,v);if(c!==undefined)setPath(cfg,f.path,c);});
  if(Array.isArray(raw.components))cfg.components=raw.components.slice(0,300).map(normComponent).filter(Boolean);
  if(Array.isArray(raw.dragItems))cfg.dragItems=raw.dragItems.slice(0,60).filter(function(d){return d&&typeof d==='object';}).map(function(d){return {name:String(d.name==null?'Item':d.name).slice(0,60),cda:numOr(d.cda,0,0)};});
  if(raw.prov&&typeof raw.prov==='object'){FIELDS.forEach(function(f){
    if(!Object.prototype.hasOwnProperty.call(raw.prov,f.path))return;var p=raw.prov[f.path];if(!p||typeof p!=='object')return;
    cfg.prov[f.path]={src:SRC.indexOf(p.src)>=0?p.src:f.src,tol:numOr(p.tol,f.tol,0)};});}
  return cfg;
}
/* Differences from the defaults, used for short share links. */
function diffConfig(cfg){
  var base=defaultsConfig(), d={f:{}};
  FIELDS.forEach(function(f){var v=getPath(cfg,f.path);if(v!==getPath(base,f.path))d.f[f.path]=v;});
  if(JSON.stringify(cfg.components)!==JSON.stringify(base.components))d.c=cfg.components;
  if(JSON.stringify(cfg.dragItems)!==JSON.stringify(base.dragItems))d.g=cfg.dragItems;
  if(cfg.prov&&Object.keys(cfg.prov).length)d.p=cfg.prov;
  return d;
}
function applyDiff(d){
  var raw=defaultsConfig();
  if(d&&typeof d==='object'){
    if(d.f&&typeof d.f==='object'){Object.keys(d.f).forEach(function(k){if(FIELD_BY_PATH[k])setPath(raw,k,d.f[k]);});}
    if(Array.isArray(d.c))raw.components=d.c;
    if(Array.isArray(d.g))raw.dragItems=d.g;
    if(d.p&&typeof d.p==='object')raw.prov=d.p;
  }
  return normalizeConfig(raw);
}
function b64encode(s){return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function b64decode(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return decodeURIComponent(escape(atob(s)));}
function encodeShare(name,cfg){return b64encode(JSON.stringify({n:name,d:diffConfig(cfg)}));}
function decodeShare(str){var o=JSON.parse(b64decode(str));return {name:String(o.n||'Shared').slice(0,60),cfg:applyDiff(o.d)};}

/* ---------- Atmosphere: ISA troposphere with a temperature offset ---------- */
function isa(alt,dT){
  var T0=288.15,L=0.0065,p0=101325;
  var Tstd=T0-L*alt, p=p0*Math.pow(Tstd/T0,G0/(L*R_AIR)), T=Tstd+(dT||0);
  return {T:T,p:p,rho:p/(R_AIR*T),mu:1.458e-6*Math.pow(T,1.5)/(T+110.4)};
}

/* ---------- Mass, CG and inertia (parallel-axis theorem) ---------- */
function ownInertia(c){
  var m=c.mass/1000,lx=c.lx/1000,ly=c.ly/1000,lz=c.lz/1000;
  if(c.shape==='point')return [0,0,0];
  if(c.shape==='cyl'){ /* lx = length along the axis, ly = diameter */
    var r=ly/2,Ia=0.5*m*r*r,It=m*(3*r*r+lx*lx)/12;
    if(c.axis==='y')return [It,Ia,It];
    if(c.axis==='z')return [It,It,Ia];
    return [Ia,It,It];
  }
  return [m*(ly*ly+lz*lz)/12,m*(lx*lx+lz*lz)/12,m*(lx*lx+ly*ly)/12];
}
function massProps(comps){
  var M=0,sx=0,sy=0,sz=0,i,c,m;
  for(i=0;i<comps.length;i++){c=comps[i];m=c.mass/1000;M+=m;sx+=m*c.x;sy+=m*c.y;sz+=m*c.z;}
  var cg=M>0?{x:sx/M,y:sy/M,z:sz/M}:{x:0,y:0,z:0};
  var I={xx:0,yy:0,zz:0,xz:0,xy:0,yz:0},est=0,mov=0;
  for(i=0;i<comps.length;i++){
    c=comps[i];m=c.mass/1000;var o=ownInertia(c);
    var dx=(c.x-cg.x)/1000,dy=(c.y-cg.y)/1000,dz=(c.z-cg.z)/1000;
    I.xx+=o[0]+m*(dy*dy+dz*dz);I.yy+=o[1]+m*(dx*dx+dz*dz);I.zz+=o[2]+m*(dx*dx+dy*dy);
    I.xz+=m*dx*dz;I.xy+=m*dx*dy;I.yz+=m*dy*dz;
    if(c.src==='estimate'||c.src==='guess')est+=m;
    if(c.mov)mov+=m;
  }
  return {M:M,cg:cg,I:I,estFrac:M>0?est/M:0,mMov:mov};
}

/* ---------- Geometry ---------- */
function trapezoid(span,cr,ct,sweepDeg){ /* one trapezoidal panel pair; span = full span (m) */
  var lam=ct/cr,S=span*(cr+ct)/2;
  var mac=(2/3)*cr*(1+lam+lam*lam)/(1+lam), ymac=(span/6)*(1+2*lam)/(1+lam);
  var tanLE=Math.tan(rad(sweepDeg));
  return {S:S,lam:lam,mac:mac,ymac:ymac,xmacOff:ymac*tanLE,tanHalf:tanLE-(cr-ct)/span};
}
function wingGeom(w){
  var b=w.span/1000,g=trapezoid(b,w.rootChord/1000,w.tipChord/1000,w.sweepLE);
  var S=(w.areaOverride!=null&&w.areaOverride>0)?w.areaOverride:g.S;
  return {b:b,S:S,Sgeo:g.S,AR:b*b/S,lam:g.lam,mac:g.mac,ymac:g.ymac,xLEmac:w.xLE/1000+g.xmacOff,tanHalf:g.tanHalf};
}
/* Finite-wing lift-curve slope, Helmbold form as used in USAF DATCOM and Raymer (M = 0). */
function helmbold(AR,a0,tanHalf){
  var k=a0/(2*PI);
  return 2*PI*AR/(2+Math.sqrt(4+(AR/k)*(AR/k)*(1+tanHalf*tanHalf)));
}
/* V-tail by the projected-area theory of NACA Report 823 (Purser and Campbell):
   pitch uses S*cos^2(angle), yaw uses S*sin^2(angle), with the lift slope taken normal to the panel. */
function tailGeom(t){
  var s=t.slant/1000,g=trapezoid(2*s,t.rootChord/1000,t.tipChord/1000,t.sweepLE);
  var x0=t.xLE/1000,out={S:g.S,AR:(2*s)*(2*s)/g.S,mac:g.mac};
  out.aN=helmbold(out.AR,t.a0,g.tanHalf);
  out.xac=x0+g.xmacOff+0.25*g.mac;
  if(t.type==='vtail'){
    var gam=rad(t.dihedral),c2=Math.cos(gam)*Math.cos(gam);
    out.Sh=g.S*c2;out.Sv=g.S*(1-c2);out.xacV=out.xac;
    out.tipZ=t.z+t.slant*Math.sin(gam);out.tipY=t.yRoot+t.slant*Math.cos(gam);
  }else{
    var fr=t.finRootChord/1000,ft=t.finTipChord/1000,fl=ft/fr;
    out.Sh=g.S;out.Sv=(t.finHeight/1000)*(fr+ft)/2;
    out.xacV=x0+0.25*(2/3)*fr*(1+fl+fl*fl)/(1+fl);
    out.tipZ=t.z+t.finHeight;out.tipY=t.yRoot+t.slant;
  }
  return out;
}
/* Apparent-mass factor (k2 - k1) for an ellipsoid of revolution, from Lamb's coefficients. */
var MUNK_K=[[1,0],[2,0.493],[3,0.681],[4,0.778],[5,0.836],[6,0.873],[8,0.916],[10,0.939],[20,0.98],[50,1]];
function interp(tab,x){
  if(x<=tab[0][0])return tab[0][1];
  for(var i=1;i<tab.length;i++){if(x<=tab[i][0]){var a=tab[i-1],b=tab[i];return a[1]+(b[1]-a[1])*(x-a[0])/(b[0]-a[0]);}}
  return tab[tab.length-1][1];
}
function fusGeom(fu){
  var w=fu.width/1000,h=fu.height/1000,L=(fu.noseLen+fu.boomLen+fu.tailLen)/1000;
  var vol=w*h*(fu.noseLen/3+fu.boomLen+fu.tailLen*0.5)/1000;
  var deq=Math.sqrt(4*w*h/PI),fr=L/deq;
  return {L:L,vol:vol,deq:deq,fineness:fr,k21:interp(MUNK_K,fr)};
}
/* Thin-airfoil theory for a NACA 4-digit camber line (Anderson, Fundamentals of Aerodynamics). */
function thinAirfoil(code){
  var s=String(code);if(!/^\d{4}$/.test(s))s='0012';
  var m=+s.charAt(0)/100,p=+s.charAt(1)/10,t=+s.slice(2)/100;
  if(m===0||p===0)return {m:0,p:0,t:t,alphaL0:0,cm:0};
  var N=4000,I0=0,I1=0,I2=0,dth=PI/N;
  for(var i=0;i<N;i++){
    var th=(i+0.5)*dth,x=(1-Math.cos(th))/2;
    var dz=x<p?2*m/(p*p)*(p-x):2*m/((1-p)*(1-p))*(p-x);
    I0+=dz*(Math.cos(th)-1)*dth;I1+=dz*Math.cos(th)*dth;I2+=dz*Math.cos(2*th)*dth;
  }
  return {m:m,p:p,t:t,alphaL0:-I0/PI,cm:(PI/4)*((2/PI)*I2-(2/PI)*I1)};
}
function nacaOutline(code,n){ /* unit-chord outline, upper surface then lower, for drawing */
  var a=thinAirfoil(code),up=[],lo=[];n=n||30;
  for(var i=0;i<=n;i++){
    var x=(1-Math.cos(PI*i/n))/2;
    var yt=5*a.t*(0.2969*Math.sqrt(x)-0.1260*x-0.3516*x*x+0.2843*x*x*x-0.1015*x*x*x*x);
    var yc=0;
    if(a.m>0&&a.p>0)yc=x<a.p?a.m/(a.p*a.p)*(2*a.p*x-x*x):a.m/((1-a.p)*(1-a.p))*((1-2*a.p)+2*a.p*x-x*x);
    up.push([x,yc+yt]);lo.push([x,yc-yt]);
  }
  return up.concat(lo.reverse());
}
function stallSpeed(W,rho,S,clMax){return (W>0&&S>0&&clMax>0)?Math.sqrt(2*W/(rho*S*clMax)):0;}
function staticMargin(xcg,xnp,mac){return (xnp-xcg)/mac;}

/* ---------- Numerical tools ---------- */
function solveLin(A,b){ /* Gaussian elimination with partial pivoting */
  var n=b.length,i,j,k;A=A.map(function(r){return r.slice();});b=b.slice();
  for(i=0;i<n;i++){
    var p=i;for(j=i+1;j<n;j++){if(Math.abs(A[j][i])>Math.abs(A[p][i]))p=j;}
    var t=A[i];A[i]=A[p];A[p]=t;t=b[i];b[i]=b[p];b[p]=t;
    if(Math.abs(A[i][i])<1e-14)return null;
    for(j=i+1;j<n;j++){var f=A[j][i]/A[i][i];if(f===0)continue;for(k=i;k<n;k++)A[j][k]-=f*A[i][k];b[j]-=f*b[i];}
  }
  var x=new Array(n);
  for(i=n-1;i>=0;i--){var s=b[i];for(j=i+1;j<n;j++)s-=A[i][j]*x[j];x[i]=s/A[i][i];}
  return x;
}
function bisect(f,lo,hi,n){
  var flo=f(lo),fhi=f(hi);
  if(!isFinite(flo)||!isFinite(fhi)||flo*fhi>0)return null;
  for(var i=0;i<(n||30);i++){var m=(lo+hi)/2,fm=f(m);if(!isFinite(fm))return null;if(flo*fm<=0){hi=m;}else{lo=m;flo=fm;}}
  return (lo+hi)/2;
}
function round1(v){return Math.round(v*10)/10;}
function shiftGroup(cfg,att,dx,dz){
  cfg.components.forEach(function(c){if(c.att===att){c.x=round1(c.x+(dx||0));c.z=round1(c.z+(dz||0));}});
}

/* ---------- Lifting-line theory ----------
   Glauert's Fourier-series solution of Prandtl's equation (Anderson, Fundamentals of
   Aerodynamics, sec. 5.3), symmetric loading, section slope a0 in place of 2 pi:
     sum A_n sin(n th) (mu n + sin th) = mu sin th (alpha - alpha_L0),  mu = a0 c / (4 b)
   Solved once for unit angle (A1) and once for the twist alone (A2). */
function liftingLine(o){
  var N=o.N||20,b=o.b,i,j,M=[],r1=[],r2=[],eta=[],ch=[],th=[];
  var cf=o.chordFn||function(e){return o.cr+(o.ct-o.cr)*e;};
  for(i=1;i<=N;i++){
    var t=i*PI/(2*N),e=Math.cos(t),c=Math.max(cf(e),1e-6),mu=c*o.a0/(4*b),row=[];
    for(j=0;j<N;j++){var n=2*j+1;row.push(Math.sin(n*t)*(mu*n+Math.sin(t)));}
    M.push(row);r1.push(mu*Math.sin(t));r2.push(-mu*Math.sin(t)*(o.washout||0)*e);
    th.push(t);eta.push(e);ch.push(c);
  }
  var A1=solveLin(M,r1),A2=solveLin(M,r2);
  if(!A1||!A2)return null;
  var AR=b*b/o.S,p=[],q=[];
  for(i=0;i<N;i++){
    var s1=0,s2=0;
    for(j=0;j<N;j++){var sn=Math.sin((2*j+1)*th[i]);s1+=A1[j]*sn;s2+=A2[j]*sn;}
    p.push(4*b/ch[i]*s1);q.push(4*b/ch[i]*s2);
  }
  /* local cl = alpha' p + q, where alpha' is the root angle above the section zero-lift angle */
  return {N:N,AR:AR,a:PI*AR*A1[0],CLb:PI*AR*A2[0],eta:eta,c:ch,p:p,q:q,A1:A1,A2:A2};
}

/* ---------- Longitudinal trim model ----------
   Etkin and Reid form, moments about the CG at fraction h of the mean chord:
     CL = A (al + k) + (Sh/S) Tt
     Cm = Cm_ac + CL (h - h_ac) - VH Tt + Cm_thrust
     Tt = B [ (al + i_t) - eps_a (al + k) + tauE de ]     tail lift on the projected area

  var Tt=(m.cmac+CL*(h-m.hac)+(cmT||0))/m.VH;

/* ---------- Checks ----------

   A recommendation is only shown if applying it to a copy of the configuration clears the

var LEVEL_RANK={fail:0,caution:1,note:2,pass:3};
function propTail(cfg,r){ /* tail stations that lie inside the prop disc radius */
  var t=cfg.tail,pr=cfg.prop,R=pr.diam/2,st=[],i,s,tanS=Math.tan(rad(t.sweepLE));
  var isV=t.type==='vtail',g=isV?rad(t.dihedral):0;
  for(i=0;i<=20;i++){

    st.push({y:t.yRoot+t.slant*s*Math.cos(g),z:t.z+t.slant*s*Math.sin(g),xl:xl,xt:xl+c});
    if(!isV){var cf=t.finRootChord+(t.finTipChord-t.finRootChord)*s,xf=t.xLE+(t.finRootChord-cf);st.push({y:0,z:t.z+t.finHeight*s,xl:xf,xt:xf+cf});}
  }

    if(Math.sqrt(p.y*p.y+(p.z-pr.z)*(p.z-pr.z))>R+5)return;
    if(p.xt<=pr.x)ahead=Math.min(ahead,pr.x-p.xt);
    else if(p.xl>=pr.x)behind=Math.min(behind,p.xl-pr.x);
    else cross=true;

  if(cross)return {kind:'cross',gap:-1,need:Math.max.apply(null,st.map(function(p){return p.xt;}))-pr.x};

function validity(cfg,r,opt){

        apply:function(c){c.wing.xLE=round1(c.wing.xLE+dW);shiftGroup(c,'wing',dW);}});}

  }
  svg.addEventListener('pointerdown',function(e){
    var el=e.target&&e.target.closest?e.target.closest('[data-drag]'):null;if(!el)return;
    var p=pos(e);if(!p)return;
    var k=el.getAttribute('data-drag'),c=cur();
    if(k==='cg'){
      if(!(last&&last.mass.mMov>0)){modal({title:'Nothing is movable',text:'Tick "Movable" on the battery or ballast in the component table, then drag the CG.',noCancel:true});return;}
      drag={type:'cg',x0:p.x,start:c.components.map(function(q){return q.x;}),M:last.mass.M,m:last.mass.mMov};
    }else{
      var i=parseInt(k.split(':')[1],10);if(!c.components[i])return;
      drag={type:'comp',i:i,x0:p.x,start:c.components[i].x};
    }
    try{svg.setPointerCapture(e.pointerId);}catch(err){}
    e.preventDefault();
  });
  svg.addEventListener('pointermove',function(e){
    if(!drag)return;var p=pos(e);if(!p)return;var c=cur(),dx=p.x-drag.x0;
    if(drag.type==='cg'){var shift=dx*drag.M/drag.m;c.components.forEach(function(q,i){if(q.mov)q.x=Math.round(drag.start[i]+shift);});}
    else c.components[drag.i].x=Math.round(drag.start+dx);
    live();
  });
  function end(e){
    if(!drag)return;drag=null;
    try{svg.releasePointerCapture(e.pointerId);}catch(err){}
    renderComponents();commit();
  }
  svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end);
}

/* ---------- boot ---------- */
load();renderShell();updateBar();renderInputs();live(true);renderTests();
window.addEventListener('beforeprint',function(){var d=root.querySelectorAll('details'),i;for(i=0;i<d.length;i++)d[i].open=true;});
root.__acsim={state:state,compute:compute,validity:validity,cur:cur};
})();
</script>
