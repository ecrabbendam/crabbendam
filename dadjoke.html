<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Dad Joke</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f7f6;
        }
        .joke-card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 400px;
            text-align: center;
            border-top: 8px solid #4a90e2;
        }
        h2 {
            color: #333;
            margin-top: 0;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        #joke-text {
            font-size: 1.4rem;
            color: #555;
            line-height: 1.5;
            margin: 20px 0;
            font-style: italic;
        }
        .date-stamp {
            font-size: 0.8rem;
            color: #aaa;
        }
    </style>
</head>
<body>

<div class="joke-card">
    <h2>Dad's Joke of the Day</h2>
    <p id="joke-text">Loading the punchline...</p>
    <div class="date-stamp" id="current-date"></div>
</div>

<script>
    async function getDailyJoke() {
        const jokeElement = document.getElementById('joke-text');
        const dateElement = document.getElementById('current-date');
        
        const today = new Date().toDateString();
        dateElement.innerText = today;

        // Check if we already have a joke stored for today
        const storedJoke = localStorage.getItem('dailyJoke');
        const storedDate = localStorage.getItem('jokeDate');

        if (storedJoke && storedDate === today) {
            // Use the joke we already saved today
            jokeElement.innerText = storedJoke;
        } else {
            // Fetch a new joke from the API
            try {
                const response = await fetch('https://icanhazdadjoke.com/', {
                    headers: { 'Accept': 'application/json' }
                });
                const data = await response.json();
                
                // Save to local storage
                localStorage.setItem('dailyJoke', data.joke);
                localStorage.setItem('jokeDate', today);
                
                jokeElement.innerText = data.joke;
            } catch (error) {
                jokeElement.innerText = "I'm afraid my joke book is stuck. (Connection Error)";
            }
        }
    }

    getDailyJoke();
</script>

</body>
</html>
