<style>
        :root {
            --cream: #f9f9f7;
            --folder-bg: #e2e2da;
            --obsidian: #1a1a1a;
            --slate: #5a5a5e;
            --accent-green: #28a745;
        }

        /* --- PRELOADER --- */
        #preloader {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10000;
            background-color: var(--obsidian);
            background-image: url('images/flowviz.jpg');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            clip-path: circle(150% at 50% 50%);
            opacity: 0;
            animation: fadeInPreloader 0.15s ease forwards;
        }

        @keyframes fadeInPreloader {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .loaded #preloader { 
            clip-path: circle(0% at 50% 50%);
            opacity: 0;
            transition: clip-path 0.3s cubic-bezier(0.77, 0, 0.175, 1), opacity 0.15s ease 0.1s;
            pointer-events: none;
        }

        #main-wrapper {
            filter: blur(10px);
            opacity: 0;
            transition: filter 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
        }

        .loaded #main-wrapper { 
            filter: blur(0px); 
            opacity: 1;
        }

        /* --- BODY SETUP & PADDING FIX --- */
        body, html {
            margin: 0; padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--cream);
            color: var(--obsidian);
            overflow-x: hidden;
            padding-top: 35px; 
        }

        /* --- ULTRA-SLIM INTEGRATED HEADER NAV --- */
        nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            height: 35px; 
            padding: 0 4%; 
            box-sizing: border-box;
            z-index: 100;
            background: rgba(249, 249, 247, 0.98);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0,0,0,0.1);
        }

        .back-btn {
            text-decoration: none; color: var(--obsidian);
            font-weight: 700; text-transform: uppercase;
            font-size: 0.8rem; display: flex; align-items: center; gap: 6px;
            white-space: nowrap;
            flex: 1;
            height: 100%;
        }

        /* --- SEIKO-STYLE TABS (Tight Fit) --- */
        .tab-nav {
            display: flex;
            gap: 25px; 
            align-items: center; 
            justify-content: center;
            flex-wrap: nowrap; 
            overflow-x: auto;
            overflow-y: hidden;
            -ms-overflow-style: none;  
            scrollbar-width: none; 
            touch-action: pan-x; 
            flex: 3; 
            height: 100%;
        }

        .tab-nav::-webkit-scrollbar { 
            display: none; 
        }

        .tab-btn {
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent; 
            padding: 0 2px;
            height: 100%; 
            display: flex;
            align-items: center;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            color: var(--slate); 
            cursor: pointer;
            transition: color 0.2s ease, border-color 0.2s ease; 
            white-space: nowrap; 
            box-sizing: border-box;
        }

        .tab-btn:hover {
            color: var(--obsidian);
        }

        .tab-btn.active {
            color: var(--obsidian);
            border-bottom: 2px solid var(--obsidian);
        }

        .social-links {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            white-space: nowrap;
            flex: 1;
            height: 100%;
            font-size: 0.95rem;
        }

        /* --- MOBILE ADJUSTMENTS (Using Grid to completely lock layout) --- */
        @media (max-width: 900px) {
            body, html { 
                padding-top: 85px; /* Matches the exact grid height */
            } 
            
            nav { 
                display: grid;
                grid-template-columns: 1fr 1fr;
                grid-template-rows: auto auto;
                height: auto;
                padding: 8px 4%;
                gap: 6px 0;
                align-items: center;
            }
            
            .back-btn { 
                grid-column: 1;
                grid-row: 1;
                height: 30px;
                flex: none;
            }
            
            .social-links { 
                grid-column: 2;
                grid-row: 1;
                height: 30px;
                justify-content: flex-end;
                flex: none;
            }
            
            .tab-nav { 
                grid-column: 1 / 3;
                grid-row: 2;
                width: 100%; 
                height: 35px;
                justify-content: flex-start;
                flex: none;
                flex-wrap: nowrap; 
                overflow-x: auto; 
                -webkit-overflow-scrolling: touch; 
            }

            .tab-btn {
                font-size: 0.75rem; 
                flex-shrink: 0; 
                padding: 0 5px;
                height: 35px;
            }
        }

        .portfolio-interface {
            position: relative;
            z-index: 2;
        }

        /* --- FLEXBOX LAYOUT FOR VERTICAL CENTERING --- */
        .content-roll-up {
            position: relative;
            z-index: 5;
            background-color: var(--cream);
            display: flex;
            flex-direction: column;
            min-height: calc(100vh - 35px); 
        }

        section {
            padding: 40px 8%; 
            flex-grow: 1; 
            display: flex;
            flex-direction: column;
            justify-content: center; 
            box-sizing: border-box;
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.4s ease-in-out;
            width: 100%;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- PROJECT BLOCKS --- */
        .project-block { display: flex; gap: 40px; margin-bottom: 80px; align-items: flex-start; }
        .project-block:last-child { margin-bottom: 0; } 
        
        .project-info { flex: 1; }
        
        .preview-window { 
            width: 100%; 
            background: #fff; 
            border: 2px solid var(--obsidian); 
            flex: 2; 
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 15px;
            box-sizing: border-box;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.05);
        }
        
        .preview-window img { 
            width: 100%; 
            max-height: 600px;
            object-fit: contain; 
            display: block; 
            background: #f9f9f7;
            border: 1px solid rgba(0,0,0,0.1);
        }

        .preview-window iframe { 
            width: 100%; 
            height: 75vh; 
            min-height: 650px;
            border: 1px solid rgba(0,0,0,0.1);
        }

        .view-btn {
            display: inline-flex; padding: 10px 16px;
            background-color: var(--obsidian); color: white;
            text-decoration: none; font-weight: 600;
            text-transform: uppercase; font-size: 0.7rem;
            border: 2px solid var(--obsidian);
            transition: 0.3s;
            margin-bottom: 8px;
            margin-right: 8px;
        }
        
        .view-btn:hover {
            background-color: var(--slate);
            border-color: var(--slate);
        }

        .cert-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .cert-card {
            border: 2px solid var(--obsidian);
            padding: 30px;
            background: #fff;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.3s ease;
        }

        .cert-card i { font-size: 1.5rem; margin-bottom: 15px; }
        .cert-card h4 { margin: 0 0 10px 0; text-transform: uppercase; font-weight: 800; }
        .cert-card p { font-size: 0.9rem; color: var(--slate); margin-bottom: 20px; }

        @media (max-width: 1100px) { 
            .project-block { flex-direction: column; gap: 20px; } 
            .preview-window iframe { height: 500px; min-height: 400px; }
        }

        /* --- FOOTER --- */
        footer {
            background-color: white;
            padding: 60px 3%;
            text-align: center;
            border-top: 2px solid var(--obsidian);
        }

        .footer-logo {
            font-weight: 900;
            text-transform: uppercase;
            font-size: 1.2rem;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }

        .footer-tagline {
            font-size: 0.8rem;
            color: var(--slate);
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        .home-footer-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: white;
            background: var(--obsidian);
            padding: 18px 35px;
            font-weight: 800;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
            transition: 0.3s;
            box-shadow: 6px 6px 0px var(--slate);
        }

        .home-footer-btn:hover {
            transform: translate(-3px, -3px);
            box-shadow: 10px 10px 0px var(--obsidian);
        }

        .footer-socials {
            margin-top: 40px;
            display: flex;
            justify-content: center;
            gap: 25px;
        }

        .footer-socials a {
            color: var(--obsidian);
            font-size: 1.2rem;
            transition: 0.2s;
        }

        .footer-socials a:hover {
            color: var(--accent-green);
        }

    </style>
