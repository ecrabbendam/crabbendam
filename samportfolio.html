<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Samuel Crabbendam</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --cream: #f9f9f7;
            --obsidian: #1a1a1a;
            --slate: #5a5a5e;
            --accent-green: #28a745;
        }

        /* --- PRELOADER --- */
        #preloader {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(249, 249, 247, 0.9); 
            transition: opacity 0.8s ease, visibility 0.8s;
            backdrop-filter: blur(10px);
        }

        #main-wrapper {
            filter: blur(25px);
            transition: filter 1.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .loaded #main-wrapper { filter: blur(0px); }
        .loaded #preloader { opacity: 0; visibility: hidden; }

        .loader-container {
            position: relative;
            width: 120px; height: 120px;
            display: flex; justify-content: center; align-items: center;
        }

        .loader-circle-static {
            position: absolute;
            width: 100px; height: 100px;
            background-color: white;
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            z-index: 2;
        }

        .loader-svg {
            position: absolute;
            width: 120px; height: 120px;
            transform: rotate(-90deg);
            z-index: 1;
        }

        .loader-svg circle {
            fill: none;
            stroke: var(--accent-green);
            stroke-width: 5;
            stroke-linecap: round;
            stroke-dasharray: 345;
            stroke-dashoffset: 345;
            animation: simulateLoad 2.5s ease-out forwards;
        }

        @keyframes simulateLoad {
            0% { stroke-dashoffset: 345; }
            100% { stroke-dashoffset: 45; } 
        }

        .finish-load .loader-svg circle {
            stroke-dashoffset: 0 !important;
            transition: stroke-dashoffset 0.5s ease-in;
        }

        .pun-text {
            margin-top: 20px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.75rem;
            color: var(--obsidian);
        }

        /* --- HERO IMAGE & MOBILE FIX --- */
        .hero-reveal-container {
            position: relative;
            height: 65vh;
            width: 100%;
            overflow: hidden;
        }

        .hero-image {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: url('images/flowviz.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            z-index: -1;
        }

        @media (max-width: 768px) {
            .hero-reveal-container { height: 40vh; }
            .hero-image { background-attachment: scroll; }
        }

        /* --- CONTENT --- */
        .content-roll-up {
            position: relative;
            z-index: 2;
            background-color: var(--cream);
            box-shadow: 0 -15px 40px rgba(0,0,0,0.3);
        }

        body, html {
            margin: 0; padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--obsidian);
            color: var(--obsidian);
        }

        nav {
            position: fixed;
            top: 0; width: 100%;
            display: flex; justify-content: space-between; align-items: center;
            padding: 18px 8%;
            box-sizing: border-box;
            z-index: 100;
            background: rgba(249, 249, 247, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0,0,0,0.1);
        }

        .back-btn {
            text-decoration: none; color: var(--obsidian);
            font-weight: 700; text-transform: uppercase;
            font-size: 0.9rem; display: flex; align-items: center; gap: 10px;
        }

        section {
            padding: 80px 8%;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .section-title {
            font-size: clamp(1.8rem, 5vw, 2.5rem); 
            font-weight: 900;
            text-transform: uppercase; margin-bottom: 40px;
        }

        .cert-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .cert-card {
